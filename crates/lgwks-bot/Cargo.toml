[package]
name = "lgwks_bot"
description = "Workflow orchestration on one ECS world: script! flows with bounded fan-out, deadlines, retries under a shared budget and tenant-keyed steps, over one tokio driver used only where rebuilding makes no sense."
version = "4.0.0"
edition = "2024"
rust-version = "1.98"
# Deliberately not the workspace's Apache-2.0: the bot is the artefact the whole
# estate embeds, so it carries file-level copyleft while its three siblings stay
# permissive. A proprietary consumer is still permitted — MPL-2.0 §3.3 — and
# only modification of the MPL-covered files carries an obligation. See
# `LICENSING.md` at the repository root for the dual-licence model.
license = "MPL-2.0"
repository = "https://github.com/srinji-kaggss/logicalworks-crates"
documentation = "https://docs.rs/lgwks_bot"
homepage = "https://github.com/srinji-kaggss/logicalworks-crates/tree/main/crates/lgwks-bot"
readme = "README.md"
categories = ["development-tools", "asynchronous", "concurrency"]
keywords = ["orchestration", "workflow", "ecs", "agent", "automation"]

# The driver behind the orchestration runtime is this crate's, per the deps law;
# its `tokio` edge is owned by the `lgwks_deps` storefront. `--no-default-features`
# is a narrow test build with no driver, leaving the four verbs on
# `lgwks_std::task`'s zero-dependency executor; it is not the supported surface.
#
# `io` is not implied by `rt` for the same reason the storefront splits it: a
# consumer reading a pipe needs `AsyncRead` without a socket layer.
[features]
# The default set is the portable boundary, and this crate is the one where that
# is the whole of the rule (ADR 0003, "the target veto"): the WASI boundary step
# builds exactly these defaults for `wasm32-wasip1`, and the T22 row asserts on
# this set — through a consumer that names no features — that `script!`, `task`
# and the four verbs are reachable and that a process description is not. A
# default carrying `net`, `process`, `fs`, `signal` or `inspect` fails both: it
# cannot compile for the boundary target, and it would make the row's claim false
# rather than untested. `ecs`, `trace`, `wire` and `ron` are default-on because
# every capability the estate owns is on by default (ADR 0003, #732): the ECS
# substrate is how a bot executes, the trace macros are the observability path,
# and the wire and RON encodings are what the journal and the session persist.
# All four build for the boundary target, and `default-features = false` opts a
# process-only consumer out of every one of them (#687). Every other capability
# is one feature away, `full` carries all of them, and the suite runs `full`
# so none rots.
default = ["script", "ecs", "trace", "wire", "ron"]
rt = ["lgwks_deps/tokio"]
time = ["rt", "lgwks_deps/tokio-time"]
sync = ["rt", "lgwks_deps/tokio-sync"]
macros = ["rt", "lgwks_deps/tokio-macros"]
# `script!`: the indented orchestration language and the runtime it expands
# into (`lgwks_bot::script`). Default-on because it is how flows are meant to be
# written here: every block it offers is bounded, deadline-carrying, keyed by
# tenant and step, and recorded in the `ARCHITECTURE` map. The proc macro is
# first-party (`lgwks_macros`); its `syn`/`quote` edge is owned by the
# `lgwks_deps` storefront and compiles for the host only.
# `lgwks_ast/script` (no grammar; the parser `lgwks_macros` already builds) is
# where the map's one rendering lives, `lgwks_ast::script::write_map`, which the
# script tool prints a parsed script through too (#384).
# `script` implies `wire` and `ecs`: the run store and the admission boundary
# persist through the wire encoding, and a script's verbs execute as `Bot`s on
# the ECS substrate, so a script build without either is half a runtime.
script = ["rt", "time", "sync", "macros", "dep:lgwks_macros", "dep:lgwks_ast", "lgwks_ast/script", "wire", "ecs"]
# Reader/writer traits. Not implied by `rt`: a consumer reading from a pipe or a
# file needs `AsyncRead` without any of the drivers, and it is the module that
# makes `net`, `process`, and `fs` composable with each other.
io = ["rt", "lgwks_deps/tokio-io"]
# `net` carries the HTTP exchange: the net Observe domain and the idempotent
# POST path both speak through `lgwks_std::http`, so neither compiles it alone.
net = ["io", "lgwks_deps/tokio-net", "lgwks_std/random", "lgwks_std/http"]
# `sync` is implied because the only way this crate runs a command is
# `Supervisor::spawn_process`: `Command` describes, and the supervisor is what
# starts it. A `process` build without `sync` would expose the description and
# not the sanctioned runner, which is a configuration whose only remaining
# runner is the banned `Command::spawn`. `lgwks_std/process` is the audited
# group-kill syscall (`contract/APPROVED.toml` records rustix under `lgwks_std`
# with exactly this reason: killing a shell must reach its grandchildren, which
# `Child::kill` cannot do); this enables it, and adds no dependency.
process = ["io", "sync", "time", "lgwks_std/process", "lgwks_deps/tokio-process"]
fs = ["io", "lgwks_deps/tokio-fs"]
signal = ["rt", "lgwks_deps/tokio-signal"]
# `inspect`: typed in-process structural code inspection (R8). Host-only, like
# `process`/`fs`/`net`: it pulls the native tree-sitter grammars through
# `lgwks_ast`, which cannot build for the WASI boundary target. `full` turns it
# on so the gate exercises it rather than letting it rot as an unbuilt candidate.
#
# Every grammar, so a subject in any language the estate carries is inspected
# rather than answered `Unsupported`; `lgwks_ast/full` is exactly that list and
# no more. It does not name `lgwks_ast/default`, which also carries the
# `lgwks-ast` CLI (`tool`) and the zero-gate detectors (`scan`) — capabilities
# of that crate, unreachable from this one, and the difference was measured: the
# bot-full suite job went from 263 s to past its 300 s cap compiling them
# (run 39784616607).
inspect = ["dep:lgwks_ast", "lgwks_ast/parser", "lgwks_ast/full"]
# Minting a run identity needs an entropy source, and the estate has exactly
# one: `lgwks_std::random`, whose `random` feature is `getrandom` under
# `lgwks_std`'s ownership. This crate authors no edge of its own — it turns on a
# feature of a dependency it already has — which is what keeps the tree at one
# entropy source rather than two. `lgwks_std`'s INV-RANDOM-ONE-SOURCE is the
# reason there is no cheaper fallback here: a run id derived from a clock or a
# counter is the shortcut that invariant exists to refuse.
#
# Not on by default, and the reason was the target rather than the cost. Minting
# an identity needs OS entropy, this crate's *default* feature set is built for
# `wasm32-wasip1` by the WASI boundary job, and `lgwks_std::random` used to be
# linux/macOS/windows only with a `compile_error!` saying so. #276 withdrew that
# refusal: `random` now supports every target `getrandom` supports, and the
# `target-matrix` lane executes `cargo check -p lgwks_std --features random
# --target wasm32-wasip1`, which passes. **The blocker this default-off rested
# on is therefore gone, and whether `ephemeral` belongs on the default feature
# set is now a decision about this crate's default surface rather than about
# portability.** It stays off here so that decision is taken with its own
# evidence: the whole-workspace gate for a default-set change is the bot's, not
# `lgwks_std`'s, and #276 did not run it.
#
# This is the same shape as `signal`, which is also host-only, also not default,
# and also gated in the source. What keeps `ephemeral` from rotting meanwhile is
# that the gate exercises it anyway: `full` includes it, and the runner step
# runs `cargo test -p lgwks_bot --features full`, so `tests/it/ephemeral.rs`
# executes rather than only compiling.
ephemeral = ["lgwks_std/random"]
# `profile`: the per-stage tick profiler `bench/` publishes its decomposition
# from. Default-off for the reason `signal` and `ephemeral` are: it is an
# instrument, not a capability, and a build that pays for an instrument nobody
# asked for is a build whose numbers are about the instrument. Nothing in the
# crate's own execution path reads it, and every charge site in `ecs.rs` is
# behind this feature, so a build without it contains no clock read at all.
#
# `full` turns it on so the runner step exercises the instrument rather than
# letting it rot as an unbuilt candidate — the same treatment `inspect` gets, and
# for the same reason: the profile is only trustworthy while something compiles
# and tests it. It implies `ecs` because every charge site profiles the ECS tick.
profile = ["ecs"]
# `ecs`: the `bevy_ecs` substrate the verbs execute on. Default-on because the
# substrate is how a bot executes; a process-only consumer opts out with
# `--no-default-features`, which is what #687 demands. The gate that refuses a
# second substrate is `tests/it/core_boundary.rs`: only `ecs/` names `bevy`.
# The substrate journals every dispatch through the wire form, so `ecs` carries
# `wire`.
ecs = ["lgwks_deps/bevy-ecs", "wire"]
# `trace`: the tracing facade (`lgwks_std::trace` without its installer).
# Default-on because libraries only emit; the installer lives in
# `lgwks_std/trace-install` and no bot build needs it.
trace = ["lgwks_std/trace"]
# `wire`: the zero-copy wire encoding (`lgwks_std::wire`). Default-on because
# the journal, the tenant store and the effect keys persist through it.
wire = ["lgwks_std/wire"]
# `ron`: the human-facing document notation (`lgwks_std::ron`). Default-on
# because `FlowSpec` reads it beside JSON.
ron = ["lgwks_std/ron"]
full = [
    "rt",
    "time",
    "sync",
    "macros",
    "io",
    "net",
    "process",
    "fs",
    "signal",
    "ephemeral",
    "script",
    "inspect",
    "profile",
    "ecs",
    "trace",
    "wire",
    "ron",
]

[dependencies]
# `json`, `hash` and `trace` are the vocabulary every build speaks: JSON for the
# documents, BLAKE3 for the content identities, and the tracing facade for the
# diagnostics. Default features are off and exactly these three are named, so a
# process-only consumer compiles no TLS stack, no archive format, no RON and no
# subscriber (#687). `net` adds `lgwks_std/http`, `process` adds
# `lgwks_std/process`, `ephemeral` adds `lgwks_std/random`, `wire` and `ron`
# carry the encodings; each gated module implies the feature it reads through.
lgwks_std = { workspace = true, default-features = false, features = ["json", "hash", "trace"] }
# Optional, and behind the default-on `ecs` feature. `Bot` *is* the ECS bot, so
# the default build keeps the substrate; a consumer that only supervises
# processes opts out with `default-features = false` and never compiles
# `bevy_ecs` (#687). Every other `lgwks_deps` edge (`tokio-*` below) enables
# this dependency for its own driver when its feature is on, without the
# substrate: `ecs` alone adds `lgwks_deps/bevy-ecs`.
lgwks_deps = { workspace = true, default-features = false, optional = true }
# The `script!` proc macro. First-party, host-only, optional behind `script`.
lgwks_macros = { workspace = true, optional = true }
# The multi-language AST parser, behind `inspect`. `lgwks_bot` is the consumer
# INV-DEP-1 names for it; the finished parser itself is not grown. Its default
# grammar set includes the two the shipped structural rule set speaks (Rust and
# Python), so the edge needs no feature override.
# Default features off: `inspect` turns on the grammars (`lgwks_ast/default`),
# `script` only the grammar-free `script` reader, so a `script` build compiles
# no tree-sitter and still builds for the WASI boundary target.
lgwks_ast = { workspace = true, optional = true, default-features = false }

[dev-dependencies]
proptest = { version = "1.11", default-features = false, features = ["std"] }
# The script tool's reading (`lgwks_ast::script::read_source`, `Script::to_json`),
# held to the `ARCHITECTURE` this crate's tests compile (#384). No grammar: the
# tool reads tokens, not tree-sitter trees.
lgwks_ast = { workspace = true, default-features = false, features = ["tool"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]


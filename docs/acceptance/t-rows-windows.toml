# The Windows acceptance map: the rows a hosted Windows runner answers, and the
# named tests that answer them. The `acceptance-receipts` binary reads it as it
# reads `t-rows.toml` (`--map docs/acceptance/t-rows-windows.toml`), from the
# JUnit report of the `Process containment on Windows` CI job, and records the
# receipt as `windows-x86_64` with the feature set `process,script,ephemeral`.
#
# T19-T21 name the `process_job` tests, which drive a real job object. Every
# other row names the tests of the `it` binary that carry its row id (`_tNN`, the
# suffix `tests/it/t_rows.rs` documents) and that passed on a hosted Windows
# runner (probe run 38956193594, 2026-10-16); the job runs exactly the `_tNN`
# tests, so the receipt tool fails the run when a named test goes missing or
# fails. A row's `gap` says how many of the tests `t-rows.toml` names for it the
# Windows job does not run; the tests that need a Unix process model (a fake `gh`
# on `PATH`, a signal, a process group) are `cfg(unix)`, do not build there and
# are among them.
# T16 has no entry: its row test failed on a hosted Windows runner with os error 33
# (a lock violation), the job excludes that one test by name, and issue #575 owns
# the fix. Every entry is a nextest name, `<binary>::<test>`, and `state` and
# `gap` mean what they mean in `t-rows.toml`.

schema = 1
spec = "docs/orchestration-acceptance.spec.md"

[[row]]
id = "T01"
requires = "DX-01/03/04"
row = "A one-shot task returns a typed value with one task declaration and call; no fake observer/tick loop or manual reaping."
state = "present"
gap = "The Windows job runs only the row-named `_tNN` tests (its 5-minute bound), so this receipt covers 1 of the 4 tests `t-rows.toml` names for the row; the others are receipted on macOS and Linux."
tests = [
  "it::t_rows::a_one_declaration_one_call_returns_a_typed_value_t01",
]


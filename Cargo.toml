[workspace]
members = [
    "crates/lgwks-std",
    "crates/lgwks-bot",
    "crates/lgwks-ast",
    "crates/lgwks-deps",
]
resolver = "2"

# ─────────────────────────────────────────────────────────────────────────────
# logicalworks-crates workspace dependencies.
#
# Source of truth for `lgwks_std` (estate std+ surface), `lgwks_bot`
# (capability-gated automation verbs and the async runner surface), `lgwks_ast`
# (the estate's one multi-language AST parser), and `lgwks_deps` (dependency
# admission, audit, freshness, and the third-party storefront). This repo is now
# the source of truth: versions bump here and the tagged commit publishes to
# crates.io.
# ─────────────────────────────────────────────────────────────────────────────
[workspace.dependencies]
lgwks_std = { version = "0.6.3", path = "crates/lgwks-std" }
lgwks_bot = { version = "0.3.2", path = "crates/lgwks-bot" }
lgwks_ast = { version = "0.1.3", path = "crates/lgwks-ast" }
# Dependents reach the storefront without its `scan` default (the gate tool's
# Rust parser is not a runtime dependency); they opt into storefront features
# such as `tokio` explicitly.
lgwks_deps = { version = "0.1.8", path = "crates/lgwks-deps", default-features = false }

[profile.release]
opt-level = 3
lto = true

# Shared lint contract: every member opts in with `[lints] workspace = true`.
# Mirrors the crate-level attributes the crates already carried, plus
# `broken_intra_doc_links`, which CI enforces on the docs lanes.
[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
# Rustc-owned lints the anti-pattern corpus names. They are NOT clippy lints:
# naming them under [lints.clippy] is a silent no-op (verified, E0602).
unused_must_use = "forbid"
improper_ctypes = "forbid"
improper_ctypes_definitions = "forbid"

# ─────────────────────────────────────────────────────────────────────────────
# Anti-pattern contract.
#
# Every lint below is `forbid`, not `deny`. A `deny` is defeated by any single
# `#[allow]` anywhere in the crate — including one smuggled in by a macro the
# estate does not own (verified: a macro-internal allow silenced a crate-level
# deny with zero diagnostics). `forbid` cannot be lowered from source; a
# conflicting allow is a hard E0453. That property is the entire reason this
# file can be binding without a human in the loop.
#
# Sourced from the rust anti-pattern corpus (75 entries, 13 Critical) plus
# https://github.com/rust-unofficial/patterns.
#
# Four names in the corpus do not work as written and are corrected here:
#   clippy::unwrap_or_else_default     -> renamed; use unwrap_or_default
#   clippy::improper_ctypes            -> rustc lint, moved to [lints.rust]
#   clippy::improper_ctypes_definitions-> rustc lint, moved to [lints.rust]
#   (similarly, an unknown name in this table is a SILENT no-op, so every
#    addition must be validated against a deliberately-fake control lint)
# ─────────────────────────────────────────────────────────────────────────────
[workspace.lints.clippy]
allow_attributes = "forbid"
allow_attributes_without_reason = "forbid"
arithmetic_side_effects = "forbid"
as_conversions = "forbid"
assigning_clones = "forbid"
await_holding_lock = "forbid"
await_holding_refcell_ref = "forbid"
borrow_as_ptr = "forbid"
cast_possible_truncation = "forbid"
cast_precision_loss = "forbid"
cast_sign_loss = "forbid"
clone_on_ref_ptr = "forbid"
dbg_macro = "forbid"
empty_drop = "forbid"
exhaustive_enums = "forbid"
exhaustive_structs = "forbid"
exit = "forbid"
expect_fun_call = "forbid"
expect_used = "forbid"
explicit_deref_methods = "forbid"
float_cmp = "forbid"
fn_params_excessive_bools = "forbid"
format_push_string = "forbid"
implicit_clone = "forbid"
integer_division = "forbid"
iter_over_hash_type = "forbid"
large_stack_arrays = "forbid"
let_underscore_future = "forbid"
let_underscore_must_use = "forbid"
lossy_float_literal = "forbid"
manual_contains = "forbid"
map_entry = "forbid"
mem_forget = "forbid"
mem_replace_with_default = "forbid"
min_ident_chars = "forbid"
missing_assert_message = "forbid"
missing_docs_in_private_items = "forbid"
missing_safety_doc = "forbid"
modulo_arithmetic = "forbid"
multiple_unsafe_ops_per_block = "forbid"
must_use_candidate = "forbid"
needless_collect = "forbid"
needless_lifetimes = "forbid"
needless_range_loop = "forbid"
panic = "forbid"
panicking_unwrap = "forbid"
pattern_type_mismatch = "forbid"
print_stderr = "forbid"
print_stdout = "forbid"
ptr_arg = "forbid"
rc_buffer = "forbid"
redundant_clone = "forbid"
ref_option_ref = "forbid"
slow_vector_initialization = "forbid"
str_to_string = "forbid"
string_add = "forbid"
todo = "forbid"
transmute_ptr_to_ref = "forbid"
unchecked_time_subtraction = "forbid"
undocumented_unsafe_blocks = "forbid"
unimplemented = "forbid"
unused_io_amount = "forbid"
unwrap_in_result = "forbid"
unwrap_or_default = "forbid"
unwrap_used = "forbid"
wildcard_imports = "forbid"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

# The gate's lane table: the one definition of what the gate runs and where.
#
# The `ci-local` binary executes the local lanes from here. The `check-gate-parity`
# binary asserts every lane that names a `ci_step` matches the step of that name in
# `.github/workflows/ci.yml`, and that every gate step in ci.yml is claimed by a
# lane. A second hand-copied command list drifts, and the drift is invisible
# because each side still looks green on its own terms — which is exactly the
# claim issue #127 refused.
#
# Fields
#   id        stable lane name. The receipt and the tests refer to it.
#   surfaces  "local", "ci", or "local ci". A lane is evidence only for the
#             surfaces named here: a green local run never covers a `ci` lane,
#             and the receipt lists every lane this surface did not cover.
#   required  false only when the lane cannot apply on every host. An
#             unavailable *required* lane is `blocked` and refuses the gate.
#             An unavailable *optional* lane is `skip`, reported by name and
#             never counted as `pass`.
#   command   the exact shell command. Shared lanes carry the text here and CI
#             runs the same string (or a prefix of it, when the CI step adds
#             diagnostics), so the parity check can compare them.
#   ci_step   the step `name:` in ci.yml that runs this lane. Required for any
#             lane with "ci" in surfaces that runs as a named step.
#   ci_job    the job `name:` in ci.yml for a lane that runs as unnamed `run:`
#             steps of a whole job (the AppCUI matrix).
#   builtin   instead of `command`, the name of a check implemented inside the
#             `ci-local` binary. Used for the scanners that must be unit-tested
#             against fixture trees rather than shelled out. When such a lane
#             runs in CI, the step is
#             `cargo run --locked -p lgwks_deps --bin ci-local -- --lane <id>`.
#   needs     prerequisites checked before the lane runs. A missing one makes a
#             required lane `blocked` rather than silently absent.
#             Recognised: `script:<path>` (must exist and be executable),
#             `bin:<name>` (must be on PATH), `os:<name>`.
#   platforms Host names (`darwin`, `linux`, `win32`) this lane applies to. A host outside
#             the list reports the lane `skip` (out of scope) rather than
#             failing it. Omitted means every host.
#   fast      true when the lane belongs to the `--fast` set.
#   reason    why a lane is optional or platform-bound.
#   group     lanes that build the same feature sets. A multi-lane local run
#             executes groups concurrently, each in its own target directory,
#             and a group's lanes in the order listed here, so later lanes reuse
#             what earlier ones built. A lane with no group builds nothing.
#             CI follows the same idea at job granularity (WORKFLOW.md §12):
#             every CI job shares one machine, so lanes that build one feature
#             set run in one job rather than each compiling it again.

[toolchain]
rust = "1.99.0"

# ── shared: one command, both surfaces ──────────────────────────────────────

[[lane]]
id = "lockfile"
surfaces = "local ci"
required = true
fast = true
# The storefront fixtures are separate workspaces with their own lockfiles, and
# every version bump of a workspace crate makes them stale (#175 failed CI on
# exactly that). Checking them here makes the release cut impossible to forget.
command = """\
cargo metadata --locked --format-version 1 >/dev/null && \
for f in crates/lgwks-deps/tests/fixtures/*/Cargo.lock; do if ! cargo metadata --locked --format-version 1 --manifest-path \"${f%.lock}.toml\" >/dev/null; then echo \"stale fixture lockfile $f: run cargo update --workspace --manifest-path ${f%.lock}.toml\" >&2; exit 1; fi; done\
"""
ci_step = "Verify lockfile is up-to-date"

[[lane]]
id = "invariants"
surfaces = "local ci"
required = true
fast = true
builtin = "invariants"
ci_step = "Verify invariant enforcement references resolve"

[[lane]]
id = "deps-register"
group = "workspace"
surfaces = "local ci"
required = true
fast = true
command = "cargo run --locked -p lgwks_deps --bin lgwks-deps -- check ."
ci_step = "Enforce dependency edge ownership"

[[lane]]
id = "std-first"
surfaces = "local ci"
required = true
fast = true
# The audit is the `check-std-first` binary, ported from the Python script it
# replaces because a repository holds Rust and C++ only. Its own tests moved
# with it: they are unit tests of the binary, run by the workspace test lanes,
# so no `--test` flag is needed to keep the audit tested.
command = "cargo run --locked -p lgwks_deps --bin check-std-first"
ci_step = "Audit std-first and lgwks_std-first"

[[lane]]
id = "unwrap-scan"
surfaces = "local ci"
required = true
fast = true
builtin = "unwrap-scan"
ci_step = "Forbid unwrap outside tests"

[[lane]]
id = "compile"
group = "workspace"
surfaces = "local ci"
required = true
fast = true
command = "cargo test --workspace --all-targets --locked --no-run"
ci_step = "Build all workspace targets"

[[lane]]
id = "format"
surfaces = "local ci"
required = true
fast = true
command = "cargo fmt --all -- --check"
ci_step = "Check formatting"

[[lane]]
id = "tests"
group = "workspace"
surfaces = "local ci"
required = true
# The storefront consumer builds run in their own lane and CI job: they are
# nested cargo builds that serialize on one target-directory lock, and in the
# Tests job they alone held the step at 441 s of a 513 s job.
# CI runs this as two shards by setting PARTITION=count:N/2; unset, it is the
# whole suite.
# lgwks_bot's tests are not in this lane: the `tests-bot-full` and
# `tests-bot-nodefault` lanes run them under the feature sets a consumer builds,
# and the `build-verdict` row requires both with this one.
command = "cargo nextest run --workspace --locked -E 'not binary(storefront_consumers) and not package(lgwks_bot)' ${PARTITION:+--partition $PARTITION}"
ci_step = "Run all workspace tests"

[[lane]]
id = "storefront-consumers"
group = "storefront"
surfaces = "local ci"
required = true
command = "cargo nextest run --locked -p lgwks_deps --test storefront_consumers"
ci_step = "Build storefront consumers"

[[lane]]
id = "simulation-evidence"
group = "workspace"
surfaces = "local ci"
required = true
builtin = "simulation-evidence"
ci_step = "Deterministic simulation evidence"
needs = ["bin:cargo-nextest"]

[[lane]]
id = "tests-bot-nodefault"
group = "bot-nodefault"
surfaces = "local ci"
required = true
# CI runs it whole, beside the lgwks-std per-feature lanes; PARTITION=count:N/M
# shards it again if that job grows past its budget.
command = "cargo nextest run -p lgwks_bot --all-targets --locked --no-default-features ${PARTITION:+--partition $PARTITION}"
ci_step = "Run lgwks-bot no-default-feature tests"

[[lane]]
id = "tests-std-full"
group = "bot-full"
surfaces = "local ci"
required = true
# CI runs it whole, on the first lgwks-bot full shard, which builds the same
# feature set.
command = "cargo nextest run -p lgwks_std --all-targets --locked --features full ${PARTITION:+--partition $PARTITION}"
ci_step = "Run lgwks-std full-feature tests"

[[lane]]
id = "tests-bot-full"
group = "bot-full"
surfaces = "local ci"
required = true
# CI runs this as three shards by setting PARTITION=count:N/3; unset, it is the
# whole suite less the saturation tiers, which `tests-bot-saturation` runs. Left
# in, the three tiers (100, 1,000 and 10,000 concurrent runs) land in one shard:
# on run 37205854158 that shard's test phase took 229 s against 61-63 s for the
# other three, and set the whole run's wall at 481 s. On macOS the `ci` profile
# also leaves out the `sim_review_path` binary, which `tests-bot-saturation` runs
# (`.config/nextest.toml`); on Linux the container run keeps every test.
command = "cargo nextest run -p lgwks_bot --all-targets --locked --features full --profile ci -E 'not test(saturation_r32_tier)' ${PARTITION:+--partition $PARTITION}"
ci_step = "Run lgwks-bot async runner tests"

[[lane]]
id = "acceptance-receipts"
surfaces = "ci"
required = true
# The receipt, built from the JUnit reports the lgwks-bot jobs already wrote (the
# full suite and the saturation legs, one directory each) and the Linux and
# Windows legs' (`acceptance-junit`, one directory per leg). The
# `acceptance-receipts` binary reads the XML and records into SQLite
# through the sqlite3 program, so the job builds one std-only binary -- it
# costs seconds, and it does not run the suite a second time.
command = "cargo run --locked -p lgwks_deps --bin acceptance-receipts -- --from-junit acceptance-artifact/*/junit.xml --db acceptance-artifact/receipts.sqlite --export acceptance-artifact/acceptance-receipts.json --revision \"$REVISION\" --platform \"$(uname -s | tr '[:upper:]' '[:lower:]')-$(uname -m)\" && cargo run --locked -p lgwks_deps --bin acceptance-receipts -- --from-junit acceptance-junit/acceptance-junit-linux/junit.xml --db acceptance-artifact/receipts.sqlite --export acceptance-artifact/acceptance-receipts-linux.json --revision \"$REVISION\" --platform linux-aarch64 && cargo run --locked -p lgwks_deps --bin acceptance-receipts -- --map docs/acceptance/t-rows-windows.toml --features process --from-junit acceptance-junit/acceptance-junit-windows/junit.xml --db acceptance-artifact/receipts.sqlite --export acceptance-artifact/acceptance-receipts-windows.json --revision \"$REVISION\" --platform windows-x86_64"
ci_step = "Record acceptance receipts"

[[lane]]
id = "tests-linux"
surfaces = "ci"
required = true
# CI runs on the self-hosted macOS runner; this lane runs the workspace and
# lgwks-bot full suites in a Linux container on it, so the Linux-only paths
# execute on every run. A local macOS run covers the same suites natively.
command = "cargo run --locked -p lgwks_deps --no-default-features --bin linux-container-tests"
ci_step = "Run the workspace and lgwks-bot full suites on Linux"

[[lane]]
id = "tests-bot-saturation"
group = "bot-full"
surfaces = "local ci"
required = true
# The saturation family on its own: it is CPU-bound for about two minutes, so it
# gets its own runner instead of one shard's tail. Builds the `sim_review_path`
# binary it runs, and lgwks_bot's `it` binary on the leg that runs `sim_scale`. That
# binary's other 42 tests, the review-path simulations, and the 164 `sim_scale`
# tests run here too and not in `tests-bot-full` on macOS (`.config/nextest.toml`'s
# `ci` profile filters them out there), so this lane lifts that filter with
# `--ignore-default-filter` and writes the JUnit report the receipt reads.
#
# CI runs the legs of this lane on two instances by setting SATURATION_FILTER to
# the tests each leg takes (the 10,000 tier with the 42 simulations and the
# `sim_scale` module; the 100 and 1,000 tiers together) and SATURATION_BINARIES
# to the test binaries it builds (only the first leg needs `it`); unset, it is
# the whole `sim_review_path` binary.
command = "cargo nextest run -p lgwks_bot --locked --features full --profile ci --ignore-default-filter ${SATURATION_BINARIES:---test sim_review_path} -E \"${SATURATION_FILTER:-binary(sim_review_path)}\""
ci_step = "Run lgwks-bot saturation tiers"

[[lane]]
id = "bench-async-fairness"
group = "bot-full"
surfaces = "local ci"
required = true
# The async rig's three gates, not its timings. `--mutant-check` is the negative
# control: the fairness gate must REFUSE a side that stops draining, and the
# lane fails if it ever accepts one. `--tiers` is the same gate applied at every
# concurrency tier the contract names (100, 1k, 10k, 100k), so a tier that
# drifts mid-run is caught at the round it drifted. `--matrix` drives every
# workload row lgwks_bot can drive today and aborts on the first row that fails,
# so a matrix with a skipped row cannot read as coverage. All three are seconds,
# and all three run against the release build in a target directory of their own:
# the rig is a separate workspace root precisely so its raw-`tokio` edge is
# invisible to `lgwks-deps check`.
command = "cargo run --release --manifest-path bench/async/Cargo.toml -- --mutant-check && cargo run --release --manifest-path bench/async/Cargo.toml -- --tiers && cargo run --release --manifest-path bench/async/Cargo.toml -- --matrix"
ci_step = "Async fairness gate and concurrency ladder"

[[lane]]
id = "digest-timing"
group = "std-full"
surfaces = "local ci"
required = true
# #275: Welch's t over `Digest` equality, a digest against an equal copy and
# against one differing in its first byte, 250,000 samples per class on the
# release build (down from the harness's 1,000,000 default: the wall is linear
# in samples while t scales with its square root, so the early-exit control
# still reads t in the thousands and a sub-1% leak still reads past the
# threshold). It fails when |t| >= 4.5 (dudect's threshold), and also when
# the early-exit negative control is NOT detected, because a harness that
# cannot see a leak proves nothing. Locally this is aarch64-apple-darwin; the CI
# job is x86_64-unknown-linux-gnu, so the two targets the issue names are both
# measured on every change.
command = "cargo run --release --locked -p lgwks_std --features hash --example digest_timing -- --samples 250000"
ci_step = "Digest constant-time equality (dudect)"

# INV-STD-UNSAFE-1: the Miri proof of the two `unsafe` modules, as a lane rather
# than a paragraph. `cargo miri test` and not `cargo miri nextest run`: Miri
# cannot be wrapped and `.config/nextest.toml` wraps every test on macOS in
# `churn-slot`, so nextest handed the wrapper to the interpreter as a double
# spawn and the run failed with exit 70 before a test started; Miri also
# recompiles the test crate once per test, and all seventeen of these tests live
# in one lib binary.
#
# Both halves are cross-interpreted by name, so one host proves both modules:
# `process::darwin::tests` under `--target aarch64-apple-darwin` runs the sysctl
# seam even on a Linux runner, and `process::windows::tests` under
# `--target x86_64-pc-windows-msvc` runs the kernel32 seam. The live-kernel tests
# are already `#[cfg(not(miri))]` in both modules, and the seeded bands already
# shrink under `#[cfg(miri)]`, so no filter is needed here.
#
# The nightly is pinned in this lane, not in `rust-toolchain.toml`: the gate keeps
# one compiler and the proof names its own. `rust-src` is installed up front
# because `cargo miri` otherwise stops to ask before adding it, and a CI step has
# nothing to answer with. `CARGO_BUILD_RUSTC_WORKSPACE_WRAPPER=""` states that
# Miri runs rustc itself (`.cargo/config.toml` wraps every workspace build in
# clippy-driver, and Miri refuses a wrapper), and `-Zmiri-strict-provenance`
# refuses an integer that becomes a pointer without its provenance, which is what
# the Windows stand-in's handles would be if they stopped using
# `without_provenance_mut`.
#
# Measured cold in the repository's Linux container: the install 12 s, the darwin
# seam 33 s (7 tests), the Windows seam 30 s (10 tests), 71 s for the lane; 16 s
# on a warm darwin host. The negative control (the fill given a buffer of half
# the length it names) is caught as an out-of-bounds dangling reference at
# darwin/tests.rs:113 through darwin.rs:191.
[[lane]]
id = "miri-unsafe"
surfaces = "local ci"
required = true
command = """\
rustup toolchain install nightly-2026-10-01 --profile minimal --component miri --component rust-src && \
CARGO_BUILD_RUSTC_WORKSPACE_WRAPPER="" MIRIFLAGS=-Zmiri-strict-provenance cargo +nightly-2026-10-01 miri test -p lgwks_std --features process --locked --lib --target aarch64-apple-darwin process::darwin::tests && \
CARGO_BUILD_RUSTC_WORKSPACE_WRAPPER="" MIRIFLAGS=-Zmiri-strict-provenance cargo +nightly-2026-10-01 miri test -p lgwks_std --features process --locked --lib --target x86_64-pc-windows-msvc process::windows::tests\
"""
ci_step = "Prove the process unsafe seams under Miri"
needs = ["bin:rustup"]

[[lane]]
id = "doc-tests"
group = "workspace"
surfaces = "local ci"
required = true
# nextest does not run doc tests, so this lane stays on cargo test by
# necessity, not by habit.
command = "cargo test --workspace --doc --locked"
ci_step = "Doc tests"

[[lane]]
id = "debug-e2e"
group = "workspace"
surfaces = "local ci"
required = true
builtin = "debug-e2e"
ci_step = "Debug doctor end-to-end journey"

[[lane]]
id = "simulation-evidence-check"
surfaces = "ci"
required = true
# The check row reads the report `simulation-evidence` wrote in the workspace
# job and passes only on that lane's own pass line; rebuilding the workspace to
# list it a second time cost a runner 364 s per run (run 37579691890).
command = "cat gate-evidence/simulation-evidence.txt && grep -q '^<== simulation-evidence: pass' gate-evidence/simulation-evidence.txt"
ci_step = "Check successful simulation result"
reason = "dedicated PR check row whose job name exposes the successful simulation result"

[[lane]]
id = "debug-e2e-check"
surfaces = "ci"
required = true
# As above: the row reads the report `debug-e2e` wrote in the workspace job.
command = "cat gate-evidence/debug-e2e.txt && grep -q '^<== debug-e2e: pass' gate-evidence/debug-e2e.txt"
ci_step = "Check successful end-to-end journey result"
reason = "dedicated PR check row whose job name exposes the successful end-to-end journey result"

[[lane]]
id = "lint"
group = "clippy"
surfaces = "local ci"
required = true
fast = true
command = "cargo clippy --workspace --all-targets --locked -- -D warnings"
ci_step = "Clippy all workspace targets"

[[lane]]
id = "scan"
group = "quality"
surfaces = "local ci"
required = true
fast = true
# The detectors read Rust through `lgwks_ast`, the workspace's one Rust reader
# (ADR 0001, #408), so the lane runs `lgwks-ast scan`. `lgwks_deps` cannot host it:
# `lgwks_ast`'s `script` feature depends on `lgwks_deps`, and the reverse is a cycle.
command = "cargo run --locked --release -p lgwks_ast --no-default-features --features tool,scan --bin lgwks-ast -- scan"
ci_step = "Scan reports zero findings"

[[lane]]
id = "script-check"
group = "quality"
surfaces = "local ci"
required = true
fast = true
# The same feature set as the `scan` lane above, so the two lanes of this group
# build `lgwks-ast` once.
command = "cargo run --locked --release -p lgwks_ast --no-default-features --features tool,scan --bin lgwks-ast -- script check"
ci_step = "Every script! in the repository reads"

[[lane]]
id = "docs-all-features"
group = "docs"
surfaces = "local ci"
required = true
command = "./scripts/doc-lanes.sh all-features"
ci_step = "Doc build with broken-link denial"
needs = ["script:scripts/doc-lanes.sh"]

[[lane]]
id = "llms-txt"
surfaces = "local ci"
required = true
command = "cargo run --locked -p lgwks_deps --bin llms-txt && git diff --exit-code -- llms.txt"
ci_step = "llms.txt matches the documentation index"

[[lane]]
id = "doc-citations"
surfaces = "local ci"
required = true
command = "cargo run --locked -p lgwks_deps --bin check-doc-citations"
ci_step = "Documentation citations resolve"

[[lane]]
id = "contract-drift"
surfaces = "local ci"
required = true
fast = true
builtin = "contract-drift"
ci_step = "Validate the dependency contract alignment"

[[lane]]
id = "requirements"
surfaces = "local ci"
required = true
fast = true
command = "cargo run --locked -p lgwks_deps --bin check-requirements && cargo run --locked -p lgwks_deps --bin check-spec-owners"
ci_step = "Requirements sentences unedited without supersession"

[[lane]]
id = "package-smoke"
group = "workspace"
surfaces = "local ci"
required = true
command = "./scripts/lgwks-std-package-smoke.sh"
ci_step = "Run package smoke test"
needs = ["script:scripts/lgwks-std-package-smoke.sh"]

# ── shared feature sweeps ───────────────────────────────────────────────────
# One command per lane, the same list CI runs. Local pays the wall-clock so a
# green local run is evidence for the CI step of the same name.

[[lane]]
id = "clippy-feature-matrix"
group = "clippy"
surfaces = "local ci"
required = true
command = """\
cargo clippy --locked --manifest-path crates/lgwks-bot/Cargo.toml --all-targets --all-features -- -D warnings && \
cargo clippy --locked --manifest-path crates/lgwks-ast/Cargo.toml --all-targets --all-features -- -D warnings && \
cargo clippy --locked --manifest-path crates/lgwks-deps/Cargo.toml --all-targets --features tokio-full -- -D warnings\
"""
ci_step = "Clippy feature matrix"

[[lane]]
id = "clippy-nodefault"
group = "clippy"
surfaces = "local ci"
required = true
command = """\
cargo clippy --locked --manifest-path crates/lgwks-bot/Cargo.toml --all-targets --no-default-features -- -D warnings && \
cargo clippy --locked --manifest-path crates/lgwks-ast/Cargo.toml --all-targets --no-default-features -- -D warnings && \
cargo clippy --locked --manifest-path crates/lgwks-ast/Cargo.toml --all-targets --no-default-features --features parser -- -D warnings\
"""
ci_step = "Clippy no default features"

[[lane]]
id = "clippy-process-only"
group = "clippy"
surfaces = "local ci"
required = true
command = "cargo clippy --locked --manifest-path crates/lgwks-bot/Cargo.toml --all-targets --no-default-features --features process -- -D warnings"
ci_step = "Clippy process-only"

# lgwks_std has no feature subsets (Director, 2026-10-13): every module is part
# of it, so the gate builds and runs it whole and keeps no per-feature lane.

# The declared target matrix, executed. Before this lane the only non-native
# build in the gate was the bot's WASI boundary, so `lgwks_std`, `lgwks_ast` and
# `lgwks_deps` were never checked for a target the gate does not run on, and
# `random` refused at compile time on every target but three. The script runs
# `cargo check --target <t>` per target and per crate: the Rust-only surface is
# required on every target, and a check that needs a C toolchain this runner
# lacks is recorded with the exact error rather than dropped. (#276)
[[lane]]
id = "target-matrix"
group = "targets"
surfaces = "local ci"
required = true
command = "./scripts/check-target-matrix.sh ${MATRIX_TARGETS:-}"
ci_step = "Check lgwks-std across the declared target matrix"
needs = ["script:scripts/check-target-matrix.sh", "bin:rustup"]

[[lane]]
id = "feat-deps-base"
group = "check"
surfaces = "local ci"
required = true
command = "cargo check --locked --manifest-path crates/lgwks-deps/Cargo.toml --all-targets"
ci_step = "Check lgwks-deps"

[[lane]]
id = "feat-deps-tokio"
group = "check"
surfaces = "local ci"
required = true
command = "cargo check --locked --manifest-path crates/lgwks-deps/Cargo.toml --all-targets --features tokio"
ci_step = "Check lgwks-deps storefront engine feature"

[[lane]]
id = "feat-deps-gpui"
group = "check"
surfaces = "local ci"
required = true
command = "cargo check --locked --manifest-path crates/lgwks-deps/Cargo.toml --all-targets --features gpui"
ci_step = "Check lgwks-deps GPUI storefront feature"

[[lane]]
id = "feat-deps-ml"
group = "check"
surfaces = "local ci"
required = true
command = "cargo check --locked --manifest-path crates/lgwks-deps/Cargo.toml --all-targets --features ml-candle,ml-tokenizers"
ci_step = "Check lgwks-deps ML storefront features"

[[lane]]
id = "feat-bot"
group = "check"
surfaces = "local ci"
required = true
command = """\
cargo check --locked --manifest-path crates/lgwks-bot/Cargo.toml --all-targets --no-default-features && \
cargo check --locked --manifest-path crates/lgwks-bot/Cargo.toml --all-targets && \
cargo check --locked --manifest-path crates/lgwks-bot/Cargo.toml --all-targets --features net,process,fs,signal && \
cargo check --locked --manifest-path crates/lgwks-bot/Cargo.toml --all-targets --all-features\
"""
ci_step = "Check lgwks-bot async feature matrix"

[[lane]]
id = "feat-ast"
group = "check"
surfaces = "local ci"
required = true
command = """\
cargo check --locked --manifest-path crates/lgwks-ast/Cargo.toml --all-targets --no-default-features && \
cargo check --locked --manifest-path crates/lgwks-ast/Cargo.toml --all-targets --no-default-features --features parser && \
cargo check --locked --manifest-path crates/lgwks-ast/Cargo.toml --all-targets && \
cargo check --locked --manifest-path crates/lgwks-ast/Cargo.toml --all-targets --all-features\
"""
ci_step = "Check lgwks-ast feature matrix"

# `RUSTFLAGS=""` states the flags this target builds with: none. Without it a
# machine's `$CARGO_HOME/config.toml` `[build] rustflags` reach the WASI target,
# which has no rustflags table of its own, and nightly-only `-Z` flags there make
# the pinned stable rustc refuse to start. The environment variable is the only
# setting that replaces config rustflags rather than joining them; an empty
# `[target.wasm32-wasip1] rustflags` table is ignored by cargo. (#195)
[[lane]]
id = "wasi-boundary"
group = "check"
surfaces = "local ci"
required = false
command = """\
rustup target add wasm32-wasip1 && \
RUSTFLAGS="" cargo check --locked --manifest-path crates/lgwks-bot/Cargo.toml --target wasm32-wasip1 --features rt\
"""
ci_step = "Check lgwks-bot WASI runtime boundary"
needs = ["bin:rustup"]
reason = "needs rustup and the wasm32-wasip1 target; skip by name when either is absent"

[[lane]]
id = "grammar-matrix"
surfaces = "ci"
required = true
command = """\
cargo test --locked -p lgwks_ast --lib --no-default-features && \
cargo test --locked -p lgwks_ast --lib --no-default-features --features parser && \
cargo test --locked -p lgwks_ast --lib && \
for grammar in bash c cpp csharp css dart elixir go haskell hcl html java javascript json kotlin lua md nix php python ruby rust scala solidity swift tsx typescript yaml; do \
  cargo test --locked -p lgwks_ast --lib --no-default-features --features lang-$grammar || exit 1; \
done && \
cargo test --locked -p lgwks_ast --lib --all-features\
"""
ci_step = "Execute the lgwks-ast grammar matrix"
reason = "CI runs it as a bash loop that reports every grammar; local reports the lane as not covered rather than re-deriving the loop"

[[lane]]
id = "docs-nodefault"
group = "docs"
surfaces = "local ci"
required = true
command = "./scripts/doc-lanes.sh no-default-features"
ci_step = "Doc build without default features"
needs = ["script:scripts/doc-lanes.sh"]

[[lane]]
id = "docs-default"
group = "docs"
surfaces = "local ci"
required = true
command = "./scripts/doc-lanes.sh default"
ci_step = "Doc build at the default feature set"
needs = ["script:scripts/doc-lanes.sh"]

[[lane]]
id = "docsrs-metadata"
group = "docs"
surfaces = "local ci"
required = true
builtin = "docsrs-metadata"
ci_step = "docs.rs metadata names a buildable feature set"

[[lane]]
id = "readme-quickstart"
surfaces = "local ci"
required = true
builtin = "readme-quickstart"
ci_step = "Root README quickstart matches its compiled example"

# ── local only ──────────────────────────────────────────────────────────────
# Working-tree rules the editor hooks enforce on write. Re-checking them here
# means a shell-authored or imported file cannot slip past by never passing
# through the editor. `gate-parity` is the meta-lane: it asserts this manifest
# and ci.yml still describe the same gate.

[[lane]]
id = "suppressions"
surfaces = "local"
required = true
fast = true
builtin = "suppressions"

[[lane]]
id = "artifacts"
surfaces = "local"
required = true
fast = true
builtin = "artifacts"

[[lane]]
id = "gate-parity"
surfaces = "local"
required = true
fast = true
command = "cargo run --locked -p lgwks_deps --bin check-gate-parity"

# ── ci only, platform-bound ─────────────────────────────────────────────────
# A local run never covers these. The receipt names them. On a host outside
# `platforms` the lane is `skip` (out of scope), never `pass`.

# The GPUI Windows renderer builds only on a Windows host. The check runs as the
# GPUI Windows renderer job; naming it here puts it in the one gate table, so
# parity sees it and `ci-local` runs it on a Windows machine. (#195)
[[lane]]
id = "gpui-windows"
group = "check"
surfaces = "local ci"
required = false
command = "cargo check --locked --manifest-path crates/lgwks-deps/tests/fixtures/storefront-matrix/Cargo.toml --target-dir target --no-default-features --features gpui --example gpui"
ci_step = "Check GPUI Windows renderer fixture"
platforms = ["win32"]
reason = "the GPUI Windows renderer builds only on Windows"

# #263 on Windows, executed: the supervisor's job-object path run on a Windows
# host, plus (#271) the `it` tests named for their row (`_tNN`), the portable half
# of the row map. Its JUnit report is the Windows receipt of every row that
# `docs/acceptance/t-rows-windows.toml` names.
[[lane]]
id = "process-windows"
surfaces = "local ci"
required = false
command = "cargo nextest run --locked -p lgwks_bot --no-default-features --features 'process,script,ephemeral' --test process_job --test it --cargo-profile dev --profile ci --no-fail-fast -E 'binary(process_job) | test(/_t[0-9]{2}$/)'"
ci_step = "Run the Windows containment and row tests"
platforms = ["win32"]
reason = "the job object is the Windows kernel's; every other host reports the lane skipped by name"

[[lane]]
id = "appcui-native"
surfaces = "ci"
required = false
command = """\
cargo test --locked -p lgwks_deps --no-default-features --features appcui --lib && \
cargo test --locked -p lgwks_deps --no-default-features --features appcui --doc && \
cargo clippy --locked -p lgwks_deps --no-default-features --features appcui --all-targets -- -D warnings\
"""
ci_job = "AppCUI native storefront"
platforms = ["linux", "darwin", "win32"]
reason = "native storefront; three unnamed run steps, so it binds to the job name"

[[lane]]
id = "gpui-macos"
group = "check"
surfaces = "local ci"
required = false
command = """\
cargo check --locked -p lgwks_deps --all-targets --features gpui && \
cargo check --locked --manifest-path crates/lgwks-deps/tests/fixtures/storefront-matrix/Cargo.toml --target-dir \"${CARGO_TARGET_DIR:-target}\" --no-default-features --features gpui --example gpui\
"""
ci_step = "Check normal GPUI renderer feature"
platforms = ["darwin"]
needs = ["bin:xcodebuild"]
reason = "needs the Xcode Metal toolchain"

[[lane]]
id = "candle-metal"
group = "check"
surfaces = "local ci"
required = false
command = "cargo check --locked -p lgwks_deps --all-targets --features ml-candle-metal,ml-tokenizers"
ci_step = "Check Candle Metal storefront features"
platforms = ["darwin"]
needs = ["bin:xcodebuild"]
reason = "needs the Xcode Metal toolchain"

# The repository's ruleset requires a check named "Clippy and scan", and the lint
# job is a matrix whose legs report under their own names. This row carries the
# required name and passes only when the matrix's aggregate result, which is
# `success` only if every leg succeeded, says so.
[[lane]]
id = "clippy-verdict"
surfaces = "ci"
required = true
command = "test \"${LEGS}\" = success"
ci_step = "Every clippy leg passed"
reason = "dedicated PR check row whose job name is the ruleset's required Clippy and scan"

# The ruleset also requires "Build and workspace tests". The workspace job runs
# every test but lgwks_bot's, and the lgwks_bot jobs (full, saturation, no default
# features) run those; this row carries the required name and passes only when
# all five passed (the fifth is the workspace job's tail: evidence, doc tests, smoke).
[[lane]]
id = "build-verdict"
surfaces = "ci"
required = true
command = "test \"${BUILD}\" = success && test \"${TAIL}\" = success && test \"${BOT_FULL}\" = success && test \"${BOT_SATURATION}\" = success && test \"${BOT_NODEFAULT}\" = success"
ci_step = "Every workspace test job passed"
reason = "dedicated PR check row whose job name is the ruleset's required Build and workspace tests"

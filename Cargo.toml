[workspace]
members = [
    "crates/lgwks-std",
    "crates/lgwks-bot",
    "crates/lgwks-deps",
]
resolver = "2"

# ─────────────────────────────────────────────────────────────────────────────
# logicalworks-crates workspace dependencies.
#
# Source of truth for `lgwks_std` (estate std+ surface), `lgwks_bot`
# (capability-gated automation verbs — the actor roles), and `lgwks_deps`
# (dependency admission, audit, and freshness). Extracted from Braid; crate names and versions are
# unchanged so existing crates.io consumers resolve without edits.
# ─────────────────────────────────────────────────────────────────────────────
[workspace.dependencies]
lgwks_std = { version = "0.5.2", path = "crates/lgwks-std" }
lgwks_bot = { version = "0.1.2", path = "crates/lgwks-bot" }
lgwks_deps = { version = "0.1.0", path = "crates/lgwks-deps" }

[profile.release]
opt-level = 3
lto = true

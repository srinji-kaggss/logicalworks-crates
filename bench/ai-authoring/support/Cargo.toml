# The harness-owned instrumented world the AI-authoring trial solutions call.
#
# It is a member of `bench/ai-authoring`'s own workspace root, never of the
# estate workspace, so `lgwks-deps check .` (which discovers packages through
# Cargo's `workspace_members`) never sees it. Same arrangement as `bench/async`.
[package]
name = "ai_task_support"
description = "Harness-owned instrumented world for the fixed-model AI-authoring benchmark. Not part of the workspace; not published."
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# The async timer the instrumented world sleeps on. `time` implies `rt`; both
# are named so the intent is readable. Never `std::thread::sleep`.
#
# `script` is here for the `recovery` module only, and it is why this crate may
# use a feature the other two tasks' fixtures do not: those two worlds are plain
# async instruments, while a durable unit has to record itself through
# `lgwks_bot::script::remember`, and the whole recovery contract is that the
# record rather than the body is what survives an interruption. A fixture that
# hand-rolled its own durability would be testing the fixture.
lgwks_bot = { path = "../../../crates/lgwks-bot", default-features = false, features = ["rt", "time", "script"] }

# The estate's own tracing facade, for the one place the rig reports a refusal.
# `lgwks_bot` already depends on it, so this names an edge the graph has.
lgwks_std = { path = "../../../crates/lgwks-std", default-features = false, features = ["trace"] }

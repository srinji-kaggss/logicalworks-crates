# logicalworks-crates approved dependency edges — the contract for INV-DEP-EDGE-OWNED.
#
# Read by `lgwks_deps`. A crate reaches this file only after the ladder in
# `lgwks-deps tiers` has been climbed and every rung above a dependency was
# rejected for a stated reason. Adding a block here is an approval; the commit
# that adds it is the signature.
#
# ELIMINATE and CONSOLIDATE crates never appear here. They become a module in
# `crates/lgwks-std` instead, which is why `tier` admits only `boundary` and
# `vendor`.
#
# Extracted from Braid's `contract/APPROVED.toml`; only `lgwks_std`-owned
# entries travel with the crates. Braid-owned entries (braid-capability,
# braid-ir, braid-governance, braid-test-support) stay in Braid.

[policy]
enforce = true
repository = "https://github.com/srinji-kaggss/logicalworks-crates"

[[approved]]
crate = "serde"
tier = "boundary"
version = "^1"
owner = "lgwks_std"
capability = "encoding.serde"
source = "registry"
allowed_consumers = "lgwks_std"
allowed_kinds = "normal"
reason = "Derive-based serialization needs compiler introspection the standard library does not expose."
approved_by = "Director"
approved_on = "2026-08-30"
review = "https://github.com/srinji-kaggss/Braid/issues/91"


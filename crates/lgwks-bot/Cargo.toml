path = "examples/review_pr_bench.rs"
required-features = ["script", "process"]

[[example]]
name = "review_pr"
path = "examples/review_pr.rs"
required-features = ["script", "process"]

[[example]]
name = "tail_cost"
path = "examples/tail_cost.rs"
required-features = ["script", "ephemeral"]

[[example]]

[[patch]]
crate = "ring"
kind = "provider-exception"
owner = "lgwks_std"
reason = "The http feature resolves ring transitively through ureq and rustls with no passing provider verified."
review = "https://github.com/srinji-kaggss/logicalworks-crates/issues/728"
recorded_on = "2026-10-26"
expires_on = "2027-04-26"
blast_radius = "Default-off http feature only; no in-process TLS in the day-0 path and no direct edge."
removal_trigger = "HTTP proofs pass with equal p99 and no ring in the resolved tree."

[[patch]]
crate = "webpki-roots"
kind = "provider-exception"
owner = "lgwks_std"
reason = "The http feature resolves webpki-roots transitively through ureq and rustls with no passing store verified."
review = "https://github.com/srinji-kaggss/logicalworks-crates/issues/728"

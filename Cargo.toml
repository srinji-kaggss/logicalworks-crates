[workspace]
members = [
    "crates/lgwks-std",
    "crates/lgwks-bot",
    "crates/lgwks-ast",
    "crates/lgwks-deps",
]
resolver = "2"

# ─────────────────────────────────────────────────────────────────────────────
# logicalworks-crates workspace dependencies.
#
# Source of truth for `lgwks_std` (estate std+ surface), `lgwks_bot`
# (capability-gated automation verbs and the async runner surface), `lgwks_ast`
# (the estate's one multi-language AST parser), and `lgwks_deps` (dependency
# admission, audit, freshness, and the third-party storefront). This repo is now
# the source of truth: versions bump here and the tagged commit publishes to
# crates.io.
# ─────────────────────────────────────────────────────────────────────────────
[workspace.dependencies]
lgwks_std = { version = "0.6.1", path = "crates/lgwks-std" }
lgwks_bot = { version = "0.3.0", path = "crates/lgwks-bot" }
lgwks_ast = { version = "0.1.1", path = "crates/lgwks-ast" }
# Dependents reach the storefront without its `scan` default (the gate tool's
# Rust parser is not a runtime dependency); they opt into storefront features
# such as `tokio` explicitly.
lgwks_deps = { version = "0.1.5", path = "crates/lgwks-deps", default-features = false }

[profile.release]
opt-level = 3
lto = true

name: Pages

# The one page whose title is the repository's exact name. It runs on `main` and
# by hand only, so no pull request pays for it, and the five-minute budget is
# untouched. The page is generated from the crate list by `render-site`; nothing
# HTML-shaped is committed, because a repository holds Rust.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish the project page
    runs-on: [self-hosted, macOS, ARM64, lwc]
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/local-rust
        with:
          toolchain: "1.99.1"
      # The deploy is conditional on a site existing. Creating one needs an
      # admin token the workflow cannot hold: the first run on 184d819e0 failed
      # with `Resource not accessible by integration` from the create-site
      # endpoint. So the page is rendered either way, a run without a site says
      # why in one notice, and the first run after the site exists publishes
      # with no further change.
      - name: Is a Pages site published?
        id: site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Pages site exists for this repository; the page was rendered into target/site and not published."
          fi
      - name: Render the page
        run: cargo run --locked -q -p lgwks_deps --bin render-site -- target/site
      - uses: actions/configure-pages@v6
        if: steps.site.outputs.exists == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.site.outputs.exists == 'true'
        with:
          path: target/site
      - id: deployment
        uses: actions/deploy-pages@v5
        if: steps.site.outputs.exists == 'true'

# Supply-chain ledger — upstream pins that never become forks, and sealed TLS
# provider exceptions with expiry dates.
#
# When an OSS crate does not work, the answer is an upstream patch, not a
# permanent fork (#723): reproduce in a test, file an upstream issue, open an
# upstream PR, and record the pin here with its digest and expiry. When
# upstream merges, the pin is removed, the lockfile updates, and the regression
# test stays. A fork is never the base; a temporary vendor tree needs a patch
# digest, provenance, expiry and a removal test.
#
# Sealed provider exceptions (#728) excuse the blocked providers the resolved
# tree cannot yet avoid: ring (Apache-2.0 AND ISC) and webpki-roots
# (CDLA-Permissive-2.0) arrive transitively behind the admitted ureq edge. Day
# 0 terminates TLS at the OS reverse proxy with zero new crates; in-process TLS
# needs a provider whose license passes, and until one is verified these two
# rows are the sealed exception with owner, date, blast radius and removal
# path. An expired row is a refusal, and a blocked provider with no live row
# is refused with the chain that pulled it in.
#
# Read by `lgwks_deps`: the ledger is opt-in, and a repository without one is
# audited exactly as before.

# candle 0.11.0 on crates.io requires zip ^8.6 (RUSTSEC-2026-0367..0369,
# GHSA-m665-v7pm-7grj); upstream merged zip 9.1.3 in #4078 and promised a
# release. The digest is the git object id of the pinned merge commit. Remove
# all three rows, the `git`/`rev` keys and the `origin` lines in APPROVED.toml
# when candle 0.11.1 publishes.
[[patch]]
crate = "candle-core"
kind = "upstream-pin"
owner = "lgwks_deps"
reason = "The crates.io release requires zip 8.6, which carries three RustSec advisories and a critical GHSA."
review = "https://github.com/huggingface/candle/issues/4074"
recorded_on = "2026-10-30"
expires_on = "2027-01-30"
version = "0.11.0"
upstream_issue = "https://github.com/huggingface/candle/issues/4074"
upstream_pr = "https://github.com/huggingface/candle/pull/4078"
patch_digest = "git:9515d410e3af803fd45efebfef8137f47d85a63d"

[[patch]]
crate = "candle-nn"
kind = "upstream-pin"
owner = "lgwks_deps"
reason = "It must resolve the same candle-core commit, so it rides the zip pin with it."
review = "https://github.com/huggingface/candle/issues/4074"
recorded_on = "2026-10-30"
expires_on = "2027-01-30"
version = "0.11.0"
upstream_issue = "https://github.com/huggingface/candle/issues/4074"
upstream_pr = "https://github.com/huggingface/candle/pull/4078"

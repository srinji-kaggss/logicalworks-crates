# SDK experience invariants — falsifiable, journey-linked.
#
# Each invariant names the journeys that can falsify it. A failing probe
# below is an experience defect even when every unit test is green.

lanes:
  - id: core
    rule: "Core functions come from std + lgwks_std; a direct dep duplicating an lgwks_std module is refused by review and removable by CONSOLIDATE."
    falsified_by: [bring-up]
  - id: actor
    rule: "Async and actor roles come from lgwks_bot; a bot missing a grant fails at build() with the cap named."
    falsified_by: [bring-up, agent-spec]
  - id: deps
    rule: "Every other dep is registered in contract/APPROVED.toml; lgwks-deps check refuses anything else with the repair named."
    falsified_by: [dep-admission]
  - id: registry
    rule: "A spec's identifiers resolve only through the DomainRegistry the binary declares. An identifier outside it is refused with BotError::UnregisteredDomain naming it, escaped; a source identifier never resolves as an action, nor an action as a source; and a constructor's own refusal (a target it cannot parse) surfaces unchanged through build_source/build_action."
    falsified_by: [agent-spec]

machine_contract:
  - "check: exit 0 admitted, 2 refused; human-readable lines, deterministic per tree."
  - "check --json: one JSON object on stdout, nothing on stderr, exit code unchanged.
     Keys are always root, enforce, admitted, approvals, refusals[], error, with null
     where a value does not apply. admitted is false whenever error is non-null, so a
     consumer reading the payload cannot see admission beside a failed read."
  - "freshness: exit 0 fresh, 1 stale; --json is a stable object array."
  - "BotSpec JSON: stable shape, typed parse errors, zero side effects on validate."
  - "tick(): returns fired-action count; offline sources perform no I/O beyond their documented poll."

known_gaps:
  - "No from_spec: a validated BotSpec cannot be materialized into a runnable Bot through this SDK alone.
     The registry half landed 2026-09-21 (DomainRegistry, the domains! list, Source/Action handles,
     BotError::UnregisteredDomain; enforced by crates/lgwks-bot/tests/registry.rs). The materializer
     half is open, and two obstacles are named rather than assumed away, because neither is plumbing:
     (a) ChainSpec.on is Vec<(String, ActionSpec)>, so a condition is a bare identifier with no slot
     for its parameters — Above<u16> cannot be expressed in a spec at all; and (b) an erased
     Box<dyn ObserveAny> carries no durable statement of the type its Output is, so a condition
     constructor has no serializable type key to resolve against (spec::Witness is TypeId, process
     local). Both must be closed before from_spec can be more than a partial build.
     Two constraints still bind, because they are what made the absence defensible: grants keep
     coming from a caller-held GrantSet and never from the spec, so wire data cannot choose what a
     bot reaches, and there is still no bot! proc-macro — domains! declares the registry as data
     with no proc macro and no new dependency."
  - "No CLI acceptance harness. The dep-admission journey's four probes (no-register,
     unregistered-edge, ladder-then-form, double-init) are verified by hand, not by a
     test in crates/lgwks-deps/tests/. Every other invariants file has an enforcing
     test; this one does not."

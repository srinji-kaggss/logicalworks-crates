name: ci
on:
  # A pull request already runs this matrix for its head commit, so triggering
  # on every branch push ran all eleven jobs a second time for the same tree.
  # A branch is covered by its pull request; `main` is covered here, after the
  # merge that put it there.
  push:
    branches: [main]
  pull_request:

# WORKFLOW.md §12 is this workflow's specification: the nine axes it is held
# to, the budget, and the measurements behind the layout below.
#
# The layout is set by one fact: every self-hosted job runs on one machine (15
# cores, six runner instances). A run's wall clock is its job-seconds divided by
# six, plus whatever waits in the queue, so the layout minimises duplicated work
# rather than maximising the number of jobs. 35 jobs, each compiling its own copy
# of the workspace, put 7,500 job-seconds through six instances and took
# 21.4 minutes (run 37579691890). Lanes that build the same feature set share a
# job (the lane table's `group`), and only the two check-row jobs and the
# acceptance receipt wait on another job: each of them reads a result instead of
# building one.
#
# Every job that builds names the one instance it runs on (`lwc-1` .. `lwc-11`,
# runner labels). An instance keeps one target directory and one container
# target volume; a job free to land on any instance found that instance cold
# for its feature sets, so each of the six had to build every job's sets before
# any run was warm, and the first two runs on this layout spent their budgets
# compiling at a load average of 70-85 (runs 37613720499, 37616318637). Pinned,
# an instance only ever holds its own jobs' builds, and the second run is warm.
# The jobs that build nothing run anywhere. Thirteen instances, one per job
# that builds: with six, a warm run's jobs queued behind one another and the
# run took 601 s although no job took more than 450 s (run 37619560219
# attempt 2).
#
# Each feature set is compiled by exactly one job. A suite split into shards
# across jobs compiled the same set once per shard, at the same time: on run
# 37630747929, a change to lgwks-bot's source had three bot-full shards and
# two workspace shards each compiling for 4-9 minutes at a load near 150,
# while every shard's tests took 66-150 s. A suite now runs in one job, with
# the test threads of the shards it replaced (`test-share`).
#
# Every self-hosted job's timeout is 20 minutes, 30 for the six jobs that
# compile the most (build, bot-full, no-default, docs, the two matrices).
# That is a hang bound, not the budget: the budget is 5 min warm, enforced by
# measurement (WORKFLOW.md §12).
# A toolchain or profile change rebuilds every instance at once — the opt-level
# 2 transition run paid a 638 s full-workspace rebuild on two compiler slots —
# and a transition run must survive that to leave every instance warm. Hung
# tests are still bounded inside the suite by nextest's `slow-timeout` with
# `terminate-after`.
#
# Compiler slots follow what a job compiles, not one rule for all. rustc draws
# its codegen threads from cargo's slots, so at one slot a job's opt-level-3
# lgwks-bot compile ran on one core: 6 m 55 s of an 8 m 16 s build on run
# 38304128455, the run's critical path. The three jobs that compile lgwks-bot's
# test binaries take three slots, the check, doc and opt-level-0 jobs two, the
# rest one. Every job at two slots once filled swap to 96% and killed six jobs
# (run 37675264254); this spends the slots where the codegen is, and the
# per-feature checks and second LTO links it removed are compiles no job runs.

# Supersede rather than duplicate. Two `pull_request` events in one group are
# the same branch pushed twice, so the older run is cancelled. A run on `main`
# never is: that run is the record of what shipped. Each `main` push is its own
# group, keyed by commit: sharing one group made a merge's run sit pending until
# the previous merge's run finished (measured 2026-09-30: 678 s queued before a
# 293 s run), because a concurrency group admits one run at a time. A pull
# request is keyed by its number, not its branch name: two fork PRs from
# branches that share a name (`patch-1`) would otherwise cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

# The same value as `[profile.test] debug` in Cargo.toml, which cargo already
# reads; it is repeated here for the cache. Swatinem/rust-cache keys on every
# `CARGO*` variable but drops `[profile]` from the manifests it hashes, so a
# profile change alone kept the old key: the restore was a full match, nothing
# was saved, and every run would rebuild its dependencies with the new profile
# from a cache built with the old one (#272). Change both together.
env:
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  # The test profile's opt-level (Cargo.toml `[profile.test]`), repeated for the
  # same reason: moving it from 3 to 1 left the cache key unchanged, so the
  # opt-3 cache restored as a full match, nothing was saved, and every run
  # recompiled the workspace from nothing (run 38400754429: "Cache up-to-date"
  # after a 3-minute step timeout). Change both together.
  CARGO_PROFILE_TEST_OPT_LEVEL: "1"
  # The machine's cargo configuration declares `incremental = true` for `dev`,
  # which `test` inherits, and a target directory on these runners is kept
  # across runs, so a rebuild after a one-file change should reuse the rest.
  # It did not: with the runner's environment, cargo wrote no incremental
  # session at all, and every target directory's `incremental/` was empty, so
  # every warm run recompiled each changed crate and its dependents from
  # nothing (5m40s for the workspace's tests on run 37633462471). Measured on
  # this machine, 2026-10-07: the same `cargo test --no-run` writes sessions
  # without `CI=true` in its environment and none with it, which every Actions
  # job has. This restores the declared setting; it changes how much is
  # recompiled, not what is built.
  CARGO_INCREMENTAL: "1"

jobs:
  # The gate lanes and the workspace suite, in two shards of one nextest run.
  # The fast lanes (seconds each, most of them reading files) ride on the first
  # shard instead of holding a runner instance for a job of their own, and the
  # lanes that need the workspace built run after the shard that built it.
  build:
    name: Workspace build and tests
    # The instance keeps its target directory across runs, so a warm run
    # recompiles only what changed: 250 s on run 38365526454. A hosted runner
    # starts from a restored cache that never holds the workspace crates, and
    # compiled lgwks_bot's `it` test binary alone for 100 s (run 38401426445).
    # A push that edits a test source is the cold case of that: the changed `it`
    # binary compiled for 184 s at a load average of 60-90 (22 s with nothing
    # changed), so the first run after the edit is cancelled at the bound with
    # its tests step unfinished (run 38870029835); the next run finds the binary
    # in the directory and is the measurement of the job.
    #
    # lgwks_bot's tests (4,138 of the 5,569) run in the two lgwks_bot jobs below,
    # and `build_verdict` reports this check's required name only when those two
    # and this job all passed, so every test is still required. Run on a warm
    # directory beside a load average near 50 (run 38871028285), every one of the
    # 5,569 passed and the step was cancelled in the second the last one did,
    # 252 s in, with 902 of the 1,576 summed test-seconds in the lgwks_bot `it`
    # binary: the share this job no longer carries.
    runs-on: [self-hosted, macOS, ARM64, lwc, lwc-3]
    timeout-minutes: 5
    env:
      # The Clippy job is where lints run, with `-D warnings`, over the same
      # workspace. `.cargo/config.toml` also routes every workspace compile
      # through clippy-driver so a plain local build enforces them; repeating
      # the lint pass here only adds to the compile that gates the run. Empty
      # is "no wrapper" to cargo, and the compiled code is identical.
      RUSTC_WORKSPACE_WRAPPER: ""
    steps:
      - uses: actions/checkout@v4
      - name: Pin Rust 1.99.0
        uses: ./.github/actions/local-rust
        with:
          toolchain: "1.99.0"
          nextest: "true"
          # Eight, the share bot-full is green at (its comment names the limit).
          # Run 38867517459 ran the suite, then 5,569 tests with lgwks_bot's, in
          # 186 s at six threads for 1,005 s of summed test time, so 5.4 of the 6
          # were busy: the cap, not the machine, set the wall. The suite is now
          # the 1,431 tests that are not lgwks_bot's, so this is headroom.
          test-share: "8"
          build-share: "3"
      - name: Build all workspace targets
        run: cargo test --workspace --all-targets --locked --no-run
      - name: Run all workspace tests
        run: cargo nextest run --workspace --locked -E 'not binary(storefront_consumers) and not package(lgwks_bot)' ${PARTITION:+--partition $PARTITION}
      # The two evidence lanes print the result their check rows below expose.
      # Each writes its own report, and the check row reads that report rather
      # than building the workspace a second time to produce it again: the
      # simulation listing alone compiles every test binary, which as a job of
      # its own cost 364 s on run 37579691890 and 6 s here.
      - name: Deterministic simulation evidence
        run: |
          set -euo pipefail
          mkdir -p gate-evidence
          cargo run --locked -p lgwks_deps --bin ci-local -- --lane simulation-evidence | tee gate-evidence/simulation-evidence.txt
      - name: Debug doctor end-to-end journey
        run: |
          set -euo pipefail
          mkdir -p gate-evidence
          cargo run --locked -p lgwks_deps --bin ci-local -- --lane debug-e2e | tee gate-evidence/debug-e2e.txt
      - name: Upload gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: gate-evidence
          path: gate-evidence/
          if-no-files-found: error
          retention-days: 7
      - name: Doc tests
        run: cargo test --workspace --doc --locked
      - name: Run package smoke test
        run: ./scripts/lgwks-std-package-smoke.sh


  # The checks that read the tree rather than test it, in a job of their own:
  # none builds the workspace's tests, so they need not wait on that compile,
  # and the job that compiles it need not wait on them.
  gate:
    name: Gate checks
    runs-on: macos-latest
    timeout-minutes: 5
    env:
      RUSTC_WORKSPACE_WRAPPER: ""
    steps:
      - uses: actions/checkout@v4
      - name: Pin Rust 1.99.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          components: clippy, rustfmt
      - name: Install lld, the linker the repository's cargo configuration names
        run: brew install lld
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          save-if: "true"
          cache-on-failure: "true"
          key: gate
      - name: nextest is installed
        uses: taiki-e/install-action@nextest
      - name: Verify lockfile is up-to-date
        run: >
          cargo metadata --locked --format-version 1 >/dev/null ||
          { echo 'Lockfile out of date: run cargo update --workspace and commit Cargo.lock' >&2; exit 1; } &&
          for f in crates/lgwks-deps/tests/fixtures/*/Cargo.lock; do if ! cargo metadata --locked --format-version 1 --manifest-path "${f%.lock}.toml" >/dev/null; then echo "stale fixture lockfile $f: run cargo update --workspace --manifest-path ${f%.lock}.toml" >&2; exit 1; fi; done
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Enforce dependency edge ownership
        run: cargo run --locked -p lgwks_deps --bin lgwks-deps -- check .
      - name: Verify invariant enforcement references resolve
        run: cargo run --locked -p lgwks_deps --bin ci-local -- --lane invariants
      - name: Audit std-first and lgwks_std-first
        # The manifest gate above sees every authored edge. This reads the
        # source for the two failures a manifest cannot show: a `use` no
        # manifest declares, and a capability hand-rolled beside the
        # `lgwks_std` module that already provides it.
        #
        # The audit is the `check-std-first` binary, ported from the Python
        # script it replaces because a repository holds Rust and C++ only. Its
        # own tests moved with it: they are unit tests of the binary now, run by
        # the workspace test lane above rather than behind a `--test` flag, so
        # the audit is still tested by the same run that reports it.
        run: cargo run --locked -p lgwks_deps --bin check-std-first
      - name: Forbid unwrap outside tests
        # Safety bar: library code fails loud with typed errors or named
        # expects, never bare unwrap. Doc examples count as shipped surface.
        run: cargo run --locked -p lgwks_deps --bin ci-local -- --lane unwrap-scan
      - name: Validate the dependency contract alignment
        run: cargo run --locked -p lgwks_deps --bin ci-local -- --lane contract-drift
      - name: Requirements sentences unedited without supersession
        run: cargo run --locked -p lgwks_deps --bin check-requirements && cargo run --locked -p lgwks_deps --bin check-spec-owners
      - name: llms.txt matches the documentation index
        # `llms.txt` is generated from the README's own tables by
        # the `llms-txt` binary. Regenerate and fail if the committed copy
        # differs, so the index cannot drift from the documents it points at: a
        # stale index is worse than none, because an agent trusts it and stops
        # looking. The script also fails when a document in `docs/` is missing
        # from the table, so a new document cannot be invisible to every reader
        # that arrives through this file.
        run: |
          set -eu
          cargo run --locked -p lgwks_deps --bin llms-txt
          git diff --exit-code -- llms.txt
      - name: Documentation citations resolve
        # The guides cite `path:NNN` for each factual claim, and every merge
        # moves the lines under them. A rotted citation is invisible: the page
        # still reads as sourced, and a reader who checks one and finds
        # something unrelated stops trusting the rest. This checks the part
        # that is not a judgement call — the file exists, and the line exists
        # in it. `docs/bevy-admission.md` is exempt because it cites Bevy's own
        # repository; the script names that exemption rather than guessing.
        run: cargo run --locked -p lgwks_deps --bin check-doc-citations
      - name: Root README quickstart matches its compiled example
        run: cargo run --locked -p lgwks_deps --bin ci-local -- --lane readme-quickstart


  # The two results the checks list names on every pull request. Each reads the
  # report its lane wrote in the job above and passes only on that lane's own
  # pass line, so the row is exactly the lane's verdict on this commit.
  simulation_evidence:
    name: successful simulation result
    needs: build
    runs-on: [self-hosted, macOS, ARM64, lwc]
    timeout-minutes: 5
    steps:
      - name: Download gate evidence
        uses: actions/download-artifact@v4
        with:
          name: gate-evidence
          path: gate-evidence
      - name: Check successful simulation result
        run: |
          cat gate-evidence/simulation-evidence.txt && grep -q '^<== simulation-evidence: pass' gate-evidence/simulation-evidence.txt

  debug_e2e:
    name: successful end-to-end journey result
    needs: build
    runs-on: [self-hosted, macOS, ARM64, lwc]
    timeout-minutes: 5
    steps:
      - name: Download gate evidence
        uses: actions/download-artifact@v4
        with:
          name: gate-evidence
          path: gate-evidence
      - name: Check successful end-to-end journey result
        run: |
          cat gate-evidence/debug-e2e.txt && grep -q '^<== debug-e2e: pass' gate-evidence/debug-e2e.txt

  tests_bot_full:
    name: Tests (lgwks-bot full, lgwks-std full)
    # The instance's own target directory, as on the build job: 245 s on run
    # 38365526454, against a hosted runner's 100 s compile of the `it` binary.
    runs-on: [self-hosted, macOS, ARM64, lwc, lwc-5]
    timeout-minutes: 5
    # One job, so the full feature set is compiled once (see the header).
    env:
      # As in the workspace job: lints run once, in the Clippy job.
      RUSTC_WORKSPACE_WRAPPER: ""
    steps:
      - uses: actions/checkout@v4
      - name: Pin Rust 1.99.0
        uses: ./.github/actions/local-rust
        with:
          toolchain: "1.99.0"
          nextest: "true"
          # Eight is the share this suite was green at: ten threads failed the
          # drain-grace test (`shutdown_reports_every_draining_cleanup_...`,
          # INV-BOT-156) under the run's process-table storm — the grace is
          # calibrated for loaded, not oversubscribed, hosts.
          test-share: "8"
          build-share: "3"
      - name: Run lgwks-bot async runner tests
        run: cargo nextest run -p lgwks_bot --all-targets --locked --features full --profile ci -E 'not test(saturation_r32_tier)' ${PARTITION:+--partition $PARTITION}
      # The JUnit report of what this shard actually ran, uploaded per shard so
      # the acceptance job can build one receipt from the suite's own output.
      # Writing the report costs the run nothing: the `ci` profile only adds a
      # serialiser. Each shard uploads into its own directory, because both
      # reports are called junit.xml and two artifacts with one path collide on
      # download. nextest keeps its store under the workspace's own `target/`
      # whatever CARGO_TARGET_DIR says, so the report is read from there; a
      # shard that wrote none fails here rather than leaving the receipt job to
      # find an empty glob (run 37536766485).
      - name: Upload lgwks-bot JUnit report
        uses: actions/upload-artifact@v4
        with:
          name: lgwks-bot-junit-full
          path: target/nextest/ci/junit.xml
          if-no-files-found: error
          retention-days: 7

  # The lgwks-std full-feature suite, apart from the lgwks-bot suite it shared a
  # job with: the pair compiled two feature sets and ran past 5 minutes.
  tests_std_full:
    name: Tests (lgwks-std full)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUSTC_WORKSPACE_WRAPPER: ""
    steps:
      - uses: actions/checkout@v4
      - name: Pin Rust 1.99.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          save-if: "true"
          cache-on-failure: "true"
          key: std-full
      - name: nextest is installed
        uses: taiki-e/install-action@nextest
      - name: Run lgwks-std full-feature tests
        # Stops before the job limit so the cache is saved (see the build job).
        timeout-minutes: 3
        run: cargo nextest run -p lgwks_std --all-targets --locked --features full ${PARTITION:+--partition $PARTITION}

  # The saturation tiers (100, 1,000 and 10,000 concurrent runs through a real
  # process boundary) in a job of their own, beside the suite rather than after
  # it: the 10,000 tier alone is 50,000 process starts and about two minutes.
  # It compiles only lgwks-bot and this one test binary. The three tiers took
  # 254 s in one job (run 38365526454). The 10,000 tier is CPU-bound, 50,000
  # process starts, and on a self-hosted instance beside twelve other jobs it
  # ran past the 5-minute limit in its test step alone, with the build cached
  # (run 38407172423: 5 m 14 s). A hosted runner has 3 cores: the test was
  # still running 2 m 27 s in when the job limit cancelled it, after a 1 m 11 s
  # build and two minutes of setup (run 38416328077). So the 10,000 tier has an
  # instance of its own, apart from the 100 and 1,000 tiers on lwc-12.
  # The binary's other 42 tests (the review-path simulations) run on the lwc-12
  # leg too, in place of the bot-full job, which no longer runs them on macOS
  # (`.config/nextest.toml`): that suite is bounded by its work, 1,916
  # slot-seconds of tests on nine threads, and the 42 held 206 of them (run
  # 38904371387: cancelled at the 5 min cap with every test passed). This leg
  # finished in 109 s of its 300 and the Linux container run still runs them all.
  tests_bot_saturation:
    name: Saturation tiers (lgwks-bot full) (${{ matrix.tiers }})
    runs-on: [self-hosted, macOS, ARM64, lwc, "${{ matrix.instance }}"]
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - tiers: "10000"
            instance: lwc-2
            filter: "test(=saturation_r32_tier_10000)"
          - tiers: "100 and 1000"
            instance: lwc-12
            filter: "test(=saturation_r32_tier_100) | test(=saturation_r32_tier_1000) | not test(saturation_r32_tier)"
    env:
      RUSTC_WORKSPACE_WRAPPER: ""
    steps:
      - uses: actions/checkout@v4
      - name: Pin Rust 1.99.0
        uses: ./.github/actions/local-rust
        with:
          toolchain: "1.99.0"
          nextest: "true"
          test-share: "3"
          build-share: "2"
      # The saturation tiers (100, 1,000 and 10,000 concurrent runs) are kept
      # out of the partitioned suite: in a shard they set the run's wall (481 s
      # on run 37205854158, test phase 229 s against 61-63 s for the other three
      # shards).
      # The lane's own command, with the tests this leg runs set in
      # SATURATION_FILTER (unset, the command selects the whole binary), as the
      # sharded lanes set PARTITION: the gate-parity check compares this text
      # with scripts/gate-lanes.toml. `--ignore-default-filter` lifts the `ci`
      # profile's macOS filter, which keeps this binary out of the bot-full job.
      - name: Run lgwks-bot saturation tiers
        env:
          SATURATION_FILTER: ${{ matrix.filter }}
        run: cargo nextest run -p lgwks_bot --locked --features full --profile ci --ignore-default-filter --test sim_review_path -E "${SATURATION_FILTER:-all()}"
      # The JUnit report of what this leg ran, under the `lgwks-bot-junit-*` name
      # the acceptance job downloads: the review-path tests (T31-T34) are named
      # in `docs/acceptance/t-rows.toml`, so the macOS receipt reads them here.
      - name: Upload lgwks-bot saturation JUnit report
        uses: actions/upload-artifact@v4
        with:
          name: lgwks-bot-junit-saturation-${{ matrix.instance }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: error
          retention-days: 7

  acceptance_receipts:
    # The receipt, built from the JUnit reports the shards already wrote. The
    # job builds one small binary (`acceptance-receipts`, std only) and reads two
    # XML files with it, so it costs seconds rather than adding a second
    # execution of the tests the shards already ran between them.
    name: Acceptance receipts
    needs: [tests_bot_full, tests_bot_saturation, tests_linux]
    runs-on: [self-hosted, macOS, ARM64, lwc]
    timeout-minutes: 5
    env:
      REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Pin Rust 1.99.0
        uses: ./.github/actions/local-rust
        with:
          toolchain: "1.99.0"
      - name: Download lgwks-bot JUnit reports
        uses: actions/download-artifact@v4
        with:
          pattern: lgwks-bot-junit-*
          path: acceptance-artifact
      - name: Download the Linux lgwks-bot JUnit report
        uses: actions/download-artifact@v4
        with:
          name: acceptance-junit-linux
          path: acceptance-linux
      - name: Record acceptance receipts
        run: cargo run --locked -p lgwks_deps --bin acceptance-receipts -- --from-junit acceptance-artifact/*/junit.xml --db acceptance-artifact/receipts.sqlite --export acceptance-artifact/acceptance-receipts.json --revision "$REVISION" --platform "$(uname -s | tr '[:upper:]' '[:lower:]')-$(uname -m)" && cargo run --locked -p lgwks_deps --bin acceptance-receipts -- --from-junit acceptance-linux/junit.xml --db acceptance-artifact/receipts.sqlite --export acceptance-artifact/acceptance-receipts-linux.json --revision "$REVISION" --platform linux-aarch64
      - name: Upload acceptance receipt
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-receipts
          path: acceptance-artifact/
          retention-days: 30

  # The lgwks-bot suite at no default features, in a job of its own. The
  # lgwks-std per-feature suites live in the feature-matrix job below: they
  # build narrow feature sets of lgwks-std, as its checks do, so they share
  # that job's target rather than this one's, and this job holds the one suite
  # whose threads it sizes for.
  tests_nodefault:
    name: Tests (lgwks-bot no default features)
    # The instance's own target directory: 77 s on run 38365526454.
    runs-on: [self-hosted, macOS, ARM64, lwc, lwc-7]
    timeout-minutes: 5
    env:
      # As in the workspace job: lints run once, in the Clippy job.
      RUSTC_WORKSPACE_WRAPPER: ""
    steps:
      - uses: actions/checkout@v4
      - name: Pin Rust 1.99.0
        uses: ./.github/actions/local-rust
        with:
          toolchain: "1.99.0"
          nextest: "true"
          test-share: "6"
          build-share: "3"
      - name: Run lgwks-bot no-default-feature tests
        run: cargo nextest run -p lgwks_bot --all-targets --locked --no-default-features ${PARTITION:+--partition $PARTITION}

  # The Linux leg. Every other job runs on the self-hosted macOS runner, so the
  # Linux-only paths (`/proc` child lists, the Linux reap) and the AppCUI Linux
  # backend execute here, in a container on the same machine, with the same
  # cargo configuration. The workspace suite is one job; the lgwks-bot full
  # suite and the AppCUI storefront share the other, each pair with its own
  # target volume.
  tests_linux:
    name: Tests (Linux container)
    # Each suite on its own instance, whose container target volume keeps the
    # Linux build across runs: 175 s and 195 s on run 38365526454. A hosted
    # Linux runner restores a cache without the workspace crates and compiled
    # lgwks_std, lgwks_deps and lgwks_bot for over three minutes before the
    # first test (run 38401426445).
    runs-on: [self-hosted, macOS, ARM64, lwc, "${{ matrix.suite == 'workspace' && 'lwc-8' || 'lwc-9' }}"]
    timeout-minutes: 5
    env:
      # The tool is built on the host: lints run once, in the Clippy job.
      RUSTC_WORKSPACE_WRAPPER: ""
    strategy:
      fail-fast: false
      matrix:
        suite: [workspace, bot-full appcui]
    steps:
      - uses: actions/checkout@v4
      - name: Pin Rust 1.99.0
        uses: ./.github/actions/local-rust
        with:
          toolchain: "1.99.0"
          nextest: "true"
      # The container image is Debian trixie, whose util-linux 2.41 `setpriv`
      # applies the Landlock rules `Confinement::Landlock` wraps (#337);
      # bookworm's 2.38 cannot, and the Landlock simulations failed there with
      # `Unsupported` (run 38455031363). The tool builds the derived image with
      # lld and sqlite3 itself (the acceptance-receipt binary holds its receipts
      # through the sqlite3 program, run 38404124109). `lgwks_deps` has no default
      # feature since the scan moved to `lgwks_ast` (#408); the flag is kept so
      # the command stays the text `scripts/gate-lanes.toml` holds.
      - name: Run the workspace and lgwks-bot full suites on Linux
        run: cargo run --locked -p lgwks_deps --no-default-features --bin linux-container-tests -- ${{ matrix.suite }}
      # The Linux receipt (#271): the bot-full suite's JUnit, under a name the
      # macOS shards' `lgwks-bot-junit-*` download pattern does not match, so
      # the receipt job records it as its own platform.
      - name: Upload Linux lgwks-bot JUnit report
        if: matrix.suite != 'workspace'
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-junit-linux
          path: target/nextest/ci/junit.xml
          if-no-files-found: error
          retention-days: 7

  # Lints, the rustdoc lanes and the two release-build gates. Clippy and
  # rustdoc compile the same dependency graph as `cargo check`, so they share a
  # target; the release gates run last, on the build the scan step left.
  # Three legs, each on its own hosted runner: the whole job took 5 m 18 s and
  # was cancelled before its last two steps (run 38416328077). Every step is
  # unchanged and runs in exactly one leg.
  clippy:
    name: Clippy and scan (${{ matrix.part }})
    runs-on: macos-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        part: [workspace, scan, reduced]
    steps:
      - uses: actions/checkout@v4
      - name: Pin Rust 1.99.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          components: clippy
      - name: Install lld, the linker the repository's cargo configuration names
        run: brew install lld
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          save-if: "true"
          cache-on-failure: "true"
          key: clippy-${{ matrix.part }}
      - name: Clippy all workspace targets
        if: matrix.part == 'workspace'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # INV-SCAN-ZERO. `scan` was the gate's own debt ledger and no lane ran it,
      # so 433 findings sat in shipped source while the name was advertised as
      # an invariant nothing checked. It is a lane now, and it refuses on any
      # finding rather than reporting a count.
      # The two tool runs build optimised binaries without the release profile's
      # fat LTO: the link-time pass was most of a 3 m 28 s build for a tool that
      # reads files for seconds (run 38304128455), and what it reports does not
      # depend on how its own binary was linked.
      - name: Scan reports zero findings
        if: matrix.part == 'scan'
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
        run: cargo run --locked --release -p lgwks_ast --no-default-features --features tool,scan --bin lgwks-ast -- scan
      # #384: every `script!` in the tree, read by the one parser the macro
      # calls (SL-2), without compiling it. Refuses on any construct the
      # language refuses and on any file that is not Rust tokens, at the
      # line and column `cargo build` would report.
      - name: Every script! in the repository reads
        if: matrix.part == 'scan'
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
        run: cargo run --locked --release -p lgwks_ast --no-default-features --features tool,scan --bin lgwks-ast -- script check
      - name: Clippy feature matrix
        if: matrix.part == 'workspace'
        # Per-crate all-features (gpui excluded: it needs the Xcode Metal
        # toolchain and is checked by its own lane in the matrix job).
        run: >
          cargo clippy --locked --manifest-path crates/lgwks-bot/Cargo.toml
          --all-targets --all-features -- -D warnings &&
          cargo clippy --locked --manifest-path crates/lgwks-ast/Cargo.toml
          --all-targets --all-features -- -D warnings &&
          cargo clippy --locked --manifest-path crates/lgwks-deps/Cargo.toml
          --all-targets --features tokio-full -- -D warnings
      - name: Clippy no default features
        if: matrix.part == 'reduced'
        run: >
          cargo clippy --locked --manifest-path crates/lgwks-bot/Cargo.toml
          --all-targets --no-default-features -- -D warnings &&
          cargo clippy --locked --manifest-path crates/lgwks-ast/Cargo.toml
          --all-targets --no-default-features -- -D warnings &&
          cargo clippy --locked --manifest-path crates/lgwks-ast/Cargo.toml
          --all-targets --no-default-features --features parser -- -D warnings
      - name: Clippy process-only
        if: matrix.part == 'reduced'
        # `process` alone is a supported consumer shape: a bot that starts
        # children and nothing else. It was missing from the matrix, so a
        # deadline path naming the `time` module compiled under `--all-features`
        # and broke this build (issue #131).
        run: >
          cargo clippy --locked --manifest-path crates/lgwks-bot/Cargo.toml
          --all-targets --no-default-features --features process -- -D warnings


  # The documentation lanes, apart from the lints: rustdoc builds its own
  # output for each feature set, and beside clippy the two made one 513 s job
  # (run 37633462471) whose halves share nothing but the checkout.
  docs:
    name: Docs and release gates
    # A GitHub-hosted runner: the local machine's 15 cores were shared by 13
    # jobs and this one measured 8m44s there (run 38339936125). Every step and
    # command is as it was; only the capacity under them changed.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Pin Rust 1.99.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          components: clippy
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          save-if: "true"
          cache-on-failure: "true"
          key: docs
      - name: Doc build with broken-link denial
        # Every feature on, per crate (gpui excluded: it needs the Xcode Metal
        # toolchain and is checked by its own lane in the matrix job).
        # `scripts/doc-lanes.sh` holds the commands and the reason for each
        # lane, so this job and a contributor run the same four of them.
        run: ./scripts/doc-lanes.sh all-features
      - name: Doc build without default features
        # No features on. A module in `core` that links to a feature-gated
        # module resolves under `--all-features` and breaks here.
        run: ./scripts/doc-lanes.sh no-default-features
      - name: Doc build at the default feature set
        # The set `cargo add lgwks_std` hands a consumer, which neither boundary
        # lane builds: `--all-features` resolves a link into a gated module, and
        # `--no-default-features` does not compile the module holding the link,
        # so a default-on to default-off link is invisible to both.
        run: ./scripts/doc-lanes.sh default
      # The per-feature doc build and the docs.rs metadata build run in the
      # lgwks-bot/lgwks-ast matrix job below: that instance finished in under a
      # minute while this one held them for four of its nine (run 38339936125).

  # The compile-only matrices that remain: targets, grammars, the Metal
  # storefronts and the standalone consumer packages. lgwks_std has no feature
  # subsets to test: every module is part of it (Director, 2026-10-13).

  # The lgwks-deps storefronts, the target matrix and the standalone consumers,
  # apart from the lgwks-std feature matrix: the two share no feature set, and
  # as one job they took 454 s (run 37633462471).
  storefront-matrix:
    name: Target and storefront matrix
    runs-on: [self-hosted, macOS, ARM64, lwc, lwc-13]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Pin Rust 1.99.0
        uses: ./.github/actions/local-rust
        with:
          toolchain: "1.99.0"
          nextest: "true"
          build-share: "1"
      - name: Check lgwks-deps
        run: cargo check --locked --manifest-path crates/lgwks-deps/Cargo.toml --all-targets
      - name: Check lgwks-deps storefront engine feature
        run: cargo check --locked --manifest-path crates/lgwks-deps/Cargo.toml --all-targets --features tokio
      - name: Check lgwks-deps GPUI storefront feature
        run: cargo check --locked --manifest-path crates/lgwks-deps/Cargo.toml --all-targets --features gpui
      - name: Check lgwks-deps ML storefront features
        run: cargo check --locked --manifest-path crates/lgwks-deps/Cargo.toml --all-targets --features ml-candle,ml-tokenizers
      - name: Check normal GPUI renderer feature
        # The fixture is its own workspace, so by default it builds into its
        # own target directory and compiles the GPUI stack a second time.
        # Pointing it at the directory the first check just filled reuses
        # every unit whose features match.
        run: >
          cargo check --locked -p lgwks_deps --all-targets --features gpui &&
          cargo check --locked
          --manifest-path crates/lgwks-deps/tests/fixtures/storefront-matrix/Cargo.toml
          --target-dir "${CARGO_TARGET_DIR:-target}"
          --no-default-features --features gpui --example gpui
      - name: Check Candle Metal storefront features
        run: cargo check --locked -p lgwks_deps --all-targets --features ml-candle-metal,ml-tokenizers
      # Standalone consumer packages, one cargo build per storefront family.
      - name: Build storefront consumers
        run: cargo nextest run --locked -p lgwks_deps --test storefront_consumers

  # The declared target matrix, one leg per group of targets. Run in one job it
  # took over 7 minutes (run 38412846693: the sixth of seven targets was
  # reached at 5 m 29 s with the cancel at 5 m 00 s), so each leg holds the
  # targets it is named for and the host triple the script always adds. Only
  # registered, online instances may be named: lwc-6 and lwc-1 are offline
  # (runner list, 2026-10-13) and a job pinned to one waits for ever. No leg is
  # pinned to an instance that holds a critical-path suite: lwc-5 is the lgwks-bot
  # full suite (3 m 57 s) and lwc-9 the Linux bot-full one (4 m 12 s). The musl
  # and wasm leg shared lwc-5, so that suite started 2 m 04 s late and the run's
  # wall was 6 m 42 s (run 38880610389, the suite's start 3 s after the leg's end).
  target-matrix:
    name: Target matrix (${{ matrix.targets }})
    runs-on: [self-hosted, macOS, ARM64, lwc, "${{ matrix.instance }}"]
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - targets: aarch64-unknown-linux-gnu
            instance: lwc-4
          - targets: x86_64-unknown-linux-musl wasm32-wasip1
            instance: lwc-4
          - targets: x86_64-unknown-freebsd aarch64-linux-android aarch64-apple-ios
            instance: lwc-7
    steps:
      - uses: actions/checkout@v4
      - name: Pin Rust 1.99.0
        uses: ./.github/actions/local-rust
        with:
          toolchain: "1.99.0"
          build-share: "1"
      - name: Check lgwks-std across the declared target matrix
        # `cargo check --target <t>` for every declared target and crate. The
        # script installs the target with rustup first, requires the Rust-only
        # surface everywhere, and records with its exact error any check this
        # runner has no C toolchain to reach. MATRIX_TARGETS names the targets
        # this leg checks (unset, the script checks them all), as SATURATION_FILTER
        # does for the saturation tiers: the gate-parity check compares this
        # text with scripts/gate-lanes.toml.
        env:
          MATRIX_TARGETS: ${{ matrix.targets }}
        run: ./scripts/check-target-matrix.sh ${MATRIX_TARGETS:-}

  # The two release-build timing gates, apart from the lints: each measures
  # wall time, and a measurement taken beside a clippy pass on the same
  # instance measures the clippy pass.
  timing_gates:
    name: Timing gates (dudect, async fairness)
    runs-on: [self-hosted, macOS, ARM64, lwc, lwc-10]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Pin Rust 1.99.0
        uses: ./.github/actions/local-rust
        with:
          toolchain: "1.99.0"
      - name: Digest constant-time equality (dudect)
        # 250,000 samples per class, not the harness's 1,000,000 default: the
        # wall is linear in samples (47 s idle at 1M, ~12 s at 250k) while the
        # power stays far above any exploitable leak. t scales with √N: the
        # early-exit control reads t ≈ 10,000 at 1M, ≈ 5,000 at 250k, still
        # four orders past the 4.5 threshold, and a 0.5%-of-mean leak reads
        # t ≈ 8 at 250k against the same threshold. The threshold, the
        # batching, the cropping and the control are untouched.
        run: cargo run --release --locked -p lgwks_std --features hash --example digest_timing -- --samples 250000
      - name: Async fairness gate and concurrency ladder
        run: cargo run --release --manifest-path bench/async/Cargo.toml -- --mutant-check && cargo run --release --manifest-path bench/async/Cargo.toml -- --tiers && cargo run --release --manifest-path bench/async/Cargo.toml -- --matrix

  # The lgwks-bot and lgwks-ast compile matrices and the grammar execution, apart
  # from the lgwks-std, lgwks-deps and target matrices: together the two halves
  # were the longest job of a warm run (450 s, run 37619560219 attempt 2), and
  # neither half builds what the other does.
  # Four legs (the WASI check took 1 m 53 s beside the 3 m 08 s bot matrix on a
  # contended instance, run 38437338031), each step unchanged and run in exactly one: as one job it took
  # 5 m 24 s on a pinned instance (run 38429086342: docs.rs metadata 2 m 13 s,
  # the bot matrix 2 m 02 s, the AST matrix cut off at 24 s).
  feature-matrix-bot-ast:
    name: Feature matrix (${{ matrix.part }})
    runs-on: [self-hosted, macOS, ARM64, lwc, "${{ matrix.instance }}"]
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: docs.rs
            instance: lwc-11
          - part: lgwks-bot
            instance: lwc-10
          - part: lgwks-ast
            instance: lwc-12
          - part: lgwks-bot WASI
            instance: lwc-13
    steps:
      - uses: actions/checkout@v4
      - name: Pin Rust 1.99.0
        uses: ./.github/actions/local-rust
        with:
          toolchain: "1.99.0"
          build-share: "2"
      - name: docs.rs metadata names a buildable feature set
        if: matrix.part == 'docs.rs'
        # docs.rs builds with whatever `[package.metadata.docs.rs]` declares,
        # and a failure there is invisible from the repository: the crate page
        # just shows a build error. `all-features = true` on a crate whose
        # features include platform-bound ones fails on every publish, which is
        # what happened to lgwks_deps: `gpui` pulls `objc2`, which refuses to
        # compile off Apple targets. Build with the declared set so an
        # unbuildable declaration fails here instead of on docs.rs.
        run: cargo run --locked -p lgwks_deps --bin ci-local -- --lane docsrs-metadata
      - name: Check lgwks-bot async feature matrix
        if: matrix.part == 'lgwks-bot'
        run: |
          set -eu
           cargo check --locked --manifest-path crates/lgwks-bot/Cargo.toml --all-targets --no-default-features
           cargo check --locked --manifest-path crates/lgwks-bot/Cargo.toml --all-targets
           cargo check --locked --manifest-path crates/lgwks-bot/Cargo.toml --all-targets --features net,process,fs,signal
           cargo check --locked --manifest-path crates/lgwks-bot/Cargo.toml --all-targets --all-features
      - name: Check lgwks-bot WASI runtime boundary
        if: matrix.part == 'lgwks-bot WASI'
        run: |
          set -eu
          rustup target add wasm32-wasip1
           RUSTFLAGS="" cargo check --locked --manifest-path crates/lgwks-bot/Cargo.toml --target wasm32-wasip1 --features rt
      - name: Check lgwks-ast feature matrix
        if: matrix.part == 'lgwks-ast'
        run: |
          set -eu
           cargo check --locked --manifest-path crates/lgwks-ast/Cargo.toml --all-targets --no-default-features
           cargo check --locked --manifest-path crates/lgwks-ast/Cargo.toml --all-targets --no-default-features --features parser
           cargo check --locked --manifest-path crates/lgwks-ast/Cargo.toml --all-targets
           cargo check --locked --manifest-path crates/lgwks-ast/Cargo.toml --all-targets --all-features
      - name: Execute the lgwks-ast grammar matrix
        if: matrix.part == 'lgwks-ast'
        # The check above proves each combination compiles; this executes it. A
        # grammar that compiles but does not read its own language is the
        # failure `cargo check` cannot see, and the grammar features are
        # admitted independently, so each standalone grammar is exercised on its
        # own rather than inferred from the all-features lane.
        #
        # The 28 grammars go in ONE `cargo test` invocation, not a loop of 28.
        # Each separate invocation re-resolves the feature set and relinks the
        # whole ast-grep and tree-sitter stack, which was ~6 minutes of this
        # run's wall clock; listing the features together builds the shared
        # stack once and runs every grammar in one process. The no-default and
        # all-features legs stay separate — they are two more feature sets, not
        # 28, and each is a different resolution the combined call cannot make.
        #
        # Opt-level 0, as the per-feature suites: each leg parses a fixture per
        # grammar in milliseconds, and at the workspace's opt-level 3 the
        # combined leg spent 3 m 59 s compiling lgwks-std, lgwks-deps and
        # lgwks-ast (run 38304128455). Assertions are unchanged.
        env:
          CARGO_PROFILE_TEST_OPT_LEVEL: "0"
        run: |
          set -u
          failed=0
          execute() {
            echo "::group::$*"
            if ! "$@"; then
              echo "::error::lgwks-ast grammar matrix failed: $*"
              failed=1
            fi
            echo "::endgroup::"
          }
          execute cargo test --locked -p lgwks_ast --lib --no-default-features
          # The parser with no grammar compiled: what `--no-default-features`
          # meant before the grammar stack became optional (#367).
          execute cargo test --locked -p lgwks_ast --lib --no-default-features --features parser
          execute cargo test --locked -p lgwks_ast --lib
          # Every standalone grammar, one build. A grammar that fails to parse
          # its own language still fails here: the per-grammar test reads that
          # grammar's fixture, and nextest/cargo reports the failing test by
          # name either way.
          execute cargo test --locked -p lgwks_ast --lib --no-default-features \
            --features lang-bash,lang-c,lang-cpp,lang-csharp,lang-css,lang-dart,lang-elixir,lang-go,lang-haskell,lang-hcl,lang-html,lang-java,lang-javascript,lang-json,lang-kotlin,lang-lua,lang-md,lang-nix,lang-php,lang-python,lang-ruby,lang-rust,lang-scala,lang-solidity,lang-swift,lang-tsx,lang-typescript,lang-yaml
          execute cargo test --locked -p lgwks_ast --lib --all-features
          exit "$failed"

  appcui-native:
    name: AppCUI native storefront
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      matrix:
        # The mac leg rides the Linux-workspace instance, not the bot-full
        # one: both legs of this job shared lwc-5 with the bot-full suite, so
        # the suite started two minutes late behind a 123 s leg, and the
        # instance's wall was their sum. lwc-8's own job is the 158 s Linux
        # workspace suite in a container with its own target volume, so the
        # native leg queues behind that instead and the instance stays under
        # the budget once warm.
        os: [[self-hosted, macOS, ARM64, lwc, lwc-8], windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        if: runner.environment == 'github-hosted'
        with:
          toolchain: "1.99.0"
          components: clippy
      - uses: ./.github/actions/local-rust
        if: runner.environment == 'self-hosted'
        with:
          toolchain: "1.99.0"
      - run: cargo test --locked -p lgwks_deps --no-default-features --features appcui --lib
      - run: cargo test --locked -p lgwks_deps --no-default-features --features appcui --doc
      - run: cargo clippy --locked -p lgwks_deps --no-default-features --features appcui --all-targets -- -D warnings

  # Its own job rather than a step of the AppCUI Windows leg: the GPUI build is
  # 194 s, and behind the AppCUI steps it made that leg the run's longest job.
  gpui-windows:
    name: GPUI Windows renderer
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Pin Rust 1.99.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          # Restore on every run, save only from `main`: a pull request reads the
          # last merged build instead of writing a cache entry per branch.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # The fixture is its own workspace, so it built into its own target
          # directory, which this cache never saved: every run compiled the
          # whole GPUI stack again (3 min 03 s, 134 crates). It now builds into
          # the cached `target`. The key is new so the first `main` run misses
          # and saves those artifacts; an exact hit skips the save, and the old
          # key would never have picked them up.
          key: storefront-fixture-target
      - name: Check GPUI Windows renderer fixture
        run: >
          cargo check --locked
          --manifest-path crates/lgwks-deps/tests/fixtures/storefront-matrix/Cargo.toml
          --target-dir target
          --no-default-features --features gpui --example gpui

  # #263 on Windows, executed. The job object a supervised tree lives in is the
  # kernel's own membership list, so the only evidence that the containment works
  # is a Windows host that runs the supervisor's real path and reads that list
  # empty after a cancel and after a deadline (`crates/lgwks-bot/tests/
  # process_job.rs`). Every other Windows job of this file builds or lints.
  # The test is a binary of its own, and the features are the ones it needs, so
  # the compile is lgwks_std, the async engine and lgwks_bot, not the crate's
  # four thousand tests.
  process-windows:
    name: Process containment on Windows
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      # Lints run once, in the Clippy job.
      RUSTC_WORKSPACE_WRAPPER: ""
      # The test is a handful of syscalls and two child processes, so the
      # optimizer would only lengthen the compile.
      CARGO_PROFILE_TEST_OPT_LEVEL: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Pin Rust 1.99.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          save-if: "true"
          cache-on-failure: "true"
          key: process-windows
      - name: Run the Windows job-object containment tests
        # Stops before the job limit so the cache is saved (see the build job).
        timeout-minutes: 4
        run: cargo test --locked -p lgwks_bot --no-default-features --features process --test process_job

  # The repository's ruleset requires a check named exactly "Clippy and scan".
  # The lint job above is a matrix, whose legs report as "Clippy and scan
  # (workspace)", "(scan)" and "(reduced)", so no check of the required name was
  # ever reported and a pull request could not satisfy the ruleset. This job is
  # that name. Its verdict is the matrix's own: `needs.clippy.result` is
  # `success` only when every leg succeeded, so a leg added or renamed above
  # needs no change here, and a failed or cancelled leg fails this row.
  clippy_verdict:
    name: Clippy and scan
    needs: clippy
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every clippy leg passed
        env:
          LEGS: ${{ needs.clippy.result }}
        run: |
          echo "clippy and scan legs: ${LEGS}"
          test "${LEGS}" = success

  # The repository's ruleset requires a check named exactly "Build and workspace
  # tests". That name used to be the one job that ran every test; the workspace
  # job above now runs all but lgwks_bot's, which the lgwks_bot jobs run under
  # the feature sets a consumer builds (full, and none). This row carries the
  # required name and passes only when all four passed, so no test is left out
  # of the required check: on run 38871028285 each of the 4,138 lgwks_bot tests
  # the workspace job ran was among the 4,870 the full job ran, and the
  # no-default job adds 3,190 under the other feature set, where before the
  # required check held the default set alone. The saturation job runs the 45
  # tests of `sim_review_path` (42 simulations and the three tiers) that the full
  # job leaves to it on macOS, so it is part of the row. A cancelled or skipped
  # job is not `success`, so it fails this row too.
  build_verdict:
    name: Build and workspace tests
    needs: [build, tests_bot_full, tests_bot_saturation, tests_nodefault]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every workspace test job passed
        env:
          BUILD: ${{ needs.build.result }}
          BOT_FULL: ${{ needs.tests_bot_full.result }}
          BOT_SATURATION: ${{ needs.tests_bot_saturation.result }}
          BOT_NODEFAULT: ${{ needs.tests_nodefault.result }}
        run: |
          echo "workspace ${BUILD}, lgwks_bot full ${BOT_FULL}, lgwks_bot saturation ${BOT_SATURATION}, lgwks_bot no default ${BOT_NODEFAULT}"
          test "${BUILD}" = success && test "${BOT_FULL}" = success && test "${BOT_SATURATION}" = success && test "${BOT_NODEFAULT}" = success

# Generated by `keel init`: the repository's one executor declaration.
# The keel binary reads it through `KEEL_EXECUTORS`; the generated workflow
# sets that variable to this path. Declare the fleet here, never in CI.
#
# Local-only on purpose: no `[[executor]]` entry claims a remote machine.
# `local_slots` is omitted, so the factory observes this host's parallelism
# and available memory and judges from that observation. Set `local_slots = 0`
# to disable local execution, then declare a remote `[[executor]]` instead.
schema = "keel-executors/v1"
required = true

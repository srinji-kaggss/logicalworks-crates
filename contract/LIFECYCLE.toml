# Lifecycle mortgage ledger — replacement, removal trigger and review date for
# every approved edge.
#
# The register names the edge; this companion names its exit: what replaces
# the crate (`replacement`), the measured condition that retires it
# (`removal_trigger`), and the ISO date of the last quarterly review
# (`last_reviewed`). A sentence that does not say what and when is refused at
# load, exactly like a thin approval reason.
#
# `lgwks-deps check` refuses an approved edge with no row here as
# `MissingLifecycle`, and `lgwks-deps ledger` prints the review page the
# quarter closes or re-affirms. Keep the two registers in the same commit: an
# approval without a mortgage, and a mortgage without an approval, are both
# findings.

[[lifecycle]]
crate = "appcui"
replacement = "A terminal widget renderer in lgwks_std or the gpui storefront covering the same widgets."
removal_trigger = "The estate covers terminal widgets with equal capability and the storefront has no consumer."
last_reviewed = "2026-10-26"
review = "docs/appcui-admission.md"


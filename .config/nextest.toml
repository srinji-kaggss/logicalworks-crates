# Every test is bounded. nextest's default has no timeout, so a test that parks
# forever holds the whole gate open, and "the suite hung" reads exactly like "the
# suite is still running": on 2026-10-05 a tenancy test with every tokio worker
# parked ran for 12.5 minutes at 0% CPU before anyone looked. A test that reports
# no progress for five 60 s periods is killed and fails the run, naming itself.
# 300 s is the whole budget for a gate, so no single test may take longer; the
# per-module overrides below are tighter where their tests are known to be
# shorter, and an override's own slow-timeout takes precedence over this one.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }

# journal_scale measures how many OS threads the process can create and then
# holds that many tenant journals open. On Linux the thread limit is per user,
# so a sibling test forked meanwhile can fail to spawn with EAGAIN (main CI run
# 37091933076). It runs with every test slot to itself.
#
# It is a module of lgwks_bot's one integration binary (#272), so the filter
# names the module path inside `it`. nextest still runs each test as its own
# process, so the override applies per test exactly as it did per binary.
#
# #272: every override below that takes `num-test-threads` also has `priority =
# 100`, so those tests run first. A test that needs every slot waits at the head
# of the queue until the tests already running have finished, and starts nothing
# behind it meanwhile, so one that comes up mid-run idles the other slots for as
# long as the longest running test takes. Run 38912085538: the workspace job's
# `sim_random_error` came up 36 s in with a 15 s test running, then ran alone for
# 42 s, and its test phase took 131 s for 504 slot-seconds, which nine threads
# finish in 56 s; bot-full's `journal_scale` waited from 10 s to 25 s for a 23 s
# test with one slot busy. At priority 100 they run when nothing is running to
# wait for. The tests, their threads and their exclusivity are unchanged, only
# their place in the order.
[[profile.default.overrides]]
filter = 'package(lgwks_bot) & binary(it) & test(/^journal_scale::/)'
threads-required = 'num-test-threads'
priority = 100

# #263: the fire test supervises a thousand process trees at 100 and at 1,000 in
# flight, which is three thousand processes at its peak, so it runs with every
# test slot to itself and no sibling competes for the process cap it reports.
# It prints its measured line on success too: the line is the evidence (p50,
# p95 and p99 cancel-to-report, the mechanisms, the peak resident set), and a
# passing test's output is otherwise discarded. It is Linux-only, so it runs in
# the container leg, whose pid namespace is its own.
[[profile.default.overrides]]
filter = 'package(lgwks_bot) & binary(it) & test(/^process_fire::/)'
threads-required = 'num-test-threads'
priority = 100
success-output = 'immediate'

# The storefront consumers (INV-DEP-9) are one test per family, and every one is
# a `cargo check` into the same target directory. Run side by side, all but one
# park on cargo's lock and that wait counts against their own slow-timeout, so
# the binary runs one test at a time and each test's bound is its own compile.
[[profile.default.overrides]]
filter = 'package(lgwks_deps) & binary(storefront_consumers)'
threads-required = 'num-test-threads'
priority = 100

# #277: two lgwks_ast modules exist to catch a walk that stops making progress,
# so they are the last place a missing bound would show up as a run that never
# ends. nextest's default has no timeout at all, which means "the suite hung"
# and "the suite passed" are the same observation; these two get a hard
# slow-timeout instead, so a hang fails the run rather than holding it open.
#
# The periods are generous because these tests measure real 2 MiB parses and a
# loaded CI runner is slow. `terminate-after` is the bound that matters: three
# periods without a progress report and the test process is killed and the run
# fails. The abort test in `hostile` spawns a child of its own, so its period
# has to cover the child as well as the parent.
[[profile.default.overrides]]
filter = 'package(lgwks_ast) & binary(it) & test(/^hostile::/)'
slow-timeout = { period = "120s", terminate-after = 2 }

# The seeded family: 96 seeds per test, each a real parse. Same reasoning, one
# period shorter because no test here owns a child process.
[[profile.default.overrides]]
filter = 'package(lgwks_ast) & binary(it) & test(/^sim_parse_bounds::/)'
slow-timeout = { period = "90s", terminate-after = 2 }

# sim_random_error drives concurrent entropy drawers at 100, 1 000, 10 000 and
# 100 000 OS threads — the same per-user thread ceiling as above, on a crate
# whose tests run in the same binary as every other lgwks_std suite. A refusal
# is recorded and reported rather than failed, so the tier is named either way,
# but a refusal caused by a sibling test is not a measurement of this contract.
# It is a module of lgwks_std's one integration binary (#272), like the entry
# above.
[[profile.default.overrides]]
filter = 'package(lgwks_std) & binary(it) & test(/^sim_random_error::/)'
threads-required = 'num-test-threads'
priority = 100

# http_alloc times the shipped client against a bare socket exchange on one
# loopback server and holds the client's fastest decile to a multiple of the
# bare one. That ratio compares two cheap things, so a sibling test taking the
# runner's two vCPUs moves the client by milliseconds and the bare exchange by
# microseconds (CI run 38398095659: 1829 us against 49 us). The probe runs with
# every test slot to itself, which makes the ratio a measurement of the client.
[[profile.default.overrides]]
filter = 'package(lgwks_std) & binary(http_alloc)'
threads-required = 'num-test-threads'
priority = 100

# #272: the longest test of the workspace job that is not exclusive, and one that
# sorts among the last in the order nextest uses. It came up when the rest had
# finished and ran its 26 s alone at the tail of the job (run 38912085538).
# Priority 50 starts it right after the exclusive tests above, so it overlaps
# the rest of the job instead of ending it.
[[profile.default.overrides]]
filter = 'package(lgwks_std) & binary(it) & test(/^sim_shared_policy_tiers::/)'
priority = 50

# #272: the persist tests spend their time in the kernel (open, rename, write),
# and macOS serializes that work host-wide, so more concurrent processes buy more
# kernel time, not more throughput. The 236 lgwks_bot cas and journal tests, one
# process each as nextest runs them, on one idle host: one at a time 20.6 s wall
# and 17.4 s sys, three at a time 12.7 s and 29.7 s, six at a time 15.4 s and
# 72.1 s. Six processes on six separate volumes cost the same (14.5 s, 66.9 s
# sys), so the limit is the kernel's and not a volume's, and thirteen runners on
# one host feed it together. Three is the fastest wall; a fourth only adds sys
# time. The same shape holds for sim_vendor_coverage (2.9 s to 11.6 s sys, one to
# six) and sim_fs_walk (2.4 s to 6.9 s). The group limits its own members and
# leaves every other slot to the rest of the run. Linux runs these tests 17 to 89
# times faster than macOS with no cap, so the override is macOS-only.
[test-groups]
file-churn = { max-threads = 3 }

[[profile.default.overrides]]
filter = '(package(lgwks_bot) & binary(it) & test(/^(sim_cas_disk|sim_cas_corrupt|sim_cas_execute|sim_cas|sim_journal|sim_tenant_store)::/)) | (package(lgwks_deps) & binary(it) & test(/^sim_vendor_coverage::/)) | (package(lgwks_std) & binary(it) & test(/^sim_fs_walk(_prune)?::/))'
platform = 'cfg(target_os = "macos")'
test-group = 'file-churn'

# The CI profile: the same runs, each writing a JUnit report of what it actually
# ran, so the acceptance receipt can be built from the suite's own output instead
# of running it a second time. `store-success-output = false` keeps a report to
# what a reader needs -- per test, one status and one duration -- rather than the
# captured stdout of every passing test, which for this crate is megabytes.
#
# `path` is a bare filename on purpose. nextest resolves it relative to the
# runner's own report directory, so a path carrying directories in it is appended
# to that directory and lands at `target/nextest/ci/target/nextest/ci/junit.xml`.
# Wherever it lands it is under `target/`, which is already ignored, so a report
# is a derived artifact and never reaches the repository.
[profile.ci]
[profile.ci.junit]
path = "junit.xml"
store-success-output = false

# #272: on macOS the bot-full job does not run lgwks_bot's `sim_review_path`
# binary or the `sim_scale` module of its `it` binary; the saturation job does,
# beside its tiers, with `--ignore-default-filter` (the lane
# `tests-bot-saturation`). The suite is bounded by its work and not by its order:
# on run 38904371387 the 4,870 tests held 1,916 slot-seconds, which nine threads
# cannot finish in under 213 s, and the job was cancelled at its 5 min cap with
# every test passed; on run 38912085538 it was cancelled again with 1,880. The
# binary's 42 tests held 206 of those slot-seconds, and the 164 `sim_scale`
# tests 250 (that run) to 477 (run 38911289882, where the other modules ran
# faster). They are tenant-scale journal and fsync simulations, which cost 10.3 s
# of wall at nine threads on an idle host (27.5 s at one), so the rest is kernel
# contention with the other tests of the job, and they are what a saturation
# instance, idle for 190 s of its 300, is for. Linux keeps them in the bot-full
# container run (this filter is macOS-only), and the acceptance receipt reads
# both jobs' JUnit reports, so no test is dropped from either platform.
[[profile.ci.overrides]]
platform = 'cfg(target_os = "macos")'
default-filter = 'not (binary(sim_review_path) | (package(lgwks_bot) & binary(it) & test(/^sim_scale::/)))'

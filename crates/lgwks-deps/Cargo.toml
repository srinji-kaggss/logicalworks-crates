[package]
name = "lgwks_deps"
description = "Dependency admission, supply-chain policy, and debugger-doctor CLI for a Rust workspace: every external edge and default trace install is verified."
version = "4.2.1"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/srinji-kaggss/logicalworks-crates"
documentation = "https://docs.rs/lgwks_deps"
readme = "README.md"
homepage = "https://github.com/srinji-kaggss/logicalworks-crates/tree/main/crates/lgwks-deps"
categories = ["development-tools", "config"]
keywords = ["dependencies", "audit", "supply-chain", "cargo", "debug"]
# The documentation spells its commands `cargo run -p lgwks_deps -- check .`
# (AGENTS.md, CONTRIBUTING.md, the dependency doctrine). With several binaries
# cargo refuses a bare `cargo run`, so the one those pages mean is named here;
# tests/it/default_run.rs holds the key to that promise.
default-run = "lgwks-deps"

# This crate consumes JSON only through the facade it enforces.
# Depending on serde_json directly here would make the checker its own first
# bypass.
#
# There is no default feature: the zero-gate source scan (INV-SCAN-ZERO) used to
# be the one, and held `syn` here. It now lives in `lgwks_ast` (feature `scan`),
# which reads Rust through its one tree-sitter parser (ADR 0002, #408), so this
# crate authors no Rust grammar at all.
[features]
# Every capability this crate owns is on by default (Director, 2026-10-22, #732):
# the proc-macro authoring stack, the `script!` token reader, the whole tokio
# storefront and the Bevy runtime set. ADR 0003 is the decision.
#
# The storefront's default selection is empty, and that is a decision this
# register states rather than an omission: the target matrix builds this crate
# with no flags as a *required* claim for every declared target, `wasm32-wasip1`
# among them, and every storefront group is either native (`appcui`, `gpui`) or a
# driver with no wasm surface (`tokio-net`, `tokio-process`, `tokio-signal`). A
# default that cannot build on a declared target is not a default (ADR 0003).
#
# Discovery is what a storefront owes its user, and it is the catalog's job
# rather than a compile's: `lgwks-deps catalog` prints every group with its
# feature, its owner and its measured cost, so nothing here is hidden behind a
# flag an agent has to guess. Three groups are default-off with their measured
# cost in ADR 0003:
#
#   * `gpui` — the Apple-only GPU UI framework. `objc2` refuses to compile off
#     Apple targets, so a default carrying it would make this crate fail to build
#     on Linux and Windows.
#   * `ml-candle`, `ml-candle-metal`, `ml-tokenizers` — an ML inference runtime
#     and the HuggingFace tokenizer. Measured on this machine 2026-10-22:
#     `cargo check -p lgwks_deps --features ml-candle,ml-tokenizers` cost 90 s on
#     a warm target directory, against 35 s for `appcui`.
default = []
# Proc-macro authoring storefront: token streams (`proc-macro2`) and
# quasi-quoting (`quote`) a first-party proc-macro crate needs. `lgwks_macros` is
# the one consumer; it reaches both through the re-exports below, so this crate
# stays the only author of each edge.
macro = ["dep:proc-macro2", "dep:quote"]
# The token stream the `script!` language is read from (`lgwks_ast`'s `script`
# feature, #383): `proc-macro2` with span locations and nothing else, so a tool
# that reads scripts, and the macro that compiles them, share one parser
# without either pulling `syn` or `quote` for it.
script = ["dep:proc-macro2"]
# Storefront features. `lgwks_deps` is the install-and-select surface:
# the end user enables the third-party capability they want. gpui is Zed's GPU
# desktop UI framework; `tokio` is the async engine behind `lgwks_bot`'s runner
# surface. Both are selected above except gpui, whose Apple-only closure is why
# it is not in the default set.
gpui = ["dep:gpui", "gpui/default"]
appcui = ["dep:appcui"]
# ML inference storefront. Candle is HuggingFace's minimalist Rust ML framework:
# `ml-candle` brings tensor compute, NN layers, and the transformer model
# registry; `ml-candle-metal` adds the macOS Metal backend to that set.
# `ml-tokenizers` is the HuggingFace subword tokenizer used for tokenizer
# parity with the reference runtime. The measured cost of selecting them is in
# the `default` comment above and ADR 0003.
ml-candle = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers"]
ml-candle-metal = ["ml-candle", "candle-transformers/metal"]
ml-tokenizers = ["dep:tokenizers"]
tokio = ["dep:tokio"]
tokio-time = ["tokio", "tokio/time"]
tokio-sync = ["tokio", "tokio/sync"]
tokio-macros = ["tokio", "tokio/macros"]
# The reader/writer traits and their extensions. Split out from `net` because a
# consumer can need `AsyncRead`/`AsyncWrite` over a pipe, a file, or its own
# transport without ever opening a socket — and until this existed, `io-util`
# was reachable only by enabling the whole networking stack to get it.
tokio-io = ["tokio", "tokio/io-util", "tokio/io-std"]
tokio-net = ["tokio-io", "tokio/net"]
tokio-process = ["tokio", "tokio/process"]
tokio-fs = ["tokio", "tokio/fs"]
tokio-signal = ["tokio", "tokio/signal"]
tokio-full = [
    "tokio-time",
    "tokio-sync",
    "tokio-macros",
    "tokio-io",
    "tokio-net",
    "tokio-process",
    "tokio-fs",
    "tokio-signal",
]
# ECS storefront. One state substrate serves three consumers: `lgwks_bot`'s
# four-verb actors, drishti's incremental derivation, and the GPU framework's
# demand-driven execution. `bevy-ecs` is the substrate; the other three are what
# turn it into a runtime rather than a data structure. All four are in the
# default set and pull no renderer, no windowing, and no audio.
bevy-ecs = ["dep:bevy_ecs"]
bevy-app = ["bevy-ecs", "dep:bevy_app"]
bevy-time = ["bevy-ecs", "dep:bevy_time"]
bevy-state = ["bevy-ecs", "dep:bevy_state"]
# Interim zoned time (jiff): DST-aware calendar arithmetic and IANA zones
# until ELIMINATE lands in lgwks_std::time. Default-off; lgwks_std::time stays
# the UTC RFC 3339 core.
time-jiff = ["dep:jiff"]

[dependencies]
# The foundation this gate is built on, named rather than inherited: `core` is
# the walk, clock and encoding it reads with, `trace` is how it logs a refusal,
# and `json` is the register and report format. `default-features = false`
# because a *tool's* edge declares the capabilities it uses; the storefront's
# own default set is what it sells to a consumer, and that is argued in the
# `[features]` block above. Keeping the edge exact also keeps the four
# storefront fixtures' lockfiles independent of `lgwks_std`'s default set.
lgwks_std = { workspace = true, default-features = false, features = ["core", "trace", "json"] }
proc-macro2 = { version = "1", features = ["span-locations"], optional = true }
quote = { version = "1", optional = true }
gpui = { version = "0.2", optional = true }
appcui = { version = "=0.5.5", default-features = false, optional = true }
# Bevy's ECS and the three crates that make it a runtime. `default-features =
# false` throughout, and two omissions are deliberate: `bevy_reflect` stays off
# (it is the expensive half of `bevy_ecs`'s default set and this workspace does not
# need runtime type reflection), and `multi_threaded` stays off, because the
# multithreaded executor admits any system whose access set is disjoint from the
# running set, so the order of two non-conflicting systems is not fixed. A bot
# polling sources does not need parallel scheduling and cannot afford that.
bevy_ecs = { version = "0.20", default-features = false, features = ["std"], optional = true }
bevy_app = { version = "0.20", default-features = false, optional = true }
bevy_time = { version = "0.20", default-features = false, optional = true }
bevy_state = { version = "0.20", default-features = false, optional = true }
# The engine is compiled `default-features = false` with the portable `rt`
# feature always on. Native targets add `rt-multi-thread`; WASM targets use the
# current-thread runtime because Tokio does not provide its multi-thread driver
# there. Every other driver is a storefront feature the consumer selects.
tokio = { version = "1", default-features = false, features = ["rt"], optional = true }
# Candle and the HuggingFace tokenizer are storefront edges: optional and
# default-off, so `cargo build`/`cargo install` pulls none of them. Model
# weights load from local files; `candle-transformers` itself pulls `hf-hub`,
# so selecting `ml-candle` does compile a network-capable closure even though
# the runtime reads a local checkpoint.
candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }
candle-transformers = { version = "0.11", default-features = false, optional = true }
tokenizers = { version = "0.23", optional = true }
# Interim zoned time: jiff with system zoneinfo plus bundled fallback, no
# default features so the no-flag build stays portable. Consumers opt in via
# --features time-jiff and reach it only through lgwks_deps::storefront::jiff.
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-bundle-platform", "tzdb-zoneinfo", "tzdb-concatenated"], optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { version = "1", default-features = false, features = ["rt-multi-thread"], optional = true }
# Capture-file distinguishers need OS entropy, and the estate has exactly one
# source: `lgwks_std::random` (INV-RANDOM-ONE-SOURCE). That module refuses wasm
# with a `compile_error!`, and the WASI boundary job builds this crate for
# `wasm32-wasip1`, so the feature rides the same host-only target gate as
# tokio above rather than the unconditional edge: the wasm build names its
# capture files from a clock and a sequence under exclusive creation instead.
# This adds no edge of its own — a feature of a dependency already held —
# which keeps the tree at one entropy source rather than two.
lgwks_std = { workspace = true, default-features = false, features = ["random"] }

[[bin]]
name = "lgwks-deps"
path = "src/main.rs"

[[bin]]
name = "llms-txt"
path = "src/bin/llms_txt.rs"

# The project page, written to a build directory and deployed by the Pages
# workflow: the repository holds Rust, so the page is generated, never checked
# in, and cannot drift from the crate list (`every_crate_directory_is_on_the_page`).
[[bin]]
name = "render-site"
path = "src/bin/render_site.rs"

[[bin]]
name = "check-requirements"
path = "src/bin/check_requirements.rs"

# The capability catalog (#732): the discovery half of the std-first gate. It
# prints the register, emits it as JSON for an agent, writes the generated page
# and refuses a register that disagrees with the tree.
[[bin]]
name = "catalog"
path = "src/bin/catalog/main.rs"

# The documentation-governance reader: every ADR against ISO/IEC/IEEE 42010 and
# every PRD requirement against ISO/IEC/IEEE 29148.
[[bin]]
name = "check-docs"
path = "src/bin/check_docs/main.rs"

# The declared target matrix, executed: the required Rust-only surface on every
# target, and each crate's default set recorded with its declared C-toolchain
# exemption. It replaced a shell script on 2026-10-22, when `hash` joined the
# default set and the required check had to name a set with no C in it.
[[bin]]
name = "check-target-matrix"
path = "src/bin/check_target_matrix.rs"

[[bin]]
name = "check-spec-owners"
path = "src/bin/check_spec_owners.rs"

[[bin]]
name = "check-doc-citations"
path = "src/bin/check_doc_citations/main.rs"

[[bin]]
name = "check-gate-parity"
path = "src/bin/check_gate_parity/main.rs"

[[bin]]
name = "check-std-first"
path = "src/bin/check_std_first/main.rs"

[[bin]]
name = "ci-local"
path = "src/bin/ci_local/main.rs"

[[bin]]
name = "acceptance-receipts"
path = "src/bin/acceptance_receipts/main.rs"

[[bin]]
name = "linux-container-tests"
path = "src/bin/linux_container_tests/main.rs"

# The downstream proof of a release (#155, #526): every published crate built
# from crates.io at its newest tag, with the README's own quickstart.
[[bin]]
name = "published-consumer"
path = "src/bin/published_consumer/main.rs"

[[bin]]
name = "ai-authoring"
path = "src/bin/ai_authoring/main.rs"

# The nextest wrapper that holds one of a few machine-wide slots while a test
# process runs (#272); `.config/nextest.toml` names it.
[[bin]]
name = "churn-slot"
path = "src/bin/churn_slot.rs"

[lib]
name = "lgwks_deps"
path = "src/lib.rs"

[dev-dependencies]
proptest = { version = "1.11", default-features = false, features = ["std"] }

[lints]
workspace = true

[package.metadata.docs.rs]
# Not `all-features`. docs.rs builds for x86_64-unknown-linux-gnu, and two
# storefront features are platform-bound: `gpui` pulls `objc2`, which refuses to
# compile off Apple targets, and `ml-candle-metal` selects Candle's Metal
# backend. With `all-features = true` every published version failed to build,
# so this crate had no rendered documentation at all. This list is the set the
# CI doc and clippy lanes already verify on Linux; the platform-bound features
# are covered by the per-platform jobs instead.
features = [
    "tokio-full",
    "appcui",
    "bevy-app",
    "bevy-time",
    "bevy-state",
]
rustdoc-args = ["--cfg", "docsrs"]

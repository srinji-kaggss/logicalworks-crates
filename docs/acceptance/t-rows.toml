# Machine-readable acceptance map for the T01-T36 falsifier rows in
# `docs/orchestration-acceptance.spec.md`. One file, one concern: which named
# tests address which row, and how far that evidence honestly reaches.
#
# Every `tests` entry is a nextest test name as `cargo nextest list` prints it:
# `<binary>::<test>` for a separate integration binary, and `it::<test>` for the
# consolidated `tests/it/` binary, where `<test>` is `module::function`.
# `scripts/acceptance-receipts.py` reads this file, runs exactly these tests, and
# writes the observed result to `evidence/<revision>.json`.
#
# `state` is the spec's own evidence ladder:
#   planned                  - no test addresses the row
#   missing                  - a test is named but none observed passing
#   present                  - a named test exercises part of the row
#   exercised                - the row's falsifier is driven through its interface
#   independently_evidenced - plus evidence from outside this crate's tests
#   accepted                 - the release run recorded it
# `gap` states, in one sentence, what the named tests still do not assert. A row
# with no gap is one whose text is fully falsified by the tests named.

schema = 1
spec = "docs/orchestration-acceptance.spec.md"

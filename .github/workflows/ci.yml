name: ci
on:
  # A pull request already runs this matrix for its head commit, so triggering
  # on every branch push ran all eleven jobs a second time for the same tree.
  # A branch is covered by its pull request; `main` is covered here, after the
  # merge that put it there.
  push:
    branches: [main]
  pull_request:

# No job waits on another. `needs: [build]` made every job queue behind the
# 1.5-minute gate job, which gated nothing: a failing gate step still fails the
# run with every other job running beside it. The run's wall clock is its
# slowest job.

# Supersede rather than duplicate. Two `pull_request` events in one group are
# the same branch pushed twice, so the older run is cancelled. A run on `main`
# never is: that run is the record of what shipped. Each `main` push is its own
# group, keyed by commit: sharing one group made a merge's run sit pending until
# the previous merge's run finished (measured 2026-09-30: 678 s queued before a
# 293 s run), because a concurrency group admits one run at a time. A pull
# request is keyed by its number, not its branch name: two fork PRs from
# branches that share a name (`patch-1`) would otherwise cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  build:
    name: Build + gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Pin Rust 1.99.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          components: clippy, rustfmt
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          # Restore on every run, save only from `main`: a pull request reads the
          # last merged build instead of writing a cache entry per branch.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Verify lockfile is up-to-date
        run: >
          cargo metadata --locked --format-version 1 >/dev/null ||
          { echo 'Lockfile out of date: run cargo update --workspace and commit Cargo.lock' >&2; exit 1; } &&
          for f in crates/lgwks-deps/tests/fixtures/*/Cargo.lock; do if ! cargo metadata --locked --format-version 1 --manifest-path "${f%.lock}.toml" >/dev/null; then echo "stale fixture lockfile $f: run cargo update --workspace --manifest-path ${f%.lock}.toml" >&2; exit 1; fi; done
      - name: Enforce dependency edge ownership
        run: cargo run --locked -p lgwks_deps --bin lgwks-deps -- check .
      - name: Verify invariant enforcement references resolve
        run: python3 scripts/ci_local.py --lane invariants
      - name: Audit std-first and lgwks_std-first
        # The manifest gate above sees every authored edge. This reads the
        # source for the two failures a manifest cannot show: a `use` no
        # manifest declares, and a capability hand-rolled beside the
        # `lgwks_std` module that already provides it.
        run: python3 scripts/check-std-first.py --test && python3 scripts/check-std-first.py
      - name: Forbid unwrap outside tests
        # Safety bar: library code fails loud with typed errors or named
        # expects, never bare unwrap. Doc examples count as shipped surface.
        run: python3 scripts/ci_local.py --lane unwrap-scan
      - name: Build all workspace targets
        run: cargo test --workspace --all-targets --locked --no-run

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Pin Rust 1.99.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          components: rustfmt
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          # Restore on every run, save only from `main`: a pull request reads the
          # last merged build instead of writing a cache entry per branch.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check formatting
        run: cargo fmt --all -- --check

  # The three test suites run as three jobs, not three steps of one. Each spends
  # about three minutes running tests (the `sim_scale` tiers alone sum to
  # ~620 s of test time in every suite), so in one job they queued behind each
  # other for ~12 minutes. Side by side, the run is as long as its slowest
  # suite. Every command is unchanged; only where it runs moved.
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Two shards of one nextest run: `--partition count:N/2` splits the suite by
    # test, so the shards cover it exactly once between them. The suite was 269 s
    # of a 308 s job; halved, the job is as long as one shard plus its build.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # The simulation suites write a real file journal and `sync_all` it. On the
    # runner's disk those syncs queue behind each other; on tmpfs they cost
    # nothing and the syscalls, the code and every assertion are unchanged.
    # Measured on sim_scale alone: 104 s on disk, 21.6 s on a RAM volume.
    env:
      TMPDIR: /dev/shm
      # The Clippy job is where lints run, with `-D warnings`, over the same
      # workspace. `.cargo/config.toml` also routes every workspace compile
      # through clippy-driver so a plain local build enforces them; repeating the
      # lint pass in each test shard only adds to the compile that gates the run.
      # Empty is "no wrapper" to cargo, and the compiled code is identical.
      RUSTC_WORKSPACE_WRAPPER: ""
    steps:
      - uses: actions/checkout@v4
      - name: Pin Rust 1.99.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          components: clippy
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          # Restore on every run, save only from `main`: a pull request reads the
          # last merged build instead of writing a cache entry per branch.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: Run all workspace tests
        env:
          PARTITION: count:${{ matrix.shard }}/2
        run: cargo nextest run --workspace --locked -E 'not binary(storefront_consumers)' ${PARTITION:+--partition $PARTITION}
      # The three checks below are not part of the partitioned suite; they run
      # once, on the first shard, rather than once per shard.
      - name: Deterministic simulation evidence
        if: matrix.shard == 1
        run: python3 scripts/ci_local.py --lane simulation-evidence
      - name: Doc tests
        if: matrix.shard == 1
        run: cargo test --workspace --doc --locked
      - name: Debug doctor end-to-end journey
        if: matrix.shard == 1
        run: python3 scripts/ci_local.py --lane debug-e2e

  tests_nodefault:
    name: Tests (lgwks-bot no default features, lgwks-std full)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TMPDIR: /dev/shm
    steps:
      - uses: actions/checkout@v4
      - name: Pin Rust 1.99.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          # Restore on every run, save only from `main`: a pull request reads the
          # last merged build instead of writing a cache entry per branch.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: Run lgwks-bot no-default-feature tests
        run: cargo nextest run -p lgwks_bot --all-targets --locked --no-default-features
      - name: Run lgwks-std full-feature tests
        run: cargo nextest run -p lgwks_std --all-targets --locked --features full

  tests_bot_full:
    name: Tests (lgwks-bot full)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Four shards of one nextest run (542 s of a 571 s job), covering the suite
    # exactly once between them.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      TMPDIR: /dev/shm
      # The Clippy job is where lints run, with `-D warnings`, over the same
      # workspace. `.cargo/config.toml` also routes every workspace compile
      # through clippy-driver so a plain local build enforces them; repeating the
      # lint pass in each test shard only adds to the compile that gates the run.
      # Empty is "no wrapper" to cargo, and the compiled code is identical.
      RUSTC_WORKSPACE_WRAPPER: ""
    steps:
      - uses: actions/checkout@v4
      - name: Pin Rust 1.99.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          # Restore on every run, save only from `main`: a pull request reads the
          # last merged build instead of writing a cache entry per branch.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: Run lgwks-bot async runner tests
        env:
          PARTITION: count:${{ matrix.shard }}/4
        run: cargo nextest run -p lgwks_bot --all-targets --locked --features full -E 'not test(saturation_r32_tier)' ${PARTITION:+--partition $PARTITION}

  tests_bot_saturation:
    # The saturation tiers (100, 1,000 and 10,000 concurrent runs) in a job of
    # their own: in a shard they set the run's wall (481 s on run 37205854158,
    # test phase 229 s against 61-63 s for the other three shards).
    name: Tests (lgwks-bot saturation)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TMPDIR: /dev/shm
      # The Clippy job is where lints run, with `-D warnings`, over the same
      # workspace. `.cargo/config.toml` also routes every workspace compile
      # through clippy-driver so a plain local build enforces them; repeating the
      # lint pass in each test shard only adds to the compile that gates the run.
      # Empty is "no wrapper" to cargo, and the compiled code is identical.
      RUSTC_WORKSPACE_WRAPPER: ""
    steps:
      - uses: actions/checkout@v4
      - name: Pin Rust 1.99.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          # Restore on every run, save only from `main`: a pull request reads the
          # last merged build instead of writing a cache entry per branch.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: Run lgwks-bot saturation tiers
        run: cargo nextest run -p lgwks_bot --locked --features full --test sim_review_path -E 'test(saturation_r32_tier)'

  bench_fairness:
    # Its own job: it builds a separate workspace root in release, and run after
    # the bot suite in one job it added that build to the slowest job's wall.
    name: Async fairness gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Pin Rust 1.98.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: bench/async
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Async fairness gate and concurrency ladder
        run: cargo run --release --manifest-path bench/async/Cargo.toml -- --mutant-check && cargo run --release --manifest-path bench/async/Cargo.toml -- --tiers && cargo run --release --manifest-path bench/async/Cargo.toml -- --matrix

  storefront_consumers:
    # Standalone consumer packages, one cargo build per storefront family.
    # Their own job so the Tests job is not held by nested builds that
    # serialize on one target-directory lock.
    name: Storefront consumers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Pin Rust 1.99.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          # Restore on every run, save only from `main`: a pull request reads the
          # last merged build instead of writing a cache entry per branch.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: Build storefront consumers
        run: cargo nextest run --locked -p lgwks_deps --test storefront_consumers

  simulation_evidence:
    name: successful simulation result
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Pin Rust 1.99.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          # Restore on every run, save only from `main`: a pull request reads the
          # last merged build instead of writing a cache entry per branch.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: Check successful simulation result
        run: python3 scripts/ci_local.py --lane simulation-evidence

  debug_e2e:
    name: successful end-to-end journey result
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Pin Rust 1.99.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          # Restore on every run, save only from `main`: a pull request reads the
          # last merged build instead of writing a cache entry per branch.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check successful end-to-end journey result
        run: python3 scripts/ci_local.py --lane debug-e2e

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Pin Rust 1.99.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          components: clippy
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          # Restore on every run, save only from `main`: a pull request reads the
          # last merged build instead of writing a cache entry per branch.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy all workspace targets
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # INV-SCAN-ZERO. `scan` was the gate's own debt ledger and no lane ran it,
      # so 433 findings sat in shipped source while the name was advertised as
      # an invariant nothing checked. It is a lane now, and it refuses on any
      # finding rather than reporting a count.
      - name: Scan reports zero findings
        run: cargo run --locked --release -p lgwks_deps --bin lgwks-deps -- scan
      - name: Clippy feature matrix
        # Per-crate all-features (gpui excluded: it needs the Xcode Metal
        # toolchain and is covered by the gpui-macos job, not ubuntu lanes).
        run: >
          cargo clippy --locked --manifest-path crates/lgwks-std/Cargo.toml
          --all-targets --all-features -- -D warnings &&
          cargo clippy --locked --manifest-path crates/lgwks-bot/Cargo.toml
          --all-targets --all-features -- -D warnings &&
          cargo clippy --locked --manifest-path crates/lgwks-ast/Cargo.toml
          --all-targets --all-features -- -D warnings &&
          cargo clippy --locked --manifest-path crates/lgwks-deps/Cargo.toml
          --all-targets --features tokio-full -- -D warnings
      - name: Clippy no default features
        run: >
          cargo clippy --locked --manifest-path crates/lgwks-std/Cargo.toml
          --all-targets --no-default-features -- -D warnings &&
          cargo clippy --locked --manifest-path crates/lgwks-bot/Cargo.toml
          --all-targets --no-default-features -- -D warnings &&
          cargo clippy --locked --manifest-path crates/lgwks-ast/Cargo.toml
          --all-targets --no-default-features -- -D warnings
      - name: Clippy process-only
        # `process` alone is a supported consumer shape: a bot that starts
        # children and nothing else. It was missing from the matrix, so a
        # deadline path naming the `time` module compiled under `--all-features`
        # and broke this build (issue #131).
        run: >
          cargo clippy --locked --manifest-path crates/lgwks-bot/Cargo.toml
          --all-targets --no-default-features --features process -- -D warnings

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Pin Rust 1.99.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          # Restore on every run, save only from `main`: a pull request reads the
          # last merged build instead of writing a cache entry per branch.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Doc build with broken-link denial
        # Every feature on, per crate (gpui excluded: it needs the Xcode Metal
        # toolchain and is covered by the gpui-macos job, not ubuntu lanes).
        # `scripts/doc-lanes.sh` holds the commands and the reason for each
        # lane, so this job and a contributor run the same four of them.
        run: ./scripts/doc-lanes.sh all-features
      - name: Doc build without default features
        # No features on. A module in `core` that links to a feature-gated
        # module resolves under `--all-features` and breaks here.
        run: ./scripts/doc-lanes.sh no-default-features
      - name: Doc build at the default feature set
        # The set `cargo add lgwks_std` hands a consumer, which neither boundary
        # lane builds: `--all-features` resolves a link into a gated module, and
        # `--no-default-features` does not compile the module holding the link,
        # so a default-on to default-off link is invisible to both.
        run: ./scripts/doc-lanes.sh default
      - name: Doc build for each lgwks-std feature alone
        # The general case: a link between two optional modules where neither
        # implies the other resolves under both boundary lanes. Each feature is
        # documented alone, so every gated module is documented while every
        # module it does not pull in is genuinely absent.
        run: ./scripts/doc-lanes.sh per-feature
      - name: docs.rs metadata names a buildable feature set
        # docs.rs builds with whatever `[package.metadata.docs.rs]` declares,
        # and a failure there is invisible from the repository: the crate page
        # just shows a build error. `all-features = true` on a crate whose
        # features include platform-bound ones fails on every publish, which is
        # what happened to lgwks_deps: `gpui` pulls `objc2`, which refuses to
        # compile off Apple targets. Build with the declared set so an
        # unbuildable declaration fails here instead of on docs.rs.
        run: python3 scripts/ci_local.py --lane docsrs-metadata
      - name: llms.txt matches the documentation index
        # `llms.txt` is generated from the README's own tables by
        # `scripts/gen-llms-txt.py`. Regenerate and fail if the committed copy
        # differs, so the index cannot drift from the documents it points at: a
        # stale index is worse than none, because an agent trusts it and stops
        # looking. The script also fails when a document in `docs/` is missing
        # from the table, so a new document cannot be invisible to every reader
        # that arrives through this file.
        run: |
          set -eu
          python3 scripts/gen-llms-txt.py
          git diff --exit-code -- llms.txt
      - name: Documentation citations resolve
        # The guides cite `path:NNN` for each factual claim, and every merge
        # moves the lines under them. A rotted citation is invisible: the page
        # still reads as sourced, and a reader who checks one and finds
        # something unrelated stops trusting the rest. This checks the part
        # that is not a judgement call — the file exists, and the line exists
        # in it. `docs/bevy-admission.md` is exempt because it cites Bevy's own
        # repository; the script names that exemption rather than guessing.
        run: python3 scripts/check-doc-citations.py
      - name: Root README quickstart matches its compiled example
        run: python3 scripts/ci_local.py --lane readme-quickstart
  # The storefront checks run beside the bot and ast matrices below rather than
  # before them: one job was 5.4 minutes of `cargo check` in series, the
  # longest in the run once the test suites were split.
  feature-matrix-std-deps:
    name: lgwks-std and lgwks-deps feature matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Pin Rust 1.99.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          # Restore on every run, save only from `main`: a pull request reads the
          # last merged build instead of writing a cache entry per branch.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check lgwks-std feature matrix
        run: |
          set -eu
           cargo check --locked --manifest-path crates/lgwks-std/Cargo.toml --all-targets --no-default-features
           cargo check --locked --manifest-path crates/lgwks-std/Cargo.toml --all-targets
           cargo check --locked --manifest-path crates/lgwks-std/Cargo.toml --all-targets --features hash --no-default-features
           cargo check --locked --manifest-path crates/lgwks-std/Cargo.toml --all-targets --features pattern --no-default-features
           cargo check --locked --manifest-path crates/lgwks-std/Cargo.toml --all-targets --features json --no-default-features
           cargo check --locked --manifest-path crates/lgwks-std/Cargo.toml --all-targets --features wire --no-default-features
           cargo check --locked --manifest-path crates/lgwks-std/Cargo.toml --all-targets --features http --no-default-features
           cargo check --locked --manifest-path crates/lgwks-std/Cargo.toml --all-targets --features online --no-default-features
           cargo check --locked --manifest-path crates/lgwks-std/Cargo.toml --all-targets --features fs-raw --no-default-features
            cargo check --locked --manifest-path crates/lgwks-std/Cargo.toml --all-targets --all-features
      - name: Check lgwks-deps
        run: cargo check --locked --manifest-path crates/lgwks-deps/Cargo.toml --all-targets
      - name: Check lgwks-deps storefront engine feature
        run: cargo check --locked --manifest-path crates/lgwks-deps/Cargo.toml --all-targets --features tokio
      - name: Check lgwks-deps GPUI storefront feature
        run: cargo check --locked --manifest-path crates/lgwks-deps/Cargo.toml --all-targets --features gpui
      - name: Check lgwks-deps ML storefront features
        run: cargo check --locked --manifest-path crates/lgwks-deps/Cargo.toml --all-targets --features ml-candle,ml-tokenizers

  feature-matrix:
    name: lgwks-bot and lgwks-ast feature matrix
    runs-on: ubuntu-latest
    # 30 minutes covered the check lanes only; the grammar matrix below builds
    # and runs 31 test configurations, so the budget matches the work.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Pin Rust 1.99.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          # Restore on every run, save only from `main`: a pull request reads the
          # last merged build instead of writing a cache entry per branch.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check lgwks-bot async feature matrix
        run: |
          set -eu
           cargo check --locked --manifest-path crates/lgwks-bot/Cargo.toml --all-targets --no-default-features
           cargo check --locked --manifest-path crates/lgwks-bot/Cargo.toml --all-targets
           cargo check --locked --manifest-path crates/lgwks-bot/Cargo.toml --all-targets --features net,process,fs,signal
           cargo check --locked --manifest-path crates/lgwks-bot/Cargo.toml --all-targets --all-features
      - name: Check lgwks-bot WASI runtime boundary
        run: |
          set -eu
          rustup target add wasm32-wasip1
           RUSTFLAGS="" cargo check --locked --manifest-path crates/lgwks-bot/Cargo.toml --target wasm32-wasip1 --features rt
      - name: Check lgwks-ast feature matrix
        run: |
          set -eu
           cargo check --locked --manifest-path crates/lgwks-ast/Cargo.toml --all-targets --no-default-features
           cargo check --locked --manifest-path crates/lgwks-ast/Cargo.toml --all-targets
           cargo check --locked --manifest-path crates/lgwks-ast/Cargo.toml --all-targets --all-features
      - name: Execute the lgwks-ast grammar matrix
        # The check above proves each combination compiles; this executes it. A
        # grammar that compiles but does not read its own language is the
        # failure `cargo check` cannot see, and the grammar features are
        # admitted independently, so each standalone grammar is exercised on its
        # own rather than inferred from the all-features lane.
        #
        # The 28 grammars go in ONE `cargo test` invocation, not a loop of 28.
        # Each separate invocation re-resolves the feature set and relinks the
        # whole ast-grep and tree-sitter stack, which was ~6 minutes of this
        # run's wall clock; listing the features together builds the shared
        # stack once and runs every grammar in one process. The no-default and
        # all-features legs stay separate — they are two more feature sets, not
        # 28, and each is a different resolution the combined call cannot make.
        run: |
          set -u
          failed=0
          execute() {
            echo "::group::$*"
            if ! "$@"; then
              echo "::error::lgwks-ast grammar matrix failed: $*"
              failed=1
            fi
            echo "::endgroup::"
          }
          execute cargo test --locked -p lgwks_ast --lib --no-default-features
          execute cargo test --locked -p lgwks_ast --lib
          # Every standalone grammar, one build. A grammar that fails to parse
          # its own language still fails here: the per-grammar test reads that
          # grammar's fixture, and nextest/cargo reports the failing test by
          # name either way.
          execute cargo test --locked -p lgwks_ast --lib --no-default-features \
            --features lang-bash,lang-c,lang-cpp,lang-csharp,lang-css,lang-dart,lang-elixir,lang-go,lang-haskell,lang-hcl,lang-html,lang-java,lang-javascript,lang-json,lang-kotlin,lang-lua,lang-md,lang-nix,lang-php,lang-python,lang-ruby,lang-rust,lang-scala,lang-solidity,lang-swift,lang-tsx,lang-typescript,lang-yaml
          execute cargo test --locked -p lgwks_ast --lib --all-features
          exit "$failed"

  appcui-native:
    name: AppCUI native storefront
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          components: clippy
      - run: cargo test --locked -p lgwks_deps --no-default-features --features appcui --lib
      - run: cargo test --locked -p lgwks_deps --no-default-features --features appcui --doc
      - run: cargo clippy --locked -p lgwks_deps --no-default-features --features appcui --all-targets -- -D warnings

  # Its own job rather than a step of the AppCUI Windows leg: the GPUI build is
  # 194 s, and behind the AppCUI steps it made that leg the run's longest job.
  gpui-windows:
    name: GPUI Windows renderer
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Pin Rust 1.99.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          # Restore on every run, save only from `main`: a pull request reads the
          # last merged build instead of writing a cache entry per branch.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check GPUI Windows renderer fixture
        run: >
          cargo check --locked
          --manifest-path crates/lgwks-deps/tests/fixtures/storefront-matrix/Cargo.toml
          --no-default-features --features gpui --example gpui

  gpui-macos:
    name: GPUI macOS renderer
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Pin Rust 1.99.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          # Restore on every run, save only from `main`: a pull request reads the
          # last merged build instead of writing a cache entry per branch.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check normal GPUI renderer feature
        # The fixture is its own workspace, so by default it builds into its
        # own target directory and compiles the GPUI stack a second time.
        # Pointing it at the directory the first check just filled reuses
        # every unit whose features match.
        run: >
          cargo check --locked -p lgwks_deps --all-targets --features gpui &&
          cargo check --locked
          --manifest-path crates/lgwks-deps/tests/fixtures/storefront-matrix/Cargo.toml
          --target-dir "${CARGO_TARGET_DIR:-target}"
          --no-default-features --features gpui --example gpui

  candle-macos:
    name: Candle ML storefront (Metal)
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Pin Rust 1.99.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          # Restore on every run, save only from `main`: a pull request reads the
          # last merged build instead of writing a cache entry per branch.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check Candle Metal storefront features
        run: cargo check --locked -p lgwks_deps --all-targets --features ml-candle-metal,ml-tokenizers

  contract-drift:
    name: lgwks-std contract drift checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate the dependency contract alignment
        run: python3 scripts/ci_local.py --lane contract-drift
      - name: Requirements sentences unedited without supersession
        run: python3 scripts/check-requirements.py
  package-smoke:
    name: lgwks-std package smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Pin Rust 1.99.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          # Restore on every run, save only from `main`: a pull request reads the
          # last merged build instead of writing a cache entry per branch.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run package smoke test
        run: ./scripts/lgwks-std-package-smoke.sh

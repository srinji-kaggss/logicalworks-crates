[package]
name = "lgwks_ast"
description = "One multi-language AST parser: language identification from path or shebang, opt-in content parsing, tree-sitter grammar selection by cargo feature, bounded traversal, and span-carrying typed diagnostics. Includes a typed-diagnostic derive."
version = "1.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/srinji-kaggss/logicalworks-crates"
documentation = "https://docs.rs/lgwks_ast"
readme = "README.md"
homepage = "https://github.com/srinji-kaggss/logicalworks-crates/tree/main/crates/lgwks-ast"
categories = ["development-tools", "parser-implementations"]
keywords = ["parser", "ast", "tree-sitter", "static-analysis", "code-analysis"]

# INV-AST-ONE-PARSER: this crate is the only multi-language AST
# parser. Code tools identify a language, select a grammar, and parse through
# it; they do not each depend on ast-grep and rebuild the language/extension
# tables. External edges: ast-grep-core and ast-grep-language for the
# grammars, `thiserror` for the shared diagnostic derive this crate re-exports
# so a downstream crate can derive without its own edge, `tracing` for the
# refusal signal, and `tree-sitter` for the parse deadline (#277).
#
# The crate also owns the shared typed-diagnostic
# derive (`thiserror`), used by `ParseError` and re-exported so downstream
# analysers derive `Display`/`source` here instead of each declaring the crate.
# It lives here rather than in `lgwks_std` to keep the core stack minimal.
#
# Grammar selection is per-language and opt-in. The default enables the seven
# languages the default set parses; every remaining grammar ast-grep-language
# ships is available as its own `lang-*` feature, and `full` enables all 28.
# An extension with no compiled grammar is not recognised, so a consumer never
# pays to compile a grammar it cannot select.
[features]
default = [
    "lang-rust",
    "lang-python",
    "lang-typescript",
    "lang-javascript",
    "lang-go",
    "lang-java",
    "lang-swift",
]
# The multi-language parser and its grammar stack (#367). Every `lang-*`
# feature enables it, so the default set has it; without it this crate is the
# typed-error derive and the diagnostic types alone, with no tree-sitter, so a
# consumer that wants only the derive does not compile a parser.
parser = [
    "dep:ast-grep-core",
    "dep:ast-grep-language",
    "dep:tracing",
    "dep:tree-sitter",
]
lang-rust = ["parser", "ast-grep-language/tree-sitter-rust"]
lang-python = ["parser", "ast-grep-language/tree-sitter-python"]
lang-typescript = ["parser", "ast-grep-language/tree-sitter-typescript"]
# TSX is not a separate upstream grammar: ast-grep parses `.tsx` with the
# TypeScript parser, so this feature forwards to the same crate as
# `lang-typescript` and pulls nothing further. It exists as its own feature
# because a `.tsx` file is a distinct thing to *select*, and a caller building
# a React tool should not have to know that upstream reuses one parser.
lang-tsx = ["parser", "ast-grep-language/tree-sitter-typescript"]
lang-javascript = ["parser", "ast-grep-language/tree-sitter-javascript"]
lang-go = ["parser", "ast-grep-language/tree-sitter-go"]
lang-java = ["parser", "ast-grep-language/tree-sitter-java"]
lang-swift = ["parser", "ast-grep-language/tree-sitter-swift"]
lang-c = ["parser", "ast-grep-language/tree-sitter-c"]
lang-cpp = ["parser", "ast-grep-language/tree-sitter-cpp"]
lang-csharp = ["parser", "ast-grep-language/tree-sitter-c-sharp"]
lang-scala = ["parser", "ast-grep-language/tree-sitter-scala"]
lang-kotlin = ["parser", "ast-grep-language/tree-sitter-kotlin"]
lang-bash = ["parser", "ast-grep-language/tree-sitter-bash"]
lang-css = ["parser", "ast-grep-language/tree-sitter-css"]
lang-dart = ["parser", "ast-grep-language/tree-sitter-dart"]
lang-elixir = ["parser", "ast-grep-language/tree-sitter-elixir"]
lang-haskell = ["parser", "ast-grep-language/tree-sitter-haskell"]
lang-hcl = ["parser", "ast-grep-language/tree-sitter-hcl"]
lang-html = ["parser", "ast-grep-language/tree-sitter-html"]
lang-json = ["parser", "ast-grep-language/tree-sitter-json"]
lang-lua = ["parser", "ast-grep-language/tree-sitter-lua"]
lang-md = ["parser", "ast-grep-language/tree-sitter-md"]
lang-nix = ["parser", "ast-grep-language/tree-sitter-nix"]
lang-php = ["parser", "ast-grep-language/tree-sitter-php"]
lang-ruby = ["parser", "ast-grep-language/tree-sitter-ruby"]
lang-solidity = ["parser", "ast-grep-language/tree-sitter-solidity"]
lang-yaml = ["parser", "ast-grep-language/tree-sitter-yaml"]
# The `script!` language's parser (SL-2, #383): `lgwks_ast::script::parse`,
# the typed script tree and the lexicon. `lgwks_macros` compiles scripts through
# it and a tool reads them through it, so the language has one reader. It needs
# token streams only, reached through the `lgwks_deps` storefront that owns the
# `proc-macro2` edge (INV-DEP-3), and logs each refusal through `tracing`; no
# grammar is selected by it, so the macro's build compiles no tree-sitter.
script = ["dep:lgwks_deps", "dep:tracing"]
full = [
    "lang-rust",
    "lang-python",
    "lang-typescript",
    "lang-tsx",
    "lang-javascript",
    "lang-go",
    "lang-java",
    "lang-swift",
    "lang-c",
    "lang-cpp",
    "lang-csharp",
    "lang-scala",
    "lang-kotlin",
    "lang-bash",
    "lang-css",
    "lang-dart",
    "lang-elixir",
    "lang-haskell",
    "lang-hcl",
    "lang-html",
    "lang-json",
    "lang-lua",
    "lang-md",
    "lang-nix",
    "lang-php",
    "lang-ruby",
    "lang-solidity",
    "lang-yaml",
]

[dependencies]
ast-grep-core = { version = "0.45", optional = true }
ast-grep-language = { version = "0.45", default-features = false, optional = true }
thiserror = { version = "2", default-features = false }
# The `unlogged-err-return` rule requires a recorded signal on every refusal,
# and `print_stderr` is `forbid` in library code. `lgwks_ast` stands outside the
# `lgwks_std` facade (INV-DEP-1), so it reaches `tracing` directly. Registered in
# `contract/APPROVED.toml`; `attributes` stays off so no proc-macro stack enters.
tracing = { version = "0.1", default-features = false, features = ["std"], optional = true }
# #277: the parse deadline. `ast-grep-core` builds its `Parser` privately and
# calls `parse` with no progress callback, so a parse through it cannot be
# stopped; `Parser::parse_with_options` and `ParseOptions::progress_callback` can.
# Admitted on the Director's word (2026-10-05) in `contract/APPROVED.toml`. The
# requirement is the one `ast-grep-core` 0.45 already resolves (0.27.0, default
# features), so this names an edge that was already compiled rather than adding
# a crate: the `Tree` built here is the type `StrDoc` holds.
tree-sitter = { version = "0.27", optional = true }
# The token streams `script` reads (feature `script`, #383), through the
# storefront that owns the edge; `default-features = false` keeps the `scan`
# detectors out, so the macro's build pulls `proc-macro2` and nothing else here.
lgwks_deps = { workspace = true, features = ["script"], optional = true }

[dev-dependencies]
# The script parser's line-tree properties (#273) moved here with the parser
# (#383): shrinking to the minimal misaligned tree, with persisted seeds.
proptest = { version = "1.11", default-features = false, features = ["std"] }
# `lgwks_std::seeded`, the one seeded stream the script simulations draw from
# (INV-STD-SEEDED-1), so a seed names the same scripts on every target.
lgwks_std = { workspace = true }

[[example]]
name = "parse"
required-features = ["lang-rust"]

# The parse-budget measurement (`scripts/measure-ast-budget.sh`, built with
# `full`) walks `Language::ALL`, so it needs the parser and nothing more: with no
# grammar compiled it measures nothing, rather than failing to build.
[[example]]
name = "parse_budget"
required-features = ["parser"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

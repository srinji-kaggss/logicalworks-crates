name: Local Rust toolchain
description: >
  Prepares a job on the self-hosted macOS runners (Director, 2026-10-04: CI runs
  on the local runner). The toolchain comes from rust-toolchain.toml and is
  checked against the pin, without touching the host's rustup default, which
  other projects on this machine rely on. The machine's own cargo
  configuration ($CARGO_HOME/config.toml) is deliberately left in force: the
  Director ruled on 2026-10-06 that CI builds with every optimisation it
  declares. WORKFLOW.md §12 is the specification this action implements.
inputs:
  toolchain:
    description: The toolchain the gate pins; the step fails when rust-toolchain.toml resolves to another.
    required: true
  nextest:
    description: Whether the job runs cargo-nextest, which must then be on PATH.
    required: false
    default: "false"
  min-free-gib:
    description: >
      Free space the volume must keep. Below it, this runner's build output is
      cleaned before the job builds, so a full disk fails no job. The default
      is two cold workspace builds with the machine's profiles.
    required: false
    default: "40"
  test-share:
    description: >
      This job's share of the machine's cores for test threads, in thirds: the
      threads are share × cores ÷ 3 ÷ runner instances, at least two. The
      default, 2, is two thirds of one instance's even share (see the step). A
      job that runs a whole suite the shards of several jobs used to split
      names the shares of the jobs it replaced. The shares are budgeted against
      fifteen cores and 24 GiB of RAM: run 37654108625 left 35 GiB of swap used
      with every job at the old default, and a hashing unit test that takes one
      second idle took 138 s swapping, so the sum of shares across the run must
      stay near the machine rather than per job. The suite shares sum past
      the cores but the suites are throughput-bound: cutting them ~40% (run
      37680643459) slowed every suite 20-30%, so they are restored
      (workspace 6, bot-full 8, no-default 6, matrix 3).
    required: false
    default: "2"
  build-share:
    description: >
      This job's share of the machine's cores for concurrent compiler and
      linker processes: CARGO_BUILD_JOBS is share × cores ÷ runner instances,
      at least one. The machine's own cargo configuration caps jobs at four,
      which thirteen concurrent jobs turned into 52 compiler processes on 15
      cores and 24 GiB of RAM (run 37654108625: 35 GiB of swap used). One
      opt-level-3 rustc holds ~0.9 GiB, so two slots per job is 26 of them
      plus the linkers, and run 37675264254 died six jobs at once with swap at
      96%. So the default is one slot, and a job raises it only for the
      codegen it holds: rustc's codegen threads draw on these slots, so one
      slot compiled lgwks-bot's opt-level-3 test binaries on one core (6 m 55 s,
      run 38304128455). ci.yml's header names which jobs take more.
    required: false
    default: "1"
  tmp-gib:
    description: >
      Ceiling of the RAM disk that holds this job's temporary files. A RAM disk
      takes memory only for the pages written to it, and it is recreated at
      every job start, so this bounds one job's temporary files rather than
      reserving memory. Zero keeps temporary files on disk.
    required: false
    default: "4"
runs:
  using: composite
  steps:
    # One target directory per runner instance, kept across runs, outside the
    # checkout that actions/checkout cleans. It is never shared between
    # instances: each instance checks out into its own directory, and cargo
    # fingerprints a workspace member by its path *relative to the workspace*,
    # so a build made in r2's checkout reads as fresh in r5's. The binary then
    # carries r2's `env!("CARGO_MANIFEST_DIR")` — r5's lgwks-std shard built
    # probes against r2's sources and failed when r2's checkout moved (run
    # 37513781767) — and source mtimes from another checkout can pass a build
    # of one commit off as a build of another.
    #
    # It is shared by every job the instance runs. An instance runs one job at
    # a time, so the directory has one writer, and a feature set is a distinct
    # unit hash, so jobs that build different feature sets keep both. One
    # directory per job instead held 25 copies of the dependency graph per
    # instance (206 GiB on 2026-10-07) and left each copy warm only for the job
    # that happened to land on that instance last.
    #
    # Incremental sessions are the exception: they are discarded at every job
    # start. A session is a cache of one tree's codegen units, and the next job
    # on the instance builds another branch's tree. Run 38100544425 built
    # c1a87ea43, which has no `ecs/work.rs`, and linked an lgwks_bot rlib whose
    # own codegen units called `ecs::work` symbols left by an earlier
    # refactor/ecs-split-401 job: `undefined symbol: drop_glue::<ecs::work::
    # PendingWork>` in two jobs on two instances. Dependencies are never built
    # incrementally, so the warm dependency graph is kept, and CARGO_INCREMENTAL
    # stays on within the job, where every build is of the one checked-out tree.
    - name: Persistent target directory
      shell: bash
      run: |
        set -euo pipefail
        target="$(cd "${RUNNER_WORKSPACE}/../.." && pwd)/target/${RUNNER_NAME}/shared"
        mkdir -p "${target}"
        echo "CARGO_TARGET_DIR=${target}" >> "${GITHUB_ENV}"
        for sessions in "${target}"/*/incremental "${target}"/*/*/incremental; do
          if [ -d "${sessions}" ]; then
            find "${sessions}" -mindepth 1 -delete
          fi
        done
        free_kib="$(df -Pk "${target}" | awk 'NR==2 {print $4}')"
        if [ "${free_kib}" -lt "$(( ${{ inputs.min-free-gib }} * 1024 * 1024 ))" ]; then
          echo "::warning::$(( free_kib / 1024 / 1024 )) GiB free, under ${{ inputs.min-free-gib }} GiB: cleaning ${target}"
          # cargo refuses to clean a directory without its CACHEDIR.TAG (run
          # 38410708974: `missing or invalid CACHEDIR.TAG` failed every job on
          # lwc-3 at 36 GiB free). The directory is this action's own, so the
          # tag is written first and the clean then runs.
          if [ ! -f "${target}/CACHEDIR.TAG" ]; then
            printf 'Signature: 8a477f597d28d172789f06886806bc55\n# This file is a cache directory tag created by cargo.\n' > "${target}/CACHEDIR.TAG"
          fi
          cargo clean --target-dir "${target}"
        fi
    # One compile cache for the machine, shared by every instance and every job.
    # Each instance keeps its own target directory (see the step above), so an
    # identical compile happens once per instance that needs it: measured on run
    # 38450101413, lgwks_bot with one feature set was compiled by the bot suite
    # and by both saturation legs, on three instances, and the build job's own
    # "Build all workspace targets" step read 765 s. sccache keys a compilation
    # by its preprocessed source, compiler and flags, so the second and later
    # jobs of a run read instead of compiling. SCCACHE_BASEDIRS is what makes
    # that work across instances: each runner checks out under its own `rN/`, and
    # without it the absolute paths inside the invocation would make every
    # instance's key, and so every instance's compile, distinct. Measured on this
    # machine with two identical checkouts at different absolute paths under one
    # SCCACHE_BASEDIRS: the second build was a cache hit. In CI at a 39% hit rate
    # over 909 compilations (run 38483769601), and the two heaviest feature-matrix
    # legs met their 5-minute bound on the attempt after their units were cached.
    # The cache is content-addressed and never stores a failed compilation, so a
    # hit cannot hide a broken build.
    - name: One compile cache shared by the machine's instances
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v sccache >/dev/null 2>&1; then
          echo "::warning::sccache is not installed: this job compiles from nothing, as it did before"
          exit 0
        fi
        dir="${SCCACHE_DIR:-${HOME}/.cache/sccache}"
        root="$(cd "${RUNNER_WORKSPACE}/../.." && pwd)"
        mkdir -p "${dir}"
        SCCACHE_DIR="${dir}" SCCACHE_CACHE_SIZE="${SCCACHE_CACHE_SIZE:-30G}" \
          SCCACHE_BASEDIRS="${root}" sccache --start-server >/dev/null 2>&1 || true
        {
          echo "RUSTC_WRAPPER=sccache"
          echo "SCCACHE_DIR=${dir}"
          echo "SCCACHE_CACHE_SIZE=${SCCACHE_CACHE_SIZE:-30G}"
          echo "SCCACHE_BASEDIRS=${root}"
          # sccache cannot cache an incremental compilation, and the next job on
          # this instance discards the sessions anyway, so the setting only ever
          # cost this job a directory it could not reuse.
          echo "CARGO_INCREMENTAL=0"
        } >> "${GITHUB_ENV}"
        SCCACHE_DIR="${dir}" sccache --show-stats 2>/dev/null | head -6 || true
        echo "compile cache: ${dir} (basedirs ${root})"
    # Temporary files on a RAM disk owned by this runner instance. Rust's
    # `File::sync_all` is `fcntl(F_FULLFSYNC)` on macOS, which flushes the
    # whole device's cache and serialises against every other flush on it, so
    # six instances' durable-store tests queued behind one another's syncs:
    # the full workspace suite took 385 s with its temporary files on the SSD
    # and 116.5 s with them on a RAM disk, on an idle machine, 5,430 tests
    # passing both times. No test simulates power loss (a crash test kills
    # with SIGKILL, and the page cache survives that), so no assertion depends
    # on the device the bytes reach, and production code keeps `sync_all`.
    #
    # The disk is APFS, the filesystem of the machine's own disk, so moving the
    # temporary files changes how fast a sync is and nothing else. HFS+ was
    # tried first and changed what the tests observed: it stores names
    # decomposed, so a directory walk reported `e\u{301}1` for a file created
    # as `\u{e9}1` and the path-byte budgets the walk simulations model no
    # longer matched (run 37613720499), and it stamps modification times to the
    # second, which hid a torn read from the stable-read protocol until it was
    # fixed in `lgwks_bot::stability`. APFS preserves names as written and
    # keeps nanosecond times; on a RAM store 500 `F_FULLFSYNC` calls take 0.1 s.
    #
    # The disk is detached and recreated at every job start: a RAM disk keeps
    # each page it ever wrote until it is detached, so recreating it is what
    # bounds its memory to one job's temporary files and leaves nothing of the
    # previous job behind. A machine where the disk cannot be made keeps its
    # temporary files on disk, with a warning naming the cost.
    #
    # The detach runs beside the job, not before it. Thirteen jobs start at once
    # and each used to eject the volume its instance's last job left; the ejects
    # queue behind one another, and thirteen at once took 20-29 s each on this
    # machine against 2.7 s to create a volume (the step read 9.4 s and 14.2 s in
    # runs 38814432873 and 38812907766, the longest step of the first minute). A
    # job's volume therefore carries a label of its own (the run id and the
    # second the step started): it never shares a name with a volume being
    # detached, so its mount point is known. The earlier volumes, and the
    # unsuffixed one earlier versions of this step made, are detached in the
    # background: thirteen jobs started together waited 3.5-5.6 s for their own
    # volumes while the detaches took 26-30 s beside them. Until a detach ends
    # an instance holds the old volume's written pages beside the new volume's,
    # so the bound is two volumes per instance for that window; a volume a
    # detach could not remove is named again in the next job's log.
    #
    # The label uses only the characters the unsuffixed one did (letters,
    # digits, dot, underscore, hyphen), because the temporary path is written
    # into scripts: `process_escape` puts it inside a double-quoted perl string,
    # where an `@` in the label read as an array, changed the path, and two
    # tests never saw their child's pid (run 38816702507).
    - name: Temporary files on a RAM disk
      shell: bash
      run: |
        set -euo pipefail
        owner="$(printf '%s' "${RUNNER_NAME:-local}" | tr -c 'A-Za-z0-9_.-' '-')"
        printf -v started '%(%s)T' -1
        label="lwc-tmp-${owner}-${GITHUB_RUN_ID:-0}-${started}"
        # This owner's volumes: the unsuffixed label, and the owner's name
        # followed by exactly two numbers. A longer owner name that begins with
        # this one never matches, because its remainder is not two numbers.
        left=()
        for old in "/Volumes/lwc-tmp-${owner}" "/Volumes/lwc-tmp-${owner}-"[0-9]*; do
          [ -d "${old}" ] || continue
          rest="${old#"/Volumes/lwc-tmp-${owner}"}"
          if [ -z "${rest}" ] || [[ "${rest}" =~ ^-[0-9]+-[0-9]+$ ]]; then
            left+=("${old}")
          fi
        done
        if [ "${#left[@]}" -gt 0 ]; then
          echo "detaching ${#left[@]} volume(s) an earlier job left: ${left[*]}"
          # Ejecting a volume detaches its APFS container and the RAM store
          # beneath it, which is what returns the memory.
          (
            for old in "${left[@]}"; do
              diskutil eject force "${old}" || true
            done
          ) < /dev/null > /dev/null 2>&1 &
          disown
        fi
        tmp=""
        if [ "$(uname -s)" = Darwin ] && [ "${{ inputs.tmp-gib }}" -gt 0 ]; then
          sectors=$(( ${{ inputs.tmp-gib }} * 1024 * 1024 * 2 ))
          # `diskutil image` is the current interface; `hdiutil` is the one a
          # macOS before it has, and prints the device the same way.
          device="$({ diskutil image attach --noMount "ram://${sectors}" 2>/dev/null || hdiutil attach -nomount "ram://${sectors}" 2>/dev/null; } | awk 'NR==1 {print $1}')"
          # The volume is a new device inside the container made on the RAM
          # store, so its mount point is read from the volume, not the store.
          if [ -n "${device}" ] && diskutil erasevolume APFS "${label}" "${device}" >/dev/null; then
            tmp="$(diskutil info "/Volumes/${label}" | awk -F': *' '/Mount Point/ {print $2}')"
          fi
        fi
        if [ -z "${tmp}" ] || [ ! -d "${tmp}" ]; then
          tmp="${RUNNER_TEMP}/lwc-tmp"
          echo "::warning::no RAM disk: temporary files are on disk at ${tmp}, where every sync_all is a device-wide F_FULLFSYNC"
          mkdir -p "${tmp}"
          find "${tmp}" -mindepth 1 -delete
        fi
        echo "TMPDIR=${tmp}" >> "${GITHUB_ENV}"
        echo "temporary files: ${tmp} ($(df -h "${tmp}" | awk 'NR==2 {print $2}'))"
    # The runner instances share this machine's cores and its 24 GiB of RAM.
    # A test job that took every core, beside others doing the same, put the
    # load average at 60-70 on 15 cores, and timing-bounded tests then measured
    # the scheduler. Worse, thirteen jobs each compiling with four slots turned
    # into 52 compiler processes and left 35 GiB of swap used (run 37654108625),
    # where a one-second hashing test took 138 s. Each job gets its share of
    # both: test threads below, compiler slots in the next step, each budgeted
    # so the sums across the run stay near the machine.
    - name: Test threads for this runner's share of the machine
      shell: bash
      run: |
        set -euo pipefail
        root="$(cd "${RUNNER_WORKSPACE}/../.." && pwd)"
        shopt -s nullglob
        instances=("${root}"/r[0-9]*/)
        runners="${#instances[@]}"
        cores="$(sysctl -n hw.ncpu 2>/dev/null || nproc)"
        threads=$(( ${{ inputs.test-share }} * cores / (runners > 0 ? runners : 1) ))
        threads=$(( threads > 1 ? threads : 2 ))
        echo "NEXTEST_TEST_THREADS=${threads}" >> "${GITHUB_ENV}"
        echo "${cores} cores, ${runners} runner instances: ${threads} test threads"
    # Compiler and linker slots for the same share. Warm compiles take seconds,
    # so this caps the thundering herd rather than sizing any one build: every
    # job compiling at once is what swapped, not any job compiling slowly.
    - name: Compiler slots for this runner's share of the machine
      shell: bash
      run: |
        set -euo pipefail
        root="$(cd "${RUNNER_WORKSPACE}/../.." && pwd)"
        shopt -s nullglob
        instances=("${root}"/r[0-9]*/)
        runners="${#instances[@]}"
        cores="$(sysctl -n hw.ncpu 2>/dev/null || nproc)"
        slots=$(( ${{ inputs.build-share }} * cores / (runners > 0 ? runners : 1) ))
        slots=$(( slots > 0 ? slots : 1 ))
        echo "CARGO_BUILD_JOBS=${slots}" >> "${GITHUB_ENV}"
        echo "${cores} cores, ${runners} runner instances: ${slots} compiler slots"
    # rustup has no lock, and parallel jobs that each ran `rustup toolchain
    # install` raced: two jobs found wasm32-wasip1 missing mid-transaction. The
    # toolchain is only installed when the pinned one is not already active.
    - name: Toolchain matches the pin
      shell: bash
      run: |
        set -euo pipefail
        active="$(rustc --version 2>/dev/null || true)"
        case "${active}" in
          "rustc ${{ inputs.toolchain }} "*) ;;
          *) rustup toolchain install; active="$(rustc --version)" ;;
        esac
        echo "${active}"
        case "${active}" in
          "rustc ${{ inputs.toolchain }} "*) ;;
          *) echo "::error::rust-toolchain.toml resolves to '${active}', the gate pins ${{ inputs.toolchain }}"; exit 1 ;;
        esac
        # The version string is not enough: another installation (Homebrew's,
        # say) can print the same version while ignoring rust-toolchain.toml and
        # carrying no cross-target std. The rustc on PATH must be the one rustup
        # resolves for this checkout.
        pinned="$(rustup which rustc)"
        pinned="${pinned%/*/*}"
        sysroot="$(rustc --print sysroot)"
        if [ "${sysroot}" != "${pinned}" ]; then
          echo "::error::rustc on PATH ($(command -v rustc), sysroot ${sysroot}) is not rustup's ${pinned}"
          exit 1
        fi
    # The binary cargo would run for `cargo nextest`, called directly: through
    # cargo that is four process starts (cargo, rustup's proxy, the toolchain's
    # cargo, then nextest), and on a thirteen-job start each of them waits.
    - name: nextest is installed
      if: inputs.nextest == 'true'
      shell: bash
      run: cargo-nextest nextest --version
    # Codegen objects (`*.rcgu.o`) that a killed compile left in the target
    # directory. rustc deletes its own when it finishes, so a cancelled or
    # timed-out job leaves the rest, and nothing else ever removes them: on
    # 2026-10-13 lwc-3's `debug/deps` held 445,426 entries, most of them these,
    # in a 62 GiB target, and the machine was past its 256 GB cap with them.
    #
    # The sweep runs beside the build, not before it. Run inline it was still
    # deleting after 301 s on lwc-3 and the 5-minute job limit cancelled the
    # job (run 38469573599), so a dirty target would have failed the job that
    # cleaned it. What it may delete is fixed by a marker made when the step
    # starts: an object not newer than the marker was written before this job
    # began, so it is not this job's and no compile of this job can need it,
    # and anything this job's compiles write is newer and is left alone. It
    # runs at the lowest priority with every descriptor closed, so neither the
    # build nor the runner waits on it; the runner's cleanup ends it with the
    # job, and what it had deleted stays deleted, so a backlog too large for
    # one job drains across several. The globs are the ones the incremental
    # sweep above uses: the host profile directories and the per-target ones.
    - name: Codegen objects left by killed compiles
      shell: bash
      run: |
        set -euo pipefail
        marker="${RUNNER_TEMP}/codegen-sweep-marker"
        : > "${marker}"
        (
          for deps in "${CARGO_TARGET_DIR}"/*/deps "${CARGO_TARGET_DIR}"/*/*/deps; do
            if [ -d "${deps}" ]; then
              nice -n 19 find "${deps}" -maxdepth 1 -name '*.rcgu.o' ! -newer "${marker}" -delete
            fi
          done
        ) < /dev/null > /dev/null 2>&1 &
        disown

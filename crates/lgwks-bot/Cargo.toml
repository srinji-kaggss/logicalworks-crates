[package]
name = "lgwks_bot"
description = "Capability-gated automation bots on a change-detecting ECS schedule: Observe, Evaluate, Execute, and Query, with an async runtime facade."
version = "1.1.0"
edition = "2024"
rust-version = "1.98"
# Deliberately not the workspace's Apache-2.0: the bot is the artefact the whole
# estate embeds, so it carries file-level copyleft while its three siblings stay
# permissive. A proprietary consumer is still permitted — MPL-2.0 §3.3 — and
# only modification of the MPL-covered files carries an obligation. See
# `LICENSING.md` at the repository root for the dual-licence model.
license = "MPL-2.0"
repository = "https://github.com/srinji-kaggss/logicalworks-crates"
documentation = "https://docs.rs/lgwks_bot"
homepage = "https://github.com/srinji-kaggss/logicalworks-crates/tree/main/crates/lgwks-bot"
readme = "README.md"
categories = ["development-tools", "asynchronous", "concurrency"]
keywords = ["automation", "bot", "workflow", "agent", "ecs"]

# The async engine is the bot's, per the deps law; its `tokio` edge is owned by
# the `lgwks_deps` storefront. `--no-default-features` withdraws the async
# surface entirely (no tokio), leaving the four verbs on `lgwks_std::task`'s
# zero-dependency executor — the ECS schedule and every verb still work.
#
# `io` is not implied by `rt` for the same reason the storefront splits it: a
# consumer reading a pipe needs `AsyncRead` without a socket layer.
[features]
default = ["rt", "time", "sync", "macros", "script"]
rt = ["lgwks_deps/tokio"]
time = ["rt", "lgwks_deps/tokio-time"]
sync = ["rt", "lgwks_deps/tokio-sync"]
macros = ["rt", "lgwks_deps/tokio-macros"]
# `script!`: the indented orchestration language and the runtime it expands
# into (`lgwks_bot::script`). Default-on because it is how flows are meant to be
# written here: every block it offers is bounded, deadline-carrying, keyed by
# tenant and step, and recorded in the `ARCHITECTURE` map. The proc macro is
# first-party (`lgwks_macros`); its `syn`/`quote` edge is owned by the
# `lgwks_deps` storefront and compiles for the host only.
script = ["rt", "time", "sync", "macros", "dep:lgwks_macros"]
# Reader/writer traits. Not implied by `rt`: a consumer reading from a pipe or a
# file needs `AsyncRead` without any of the drivers, and it is the module that
# makes `net`, `process`, and `fs` composable with each other.
io = ["rt", "lgwks_deps/tokio-io"]
net = ["io", "lgwks_deps/tokio-net"]
# `sync` is implied because the only way this crate runs a command is
# `Supervisor::spawn_process`: `Command` describes, and the supervisor is what
# starts it. A `process` build without `sync` would expose the description and
# not the sanctioned runner, which is a configuration whose only remaining
# runner is the banned `Command::spawn`. `lgwks_std/process` is the audited
# group-kill syscall (`contract/APPROVED.toml` records rustix under `lgwks_std`
# with exactly this reason: killing a shell must reach its grandchildren, which
# `Child::kill` cannot do); this enables it, and adds no dependency.
process = ["io", "sync", "time", "lgwks_std/process", "lgwks_deps/tokio-process"]
fs = ["io", "lgwks_deps/tokio-fs"]
signal = ["rt", "lgwks_deps/tokio-signal"]
# `inspect`: typed in-process structural code inspection (R8). Host-only, like
# `process`/`fs`/`net`: it pulls the native tree-sitter grammars through
# `lgwks_ast`, which cannot build for the WASI boundary target. Not on by
# default for that reason; `full` turns it on so the gate exercises it rather
# than letting it rot as an unbuilt candidate.
inspect = ["dep:lgwks_ast"]
# Minting a run identity needs an entropy source, and the estate has exactly
# one: `lgwks_std::random`, whose `random` feature is `getrandom` under
# `lgwks_std`'s ownership. This crate authors no edge of its own — it turns on a
# feature of a dependency it already has — which is what keeps the tree at one
# entropy source rather than two. `lgwks_std`'s INV-RANDOM-ONE-SOURCE is the
# reason there is no cheaper fallback here: a run id derived from a clock or a
# counter is the shortcut that invariant exists to refuse.
#
# Not on by default, and the reason was the target rather than the cost. Minting
# an identity needs OS entropy, this crate's *default* feature set is built for
# `wasm32-wasip1` by the WASI boundary job, and `lgwks_std::random` used to be
# linux/macOS/windows only with a `compile_error!` saying so. #276 withdrew that
# refusal: `random` now supports every target `getrandom` supports, and the
# `target-matrix` lane executes `cargo check -p lgwks_std --features random
# --target wasm32-wasip1`, which passes. **The blocker this default-off rested
# on is therefore gone, and whether `ephemeral` belongs on the default feature
# set is now a decision about this crate's default surface rather than about
# portability.** It stays off here so that decision is taken with its own
# evidence: the whole-workspace gate for a default-set change is the bot's, not
# `lgwks_std`'s, and #276 did not run it.
#
# This is the same shape as `signal`, which is also host-only, also not default,
# and also gated in the source. What keeps `ephemeral` from rotting meanwhile is
# that the gate exercises it anyway: `full` includes it, and the runner step
# runs `cargo test -p lgwks_bot --features full`, so `tests/it/ephemeral.rs`
# executes rather than only compiling.
ephemeral = ["lgwks_std/random"]
# `profile`: the per-stage tick profiler `bench/` publishes its decomposition
# from. Default-off for the reason `signal` and `ephemeral` are: it is an
# instrument, not a capability, and a build that pays for an instrument nobody
# asked for is a build whose numbers are about the instrument. Nothing in the
# crate's own execution path reads it, and every charge site in `ecs.rs` is
# behind this feature, so a build without it contains no clock read at all.
#
# `full` turns it on so the runner step exercises the instrument rather than
# letting it rot as an unbuilt candidate — the same treatment `inspect` gets, and
# for the same reason: the profile is only trustworthy while something compiles
# and tests it.
profile = []
full = [
    "rt",
    "time",
    "sync",
    "macros",
    "io",
    "net",
    "process",
    "fs",
    "signal",
    "ephemeral",
    "script",
    "inspect",
    "profile",
]

[dependencies]
# `hash` is enabled for the decision receipt: the flow revision and the
# option-set identity are BLAKE3 digests (`lgwks_std::hash`), which is the
# estate's only content-identity hash. The edge is already approved and already
# compiled into `lgwks_std`'s own dependency set; this only turns it on.
#
# `ron` is enabled for the flow document. A flow is written by a person, and RON
# is the estate's notation for human-facing documents, so `FlowSpec` reads both
# it and JSON through the same serde types. Like `json` and `hash` above, this
# turns on a feature of an edge that already exists rather than adding a crate.
lgwks_std = { workspace = true, features = ["json", "ron", "http", "hash", "wire"] }
# Not optional, and not behind a feature. The ECS substrate is **how a bot
# executes** — the condition is change detection rather than a re-derivation —
# so it is not a candidate the caller may decline. A default-off flag would mean
# nothing exercises it, the workspace gate never compiles it, and it rots into a
# second opinion nobody chose.
#
# `rt` still gates the async surface, so `--no-default-features` remains a real
# build: no tokio, no drivers. It does pull `bevy_ecs`, and that is the honest
# cost of one path rather than two.
lgwks_deps = { workspace = true, default-features = false, features = ["bevy-ecs"] }
# The `script!` proc macro. First-party, host-only, optional behind `script`.
lgwks_macros = { workspace = true, optional = true }
# The multi-language AST parser, behind `inspect`. `lgwks_bot` is the consumer
# INV-DEP-1 names for it; the finished parser itself is not grown. Its default
# grammar set includes the two the shipped structural rule set speaks (Rust and
# Python), so the edge needs no feature override.
lgwks_ast = { workspace = true, optional = true }

[dev-dependencies]
proptest = { version = "1.11", default-features = false, features = ["std"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]


[package]
name = "lgwks_deps"
description = "Dependency admission, the third-party storefront, and freshness for the std+ estate: every external edge names a human-approved owner."
version = "0.1.8"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/srinji-kaggss/logicalworks-crates"
documentation = "https://docs.rs/lgwks_deps"
readme = "README.md"
homepage = "https://github.com/srinji-kaggss/logicalworks-crates/tree/main/crates/lgwks-deps"
categories = ["development-tools"]
keywords = ["dependencies", "audit", "supply-chain", "lgwks"]

# The deps crate consumes JSON only through the estate facade it enforces.
# Depending on serde_json directly here would make the checker its own first
# bypass.
#
# syn is the one exception to the zero-dependency gate-tool rule, and it is
# not self-refuting: a Rust parser is the only honest way to police Rust
# source (the `scan` subcommand ports keel's zero-gate detectors so every
# estate repo runs the same verdicts from one binary). Pinned to the same
# major the estate already vets for serde's derive stack. `scan` is a default
# feature so `cargo install lgwks_deps` keeps working with no flags;
# embedders who only call `check_dependencies` can disable default features.
[features]
default = ["scan"]
scan = ["dep:syn", "dep:proc-macro2"]
# Storefront features. `lgwks_deps` is the estate's install-and-select surface:
# the end user enables exactly the third-party capability they want, and the
# default build pulls none of them. gpui is Zed's GPU desktop UI framework;
# `tokio` is the async engine behind `lgwks_bot`'s runner surface.
gpui = ["dep:gpui", "gpui/default"]
appcui = ["dep:appcui"]
# ML inference storefront. Candle is HuggingFace's minimalist Rust ML framework:
# `ml-candle` brings tensor compute, NN layers, and the transformer model
# registry; `ml-candle-metal` adds the macOS Metal backend to that set.
# `ml-tokenizers` is the HuggingFace subword tokenizer used for tokenizer
# parity with the reference runtime. All three stay default-off, so the default
# `scan` build and every consumer that does not select them pull none of
# Candle's closure.
ml-candle = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers"]
ml-candle-metal = ["ml-candle", "candle-transformers/metal"]
ml-tokenizers = ["dep:tokenizers"]
tokio = ["dep:tokio"]
tokio-time = ["tokio", "tokio/time"]
tokio-sync = ["tokio", "tokio/sync"]
tokio-macros = ["tokio", "tokio/macros"]
tokio-net = ["tokio", "tokio/io-util", "tokio/net"]
tokio-process = ["tokio", "tokio/process"]
tokio-fs = ["tokio", "tokio/fs"]
tokio-signal = ["tokio", "tokio/signal"]
tokio-full = [
    "tokio-time",
    "tokio-sync",
    "tokio-macros",
    "tokio-net",
    "tokio-process",
    "tokio-fs",
    "tokio-signal",
]

[dependencies]
lgwks_std = { workspace = true, features = ["json"] }
syn = { version = "2", features = ["full", "visit", "parsing"], optional = true }
proc-macro2 = { version = "1", features = ["span-locations"], optional = true }
gpui = { version = "0.2", optional = true }
appcui = { version = "=0.5.1", default-features = false, optional = true }
# The engine is compiled `default-features = false` with the portable `rt`
# feature always on. Native targets add `rt-multi-thread`; WASM targets use the
# current-thread runtime because Tokio does not provide its multi-thread driver
# there. Every other driver is a storefront feature the consumer selects.
tokio = { version = "1", default-features = false, features = ["rt"], optional = true }
# Candle and the HuggingFace tokenizer are storefront edges: optional and
# default-off, so `cargo build`/`cargo install` pulls none of them. Model
# weights load from local files; `candle-transformers` itself pulls `hf-hub`,
# so selecting `ml-candle` does compile a network-capable closure even though
# the runtime reads a local checkpoint.
candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }
candle-transformers = { version = "0.11", default-features = false, optional = true }
tokenizers = { version = "0.23", optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { version = "1", default-features = false, features = ["rt-multi-thread"], optional = true }

[[bin]]
name = "lgwks-deps"
path = "src/main.rs"

[lib]
name = "lgwks_deps"
path = "src/lib.rs"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

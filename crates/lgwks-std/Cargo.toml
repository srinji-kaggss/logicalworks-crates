[package]
name = "lgwks_std"
description = "Everyday Rust primitives with no async runtime required: codecs, timestamps, ids, hashing, regex, JSON/RON/wire, HTTP, and default structured-debugging install. One audited stack per feature — a stack is not always one crate (json is serde + serde_json, ron is serde + ron, http is ureq + iri-string)."
version = "2.2.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/srinji-kaggss/logicalworks-crates"
documentation = "https://docs.rs/lgwks_std"
readme = "README.md"
homepage = "https://github.com/srinji-kaggss/logicalworks-crates/tree/main/crates/lgwks-std"
categories = ["development-tools", "encoding", "asynchronous"]
keywords = ["stdlib", "zero-dependencies", "json", "tracing", "debug"]

# INV-STDPLUS-APPROVED-ONLY: every dependency here is a vetted leaf or
# single-purpose stack with zero further external deps. The gate test
# `deps_are_approved_leaves` in ../lgwks-deps/src/lib.rs reads this
# file and verifies each entry is on the approved list.
#
# APPROVED STACK (2026-08-24):
#   blake3        — 3 zero-dep leaves (arrayvec, cfg-if, constant_time_eq)
#   regex         — 4 BurntSushi-internal crates, zero external deps
#   rkyv          — 5 djkoloski crates (rend, ptr_meta, rancor, munge + derive)
#                   proc-macro stack shared with serde
#   serde         — 1 crate + derive (proc-macro2, quote, syn — same stack)
#   serde_json    — 2 crates beyond serde (itoa, ryu — both zero-dep leaves)
#                   reuses memchr from regex tree
#   ron           — 1 crate beyond serde (bitflags — zero-dep leaf)
#                   Rust-native config/data notation; serde-based
#   getrandom     — 0-dep leaves in std-only mode for supported OSes
#   ed25519-dalek — detached signatures: curve25519-dalek (fiat backend) plus
#                   the RustCrypto signature/sha2/subtle/zeroize leaves; no
#                   rand_core, because keygen reads lgwks_std::random instead.
#                   default-features off with `alloc` only, so no std-gated
#                   error impls enter: the module's typed errors carry no
#                   upstream source.
#   ureq          — blocking HTTP client, rustls-only (no gzip/cookies/json
#                   extras); closure is the rustls TLS stack plus small leaves
#   iri-string    — zero-dep URI validation leaf at default features
#   rustix        — safe POSIX syscall surface for the fs-raw and process
#                   primitives stable std does not expose; Unix-only, optional
#   thiserror     — not here; the typed-error derive is owned by `lgwks_ast`
#                   so the core stack stays lean
#   tracing       — event/span facade.
#   tracing-subscriber — default debugger bootstrap: env filters, compact local
#                   output, JSON production output, and a fallible global
#                   installer. `attributes` stays off, so no instrumentation
#                   proc macro enters the foundation.
[features]
# `trace` is default-on, and that is a recorded decision rather
# than a convenience. Library code here does not print to the terminal, and
# `tracing` is the replacement. Until this feature
# existed, no crate here could reach `tracing` at all, so the requirement
# banned the only logging path that was actually available and named one that
# was not. `--no-default-features --features core` withdraws it and restores a
# genuinely zero-dependency build.
default = ["core", "trace"]
core = []
trace = ["dep:tracing", "dep:tracing-subscriber"]
random = ["dep:getrandom"]
hash = ["dep:blake3"]
sign = ["random", "hash", "dep:ed25519-dalek"]
pattern = ["dep:regex"]
json = ["dep:serde", "dep:serde_json"]
ron = ["dep:serde", "dep:ron"]
wire = ["dep:rkyv"]
http = ["dep:ureq", "dep:iri-string"]
online = []
fs-raw = ["dep:rustix"]
process = ["dep:rustix", "rustix?/process"]
full = ["trace", "random", "hash", "sign", "pattern", "json", "ron", "wire", "http", "online", "fs-raw", "process"]

[dependencies]
# `attributes` is deliberately NOT enabled. It is the half of `tracing` that
# provides `#[instrument]`, and it expands through `tracing-attributes`, which
# expands through `syn`, a proc-macro stack that is not permitted outside the
# `lgwks_deps` gate tool.
tracing = { version = "0.1", default-features = false, features = ["std"], optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter", "json", "ansi", "registry"], optional = true }
blake3 = { version = "1.8", default-features = false, optional = true }
regex = { version = "1.13", optional = true }
rkyv = { version = "0.8", default-features = false, features = ["alloc", "bytecheck"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
# `float_roundtrip` adds no crate: without it the parser takes a fast path that
# reads some exact decimals one ULP off (`997272.1318359375` read back as the
# next float up), so a value this crate wrote did not read back as itself.
serde_json = { version = "1", features = ["float_roundtrip"], optional = true }
ron = { version = "0.12", optional = true }
getrandom = { version = "0.4", optional = true }
ed25519-dalek = { version = "2.2", default-features = false, features = ["alloc"], optional = true }
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }
iri-string = { version = "0.7", optional = true }

# Unix only: Windows reaches its kernel through `kernel32` in `process/windows.rs`.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "fs"], optional = true }

[dev-dependencies]
proptest = { version = "1.11", default-features = false, features = ["std"] }
tempfile = "3.20"

# The workspace lint table, copied because Cargo cannot override one inherited
# lint (`workspace = true` admits no per-member entry). ONE line differs:
# `unsafe_code = "allow"`, for the direct syscalls behind FFI isolation the
# Director admitted on 2026-10-12 (#345, #263, `src/process/darwin.rs` and `src/process/windows.rs`). A source
# `#[allow(unsafe_code)]` is a suppression rust-guard refuses, and under the
# workspace's `forbid` it would be E0453, so the exception lives here instead.
# Two tests hold it closed: `lint_table_matches_the_workspace_but_for_unsafe`
# (every other entry equals the workspace's) and
# `only_the_darwin_and_windows_syscall_modules_use_unsafe` (no other file in this crate
# writes `unsafe`).
[lints.rust]
missing_docs = "deny"
unsafe_code = "allow"
unused_must_use = "forbid"
improper_ctypes = "forbid"
improper_ctypes_definitions = "forbid"

[lints.clippy]
allow_attributes = "forbid"
allow_attributes_without_reason = "forbid"
arithmetic_side_effects = "forbid"
as_conversions = "forbid"
assigning_clones = "forbid"
await_holding_lock = "forbid"
await_holding_refcell_ref = "forbid"
borrow_as_ptr = "forbid"
cast_possible_truncation = "forbid"
cast_precision_loss = "forbid"
cast_sign_loss = "forbid"
clone_on_ref_ptr = "forbid"
dbg_macro = "forbid"
empty_drop = "forbid"
exhaustive_enums = "forbid"
exhaustive_structs = "forbid"
exit = "forbid"
expect_fun_call = "forbid"
expect_used = "forbid"
explicit_deref_methods = "forbid"
float_cmp = "forbid"
fn_params_excessive_bools = "forbid"
format_push_string = "forbid"
implicit_clone = "forbid"
integer_division = "forbid"
iter_over_hash_type = "forbid"
large_stack_arrays = "forbid"
let_underscore_future = "forbid"
let_underscore_must_use = "forbid"
lossy_float_literal = "forbid"
manual_contains = "forbid"
map_entry = "forbid"
mem_forget = "forbid"
mem_replace_with_default = "forbid"
min_ident_chars = "forbid"
missing_assert_message = "forbid"
missing_docs_in_private_items = "forbid"
missing_safety_doc = "forbid"
modulo_arithmetic = "forbid"
multiple_unsafe_ops_per_block = "forbid"
must_use_candidate = "forbid"
needless_collect = "forbid"
needless_lifetimes = "forbid"
needless_range_loop = "forbid"
panic = "forbid"
panicking_unwrap = "forbid"
pattern_type_mismatch = "forbid"
print_stderr = "forbid"
print_stdout = "forbid"
ptr_arg = "forbid"
rc_buffer = "forbid"
redundant_clone = "forbid"
ref_option_ref = "forbid"
slow_vector_initialization = "forbid"
str_to_string = "forbid"
string_add = "forbid"
todo = "forbid"
transmute_ptr_to_ref = "forbid"
unchecked_time_subtraction = "forbid"
undocumented_unsafe_blocks = "forbid"
unimplemented = "forbid"
unused_io_amount = "forbid"
unwrap_in_result = "forbid"
unwrap_or_default = "forbid"
unwrap_used = "forbid"
wildcard_imports = "forbid"
disallowed_methods = "deny"
disallowed_types = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "pattern-workloads"
required-features = ["pattern"]

[[example]]
name = "digest_timing"
required-features = ["hash", "trace"]

[[test]]
name = "http_alloc"
path = "tests/http_alloc.rs"
required-features = ["http"]

# Owns its process, and is its own binary for that reason: a shutdown closes
# the blocking pool's admission for the life of the process, so no other test
# could run beside it. It is the only place the public
# `configure_blocking_pool` and `shutdown_blocking_pool` can be driven against
# the real process-wide pool (#264).
[[test]]
name = "sim_task_pool_public"
path = "tests/sim_task_pool_public.rs"


# The estate catalog (#732): one row per capability this repository owns, with
# the path that owns it, the crate and feature that carry it, and whether it is
# on by default.
#
# This file is the source of truth. `docs/catalog.md` is generated from it
# (never edited), the published page renders from it, `lgwks-deps catalog
# --json` prints it, and the `catalog` lane refuses a catalog that disagrees
# with the tree: a row whose file does not exist, a row naming a feature its
# crate does not declare, a capability the gate can refuse with no row, or a
# generated page that differs from a fresh render.
#
# Fields
#   name      the capability as a person or an agent searches for it
#   path      the Rust path that owns it (omitted for a documentation capability)
#   file      the source or document that implements it, relative to the root
#   crate     the publishing crate, or `repository` for the repository itself
#   feature   the cargo feature that carries it, or `always` when no feature gates it
#   default   `on` or `off`; `off` requires `reason`
#   words     the spellings a search may use to reach the owner
#   replaces  the hand-rolled thing an agent writes when it cannot find the owner,
#             which is what the std-first gate refuses

[[capability]]
name = "build scripts"
path = "lgwks_std::build"
file = "crates/lgwks-std/src/build.rs"
crate = "lgwks_std"
feature = "build"
default = "on"
words = ["build script", "build.rs", "rerun-if-changed", "OUT_DIR", "cargo directive", "input digest", "build input"]
replaces = ["println!(\"cargo:rerun-if-changed=…\")", "a sha2 digest of the build inputs", "std::env::var(\"OUT_DIR\")"]


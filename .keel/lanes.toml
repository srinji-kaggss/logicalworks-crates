# Generated by `keel init`; the keel binary executes this file as the
# repository's one task graph. Edit lanes here, never in CI configuration.
# Probed facts: gating-roots=1 toolchain=1.98.0
schema = "keel-lanes/v2"

[env]
CARGO_TARGET_DIR = "{{target}}"
KEEL_DIFFERENTIAL_DIR = "{{run}}/differential"
KEEL_REPO_ROOT = "{{repo}}"
KEEL_RUN_ROOT = "{{run}}"

[[lane]]
id = "ci/build"
program = "cargo"
args = ["build", "--locked", "--manifest-path", "{{repo}}/Cargo.toml"]
cwd = "{{repo}}"
writes_tree = false

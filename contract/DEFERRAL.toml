# Deferred dependency catalog — crates the estate does not admit on day 0.
#
# Each row names the estate owner that must be fixed first and the measured
# trigger that would admit the crate. Until the trigger is met, adding the
# crate creates a second owner and a larger cold build. A request that needs
# one of these links its issue and shows the measured gap; a rejected request
# is closed with the trigger and the owner, not with "not now".
#
# Read by `lgwks_deps`: an approval the catalog still defers is refused as
# `DeferredAdmitted`, naming the owner and the trigger. The catalog is opt-in;
# a repository without one is audited exactly as before.
#
# Families follow srinji-kaggss/logicalworks-crates#724 (post-revenue), #725
# (data layer), #726 (platform) and #727 (edge). Day-0 optionals that need a
# trigger of their own close the file.

[[deferred]]
crate = "openraft"
family = "data-layer"
owner = "logical-DB"
trigger = "A paid multi-node replication requirement arrives with a measured failover test the single node cannot pass."
replacement = "openraft behind lgwks_deps with the estate log as the source of truth."
review = "https://github.com/srinji-kaggss/logicalworks-crates/issues/725"
deferred_on = "2026-10-26"


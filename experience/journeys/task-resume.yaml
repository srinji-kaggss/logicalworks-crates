id: task-resume
actor: agent-or-human-dev
job: Run a multi-step task that the process may die in the middle of, and pick it up
  again without repeating the steps that already finished and without being told a
  finished step finished when nothing durable was written.
prior_knowledge:
  - Knows the steps of their own task body; has not read the task module.
  - Assumes a successful report means the work can be resumed, and assumes
    "at-least-once" is free. Both are wrong without a store, and this journey is
    where they learn which claim they are actually holding.
start:
  installation: "lgwks-bot built with `script`; optionally a store directory the process can write."
  state: a task whose steps are durable work, and a process that may be killed
    between two of them.
success:
  visible_outcome: "after a kill -9, the same run id resumes: finished steps are
    returned from the record without running, the interrupted step runs exactly
    once, the final output equals the uninterrupted one, and a report that
    stopped says where it stopped and carries the ticket that resumes it."
states:
  - name: unrecorded
    expectation: no store installed, the report says so and offers no ticket; a
      step re-runs on every call and nothing is claimed to be durable.
  - name: recorded
    expectation: a completed step with a committed record returns its decoded
      value without the future being polled at all.
  - name: interrupted
    expectation: a report that ended refused/failed/timed out/cancelled names its
      run id and the step path it stopped at, and that ticket resumes it.
  - name: torn
    expectation: an interrupted final append is dropped as the incomplete tail it
      is, earlier records survive untouched, and the step re-runs once.
  - name: refused
    expectation: over-cap records, an unreadable store and another tenant's run
      id are each a typed refusal naming the bound or the owner, never a silent
      re-run and never a cross-tenant read.
  - name: parked
    expectation: "the record device has stopped answering. A step awaiting its
      record is a wait the runtime may await, not a thread parked inside an fsync.
      Unrelated work keeps taking turns, and an operator with a separate handle can
      release the device."
  - name: abandoned
    expectation: "a step whose record was still being written is dropped. The store
      is still a store afterwards — it reopens, is never duplicated, and the resume
      reaches the same value whether the record landed or not."
invariants:
  - A step runs if and only if the store has no committed record for its key.
  - A record is committed (written and synced) before its value is returned.
  - Committed evidence is never truncated, compacted away or rewritten by a cap.
  - Records are keyed by tenant; a run id belongs to the tenant that minted it.
  - A step that ran but whose record did not land re-runs on resume, so a durable
    run is at-least-once for an *unrecorded* step and exactly-once for a recorded
    one. External effects still need the effect journal.
  - "A durable record reaches the disk on a thread of the store's own, so no
    executor thread ever waits inside a flush. Ordering between appends is the
    owner's, and is the same order the file sees."
  - "The store's frames and the effect journal's frames are one grammar, so what a
    torn tail is cannot be answered two ways."
trust_boundaries:
  - "The store directory is the host's authority: a step key that is not in it has
    not run, and a record that is in it is the truth about that step."
  - The device is untrusted. An append either lands whole or is refused; the store
    never claims a record it did not sync.
recovery_contracts:
  - Every refusal names the bound that was hit or the tenant that refused, and
    says the repair (raise the cap, use the owning tenant, reopen the store).
  - A resume never silently reruns a successful prefix; the replay is visible in
    the trail as steps entered without a record lookup.
  - A torn tail loses only its own incomplete record.
agent_contracts:
  - "`remember` reports the disposition it observed: replayed, recorded, or the
    step's own failure located at the step."
  - The host claims durability only when a store is installed, and a report with
    no store says so in the same field a reader checks.
probes:
  - id: kill9-resume-does-not-rerun-finished-steps
    action: Spawn the test binary as a child with the store env set, let it record
      two steps and exit hard at a marker file; kill -9 it; resume in the parent
      under the same run id; assert marker counts of 1 for the finished steps, 1
      for the interrupted step, and equal final output.
  - id: same-seed-same-resume-trace
    action: Sweep a band of seeds with seeded crash points at every step
      boundary; run the sweep twice; assert identical trace hashes.
  - id: two-tenants-one-run-id
    action: Mint a run under tenant A, then resume it under a tenant-B host
      concurrently with a tenant-A resume; assert the B resume is a typed refusal
      and A's records are untouched.
  - id: torn-tail-loses-only-its-own-record
    action: Append a record, truncate the file mid-frame, reopen, and assert the
      earlier record decodes and the torn one is ignored.
  - id: caps-refuse-without-truncating
    action: Lower the per-record, per-run and total-byte ceilings; assert each is a
      typed refusal naming the bound, and that the earlier records still read.
  - id: parked-record-device-lets-the-runtime-turn
    action: "Open the store with its storage gate closed, drive a step and an
      unrelated self-waking task on one driver, and have an independent OS thread
      release the device once the unrelated task has taken at least 64 turns; assert
      the turn count, and that the released record reads back from a fresh handle."
  - id: abandoned-record-leaves-the-store-consistent
    action: "Park the device, poll a step once so the owner holds the request, drop
      the step, keep the unrelated task turning until the watchdog releases; assert
      the turn count, that the store reopens, that the record is not duplicated, and
      that the resume reaches the same value."
  - id: scale-tiers-100-1000-10000
    action: "Run each tier of 100, 1000 and 10000 runs against one store with two
      tenants alternating, then reopen the store and assert every run holds exactly
      one record attributed to its own tenant; report p50/p95/p99 and peak RSS."
  - id: frontier-cost-against-the-journal
    action: "Measure a plain step, a remember through the store, and one
      FileJournal append at the same payload size in one harness, and report p50,
      p95 and p99 for each."
  - id: contention-loses-nothing
    action: "Sweep seeded concurrent appends, repeated submissions, replayed steps
      and interleaved tenants against the real store; assert no record is lost,
      doubled, or attributed to another tenant, and that a same seed replays to the
      same trace hash."

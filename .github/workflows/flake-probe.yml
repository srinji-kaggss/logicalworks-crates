name: flake-probe
on:
  pull_request:
    paths: [".github/workflows/flake-probe.yml"]
jobs:
  probe:
    name: process_escape under load
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TMPDIR: /dev/shm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - uses: taiki-e/install-action@nextest
      - name: Build the test binary
        run: cargo nextest run -p lgwks_bot --all-targets --locked --features full -E 'not test(saturation_r32_tier)' --no-run
      - name: Replay shard 2 of 4 as CI runs it, repeatedly
        run: |
          cargo nextest run -p lgwks_bot --all-targets --locked --features full -E 'not test(saturation_r32_tier)' --partition count:2/4 --no-fail-fast --retries 0 --stress-count 12 2>&1 | sed -E 's/\x1b\[[0-9;]*m//g' | grep -E "FAIL|Summary|panicked|ps for the leader|iteration" | head -80
